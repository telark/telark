# Release: publish the telark and telark-crds charts to the OCI registry
# (oci://ghcr.io/<owner>/charts) and cosign-sign every pushed chart. A manual run bumps
# each selected chart from its OWN Chart.yaml version (the two version independently),
# writes the result (and the Telark appVersion) back to Chart.yaml and commits it.
# A pushed `v*` tag publishes both charts at their Chart.yaml versions as-is. A version
# already in the registry fails the run before anything is pushed. telark-crds goes
# first; only telark is tagged (v<version>) and gets a GitHub release, whose notes
# and CHANGELOG.md both come from cliff.toml, with a Dashboard UI part taken from
# telark/dashboard-ui's CHANGELOG.md. telark-crds is never tagged/released.
name: Release · Publish Charts
run-name: Publish charts (${{ github.event.inputs.chart || 'both' }} · bump ${{ github.event.inputs.bump || 'current' }})

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      chart:
        description: "Which chart(s) to publish"
        type: choice
        default: both
        options:
          - both
          - telark
          - telark-crds
      bump:
        description: "Semver bump applied to the chart version (base = Chart.yaml)"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      release_type:
        description: "telark GitHub release kind"
        type: choice
        default: auto
        options:
          - auto        # pre-release if the version has a semver suffix, else release
          - release
          - prerelease

permissions:
  contents: write   # commit the version bump + push the release tag / create the release
  packages: write
  pull-requests: read   # git-cliff reads PR numbers + authors for the changelog
  id-token: write   # keyless cosign signing via GitHub OIDC

concurrency:
  group: release-charts
  cancel-in-progress: false

env:
  CHART_DIR: charts/telark
  CRDS_DIR: charts/telark-crds

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags so git-cliff can build the changelog

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          # No root go.sum: key the cache on the file that pins helm-docs instead.
          cache-dependency-path: .github/actions/helm-docs-regenerate/action.yaml

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve registry + selected charts
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
          # CRDs first, so they exist before the app that assumes them.
          case "${{ github.event.inputs.chart || 'both' }}" in
            telark)      dirs="$CHART_DIR" ;;
            telark-crds) dirs="$CRDS_DIR" ;;
            *)           dirs="$CRDS_DIR $CHART_DIR" ;;
          esac
          {
            echo "dirs=$dirs"
            echo "telark_current=$(yq e '.version' "$CHART_DIR/Chart.yaml")"
            echo "crds_current=$(yq e '.version' "$CRDS_DIR/Chart.yaml")"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate next telark version
        id: telark_semver
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chart != 'telark-crds' }}
        uses: ./.github/actions/semver-bump
        with:
          version: ${{ steps.meta.outputs.telark_current }}
          bump: ${{ github.event.inputs.bump }}

      - name: Calculate next telark-crds version
        id: crds_semver
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chart != 'telark' }}
        uses: ./.github/actions/semver-bump
        with:
          version: ${{ steps.meta.outputs.crds_current }}
          bump: ${{ github.event.inputs.bump }}

      # appVersion is the Telark release (telark's version). Only on chart=both does telark-crds take
      # it and telark's telark-crds dependency move to the new CRD version; otherwise both stay.
      - name: Write chart versions
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TELARK_NEXT: ${{ steps.telark_semver.outputs.next_version }}
          CRDS_NEXT: ${{ steps.crds_semver.outputs.next_version }}
        run: |
          set -euo pipefail
          if [ -n "$TELARK_NEXT" ]; then
            yq -i '.version = strenv(TELARK_NEXT) | .appVersion = strenv(TELARK_NEXT)' "$CHART_DIR/Chart.yaml"
          fi
          if [ -n "$CRDS_NEXT" ]; then
            yq -i '.version = strenv(CRDS_NEXT)' "$CRDS_DIR/Chart.yaml"
          fi
          if [ -n "$TELARK_NEXT" ] && [ -n "$CRDS_NEXT" ]; then
            yq -i '.appVersion = strenv(TELARK_NEXT)' "$CRDS_DIR/Chart.yaml"
            yq -i '(.dependencies[] | select(.name == "telark-crds") | .version) = strenv(CRDS_NEXT)' "$CHART_DIR/Chart.yaml"
          fi

      - name: Add Helm dependency repos
        uses: ./.github/actions/helm-add-dependency-repos

      - name: Package, publish + sign
        id: publish
        env:
          COSIGN_YES: "true"
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRDS_REPINNED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chart == 'both' }}
        run: |
          set -euo pipefail
          registry="${{ steps.meta.outputs.registry }}"
          repo="${registry#oci://}"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          mkdir -p .cr-release
          # Never republish: check every selected chart before pushing any of them.
          existing=0
          for dir in ${{ steps.meta.outputs.dirs }}; do
            name=$(yq e '.name' "$dir/Chart.yaml")
            version=$(yq e '.version' "$dir/Chart.yaml")
            if helm show chart "${registry}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "::error::${name} ${version} is already published to ${registry}; refusing to overwrite it"
              existing=1
            fi
          done
          [ "$existing" -eq 0 ] || exit 1
          for dir in ${{ steps.meta.outputs.dirs }}; do
            name=$(yq e '.name' "$dir/Chart.yaml")
            version=$(yq e '.version' "$dir/Chart.yaml")
            # A re-pinned telark-crds (pushed just above) is new to Chart.lock: re-resolve it.
            if [ "$dir" = "$CHART_DIR" ] && [ "$CRDS_REPINNED" = "true" ]; then
              helm dependency update "$dir"
            elif [ "$dir" = "$CHART_DIR" ]; then
              helm dependency build "$dir"
            fi
            helm package "$dir" --destination .cr-release
            helm push ".cr-release/${name}-${version}.tgz" "$registry" 2>&1 | tee .cr-release/push.log
            digest=$(awk '/[Dd]igest:/{print $NF}' .cr-release/push.log)
            echo "signing ${repo}/${name}@${digest}"
            # Credentials passed per call: `cosign login` would write them to
            # ~/.docker/config.json in plaintext (and warn about it).
            cosign sign --registry-username "$REGISTRY_USER" --registry-password "$REGISTRY_TOKEN" \
              "${repo}/${name}@${digest}"
            # Only the app chart gets a repo tag + release; telark-crds does not.
            if [ "$dir" = "$CHART_DIR" ]; then
              echo "telark_version=${version}" >> "$GITHUB_OUTPUT"
            fi
          done

      # The UI ships from telark/dashboard-ui (build-ui.yaml), whose CHANGELOG.md has a section per
      # UI version: carry the ones since the previous release's UI version into cliff.toml's body.
      - name: Collect dashboard UI changes
        if: ${{ github.event_name == 'workflow_dispatch' && steps.publish.outputs.telark_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UI_REPO: telark/dashboard-ui
        run: |
          set -euo pipefail
          # By version, not ancestry: a released tag can sit outside main's history.
          prev_tag=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/v[0-9]*')
          if [ -z "$prev_tag" ]; then echo "no previous release"; exit 0; fi
          ui_prev=$(git show "${prev_tag}:${CHART_DIR}/values.yaml" | yq e '.services.ui.version' -)
          ui_now=$(yq e '.services.ui.version' "$CHART_DIR/values.yaml")
          if [ "$ui_prev" = "$ui_now" ]; then echo "dashboard UI unchanged (${ui_now})"; exit 0; fi
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${UI_REPO}/contents/CHANGELOG.md?ref=v${ui_now}" > "$RUNNER_TEMP/ui-changelog.md" || true
          delim="UI_NOTES_$(openssl rand -hex 16)"
          {
            echo "TELARK_UI_NOTES<<${delim}"
            echo "v${ui_prev} → [v${ui_now}](https://github.com/${UI_REPO}/releases/tag/v${ui_now})"
            echo
            # The UI sections newer than ui_prev, headings two levels down.
            awk -v now="## [${ui_now}]" -v prev="## [${ui_prev}]" '
              index($0, now) == 1 { on = 1 }
              index($0, prev) == 1 { on = 0 }
              on { sub(/^##/, "####"); print }
            ' "$RUNNER_TEMP/ui-changelog.md"
            echo "${delim}"
          } >> "$GITHUB_ENV"

      # Prepend the new version's section to CHANGELOG.md (git-cliff, Conventional
      # Commits); older sections are kept as written. --tag labels the just-bumped
      # commits under the release version, since the git tag is created a step later.
      - name: Generate changelog
        if: ${{ github.event_name == 'workflow_dispatch' && steps.publish.outputs.telark_version != '' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.publish.outputs.telark_version }} --prepend CHANGELOG.md
        env:
          OUTPUT: ${{ runner.temp }}/changelog-section.md

      # The same release section, alone, as the GitHub Release body.
      - name: Generate release notes
        if: ${{ github.event_name == 'workflow_dispatch' && steps.publish.outputs.telark_version != '' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.publish.outputs.telark_version }} --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Regenerate VALUES.md
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/helm-docs-regenerate

      - name: Commit version bumps
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Same command as `make values-docs` and the CI drift check — regenerated
          # by the step above, so the bump never leaves VALUES.md stale.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART_DIR/Chart.yaml" "$CHART_DIR/Chart.lock" "$CRDS_DIR/Chart.yaml" \
                  "$CHART_DIR/VALUES.md" "$CRDS_DIR/VALUES.md" CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no version changes to commit"
          else
            git commit -m "chore(release): bump chart version(s) [skip ci]"
            git push
          fi

      # Only telark is tagged + released on the repo. The version's semver
      # pre-release suffix (e.g. 1.2.0-rc.1) decides release vs pre-release.
      - name: Tag + release telark
        if: ${{ steps.publish.outputs.telark_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELARK_VERSION: ${{ steps.publish.outputs.telark_version }}
        run: |
          set -euo pipefail
          v="$TELARK_VERSION"
          tag="v${v}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists — skipping tag + release"
            exit 0
          fi
          # release_type=auto derives from the semver suffix; release/prerelease force it.
          pre=""
          case "${{ github.event.inputs.release_type || 'auto' }}" in
            prerelease) pre="--prerelease" ;;
            release)    pre="" ;;
            *)          case "$v" in *-*) pre="--prerelease" ;; esac ;;
          esac
          git tag "$tag"
          git push origin "$tag"          # pushed with GITHUB_TOKEN, so it does not re-trigger this workflow
          gh release create "$tag" --title "$tag" --notes-file "${{ runner.temp }}/release-notes.md" $pre
