{{/*
NATS credentials, one Secret per user: discovery publishes, notifier consumes.
Each password is looked up before it is generated so an upgrade keeps the value
already in the cluster — regenerating it would drop the running NATS server and
every connected client mid-rollout. The server env-expands both users in
nats.configuration (values.yaml); each client mounts only its own Secret.
resource-policy keep: an uninstall or a failed render must not drop the credentials.
*/}}
{{- range $user := list "publisher" "consumer" }}
{{- if not (index ($.Values.nats.existingSecrets | default dict) $user) }}
{{- $secretName := include "telark.natsSecretName" (dict "root" $ "user" $user) -}}
{{- $existing := lookup "v1" "Secret" $.Values.app.namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: nats
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ $user | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- end }}
