apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: passkeys.{{ include "telark.apiGroup" $ }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: {{ include "telark.apiGroup" $ }}
  names:
    kind: Passkey
    plural: passkeys
    singular: passkey
    shortNames:
      - tpk
    categories:
      - telark-auth
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - userId
                - credentialId
                - publicKey
                - deviceName
                - deviceType
              properties:
                userId:
                  type: string
                  description: User ID associated with this credential
                credentialId:
                  type: string
                  description: Unique credential identifier
                  maxLength: 2048
                publicKey:
                  type: string
                  description: Public key for passkey authentication
                  maxLength: 4096
                deviceName:
                  type: string
                  description: Device name or label for this credential
                creationTimestamp:
                  type: string
                  format: date-time
                  description: Timestamp when the credential was created
                lastUsedTimestamp:
                  type: string
                  format: date-time
                  description: Timestamp when the credential was last used
                deviceType:
                  type: string
                  enum:
                    - platform
                    - cross-platform
                  description: Type of device (platform or cross-platform)
                backupEligible:
                  type: boolean
                  description: Backup Eligible flag from WebAuthn authenticator data (indicates if credential is eligible for backup)
                backupState:
                  type: boolean
                  description: Backup State flag from WebAuthn authenticator data (indicates current backup state)

