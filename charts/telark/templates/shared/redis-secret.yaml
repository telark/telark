{{/* Looked up so an upgrade keeps the password Redis and its clients share. Rendered only while
redis.auth.existingSecret names this chart-generated Secret; an operator's own is left alone. */}}
{{- $secretName := include "telark.redisSecretName" . -}}
{{- if eq $secretName (printf "%s-redis-secret" .Release.Name) }}
{{- $existing := lookup "v1" "Secret" .Values.app.namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "redis-password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  redis-password: {{ $password | b64enc | quote }}
{{- end }}
