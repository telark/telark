# git-cliff configuration — https://git-cliff.org
# Renders both CHANGELOG.md (make changelog, release workflow) and the GitHub Release notes.

[remote.github]
owner = "telark"
repo = "telark"

[changelog]
header = """
# Changelog

All notable changes to Telark are documented here.\n
"""
body = """
{%- set repo_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ repo_url }}/pull/{{ commit.remote.pr_number }})){% endif %}
{%- endfor %}
{% endfor %}
{%- set contributors = github.contributors | filter(attribute="username") | map(attribute="username") | unique | sort -%}
{% if contributors | length > 0 %}
### Contributors
{% for username in contributors %}{% if username is not ending_with("[bot]") %}
- [@{{ username }}](https://github.com/{{ username }})
{%- endif %}{% endfor %}
{% endif %}\n
"""
footer = """
{%- set repo_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% for release in releases -%}
{% if release.version and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ repo_url }}/compare/{{ release.previous.version }}...{{ release.version }}
{% elif release.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ repo_url }}/releases/tag/{{ release.version }}
{% elif release.previous.version -%}
[unreleased]: {{ repo_url }}/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The first commit parser already files breaking commits; true would only let them bypass .cliffignore.
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # The PR link comes from the GitHub integration, so drop the squash-merge "(#123)" suffix.
  { pattern = '(?m) *\(#[0-9]+\)$', replace = "" },
]
# First match wins; the HTML comments only order the sections.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 5 -->💥 Breaking Changes" },
  { message = '^[a-z]+\((release|ci|build|tests?)\)', skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^security", group = "<!-- 3 -->🔐 Security" },
  { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
  # Everything else (refactor, test, style, chore, ci, build, …) is maintenance, not release news.
  { message = ".*", skip = true },
]
