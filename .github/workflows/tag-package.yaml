# Release: bump a shared package's version and create an annotated git tag for it.
name: Release · Tag Package
run-name: Tag package "${{ inputs.package }}" (bump "${{ inputs.build_type }}")
on:
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: choice
        description: Package
        options:
          - data
          - rest
          - kcore
          - x-ware
      build_type:
        required: false
        type: choice
        description: Package Build Type
        options:
          - patch
          - minor
          - major
      branch:
        required: false
        description: Branch to build from
        default: main

env:
  GOWORK: "off"

jobs:
  # test and lint run in parallel: -race builds are not reusable by lint, so one
  # job paid both compiles back to back (data, cold: 310 s + 202 s).
  verify:
    name: Verify · ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [test, lint]
    steps:
      - name: Checkout telark repo (for local actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Package Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: telark/${{ github.event.inputs.package }}
          token: ${{ secrets.ACCESS_TOKEN }}
          path: package
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Go CI
        uses: ./.github/actions/go-ci
        with:
          working-directory: package
          cache-key: ${{ github.event.inputs.package }}-${{ matrix.task }}
          test: ${{ matrix.task == 'test' }}
          lint: ${{ matrix.task == 'lint' }}

      - name: Record verified commit
        run: git -C package rev-parse HEAD > "verified-${{ matrix.task }}.sha"

      - name: Upload verified commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.task }}
          path: verified-${{ matrix.task }}.sha
          retention-days: 1

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout telark repo (for local actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Package Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: telark/${{ github.event.inputs.package }}
          token: ${{ secrets.ACCESS_TOKEN }}
          path: package
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Download verified commits
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-*
          merge-multiple: true

      # The branch is re-fetched here; tag only the exact commit both legs verified.
      - name: Check branch head was verified
        run: |
          head=$(git -C package rev-parse HEAD)
          for f in verified-test.sha verified-lint.sha; do
            if [ "$(cat "$f")" != "$head" ]; then
              echo "::error::branch moved during verification ($f != $head) — re-run the release"
              exit 1
            fi
          done

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      
      - name: Fetch tags and get latest released semver
        id: get_tag
        run: |
          cd package
          git fetch --tags

          # Release tags only. A pre-release tag must never seed the next bump:
          # git ranks v1.2.3-branch.sha above v1.2.3, so one branch build would
          # otherwise drag every later version along with it.
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          echo "Found latest release tag: $latest_tag"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next
        uses: ./.github/actions/semver-bump
        with:
          version: ${{ steps.get_tag.outputs.latest_tag }}
          bump: ${{ github.event.inputs.build_type || 'patch' }}

      - name: Bump version
        id: bump
        env:
          NEXT_VERSION: ${{ steps.next.outputs.next_version }}
          SOURCE_BRANCH: ${{ github.event.inputs.branch || 'main' }}
        run: |
          cd package
          new_tag="v${NEXT_VERSION}"

          # Anything off main is a pre-release: semver ranks it below the plain
          # version and `go get @latest` skips it, so it cannot become the
          # official release by accident. The branch and commit ride along in the
          # identifier so the build is traceable back to its source.
          if [ "$SOURCE_BRANCH" != "main" ]; then
            slug=$(printf '%s' "$SOURCE_BRANCH" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -e 's/[^a-z0-9]\{1,\}/-/g' -e 's/^-\{1,\}//' -e 's/-\{1,\}$//' \
              | cut -c1-24)
            # A pre-release identifier may not be empty, and a purely numeric one
            # may not carry a leading zero.
            case "$slug" in
              "") slug="branch" ;;
              *[!0-9]*) ;;
              *) slug="b${slug}" ;;
            esac
            new_tag="${new_tag}-${slug}.$(git rev-parse --short HEAD)"
          fi

          echo "Bumping to new tag: $new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
      
      - name: Create annotated tag with commit message
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          SOURCE_BRANCH: ${{ github.event.inputs.branch || 'main' }}
        run: |
          cd package
          git checkout "$SOURCE_BRANCH"

          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "::error::tag $NEW_TAG already exists — this commit has been tagged already"
            exit 1
          fi

          tag_message=$(git log -1 --pretty=%B)

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -a "$NEW_TAG" -m "$tag_message"
          git push origin "$NEW_TAG"

          if [ "$SOURCE_BRANCH" != "main" ]; then
            echo "::notice::$NEW_TAG is a pre-release from branch $SOURCE_BRANCH — not an official release. Consumers must request it explicitly; 'go get @latest' will not select it."
          fi