{{/*
Removes the AI provider key Secret that older releases kept (resource-policy:
keep) before the upgrade applies. Hook-scoped identity: delete on that one name
only, gone once the Job succeeds. 404 (already gone, or a fresh install
upgraded) is success.
*/}}
{{- if .Values.services.exporter.enabled }}
{{- $name := printf "%s-ai-key-cleanup" (include "telark.fullname" .) }}
{{- $secret := printf "%s-ai-provider-key" .Values.app.name }}
{{- $ns := .Values.app.namespace }}
{{- $sc := .Values.app.shared.containerSecurityContext | default dict }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-key-cleanup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-key-cleanup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-key-cleanup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-key-cleanup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "telark.labels" . | nindent 8 }}
        app.kubernetes.io/component: ai-key-cleanup
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      containers:
        - name: cleanup
          image: curlimages/curl:8.20.0
          {{- if $sc.enabled }}
          securityContext:
            allowPrivilegeEscalation: {{ $sc.allowPrivilegeEscalation }}
            runAsNonRoot: true
            runAsUser: {{ $sc.runAsUser }}
            runAsGroup: {{ $sc.runAsGroup }}
            readOnlyRootFilesystem: {{ $sc.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ $sc.capabilities.drop | toJson }}
          {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                https://kubernetes.default.svc/api/v1/namespaces/{{ $ns }}/secrets/{{ $secret }})
              case "$code" in 200|404) echo ok;; *) echo "unexpected $code"; exit 1;; esac
{{- end }}
