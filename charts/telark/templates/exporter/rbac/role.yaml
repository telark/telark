{{- if $.Values.services.exporter.enabled }}
{{- include "role" (dict "service" "exporter" "values" .Values "root" $ "rules" (list
  (dict "apiGroups" (list (include "telark.apiGroup" $)) "resources" (list "accessroles" "applications" "categories" "groups" "passkeys" "protectionplans" "sessions" "telarkconfigs" "users") "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete"))
  (dict "apiGroups" (list (include "telark.apiGroup" $)) "resources" (list "applications/status" "protectionplans/status" "telarkconfigs/status") "verbs" (list "get" "update" "patch"))
  (dict "apiGroups" (list "") "resources" (list "persistentvolumeclaims") "verbs" (list "get" "list" "watch"))
  (dict "apiGroups" (list "") "resources" (list "secrets") "resourceNames" (list (include "telark.oidcTrustSecretName" $)) "verbs" (list "get" "update" "patch"))
)) }}
{{- end }}
