{{- $fullname := include "telark.fullname" . -}}
{{- $port := .Values.app.serviceDefaults.port -}}
{{- $readyPath := .Values.app.shared.healthCheck.readinessProbe.path -}}
{{- $group := include "telark.apiGroup" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-connection
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.20.0
      command:
        - /bin/sh
        - -ec
        - |
          {{- range $name, $svc := .Values.services }}
          {{- if and $svc.enabled (dig "includeHealthCheck" true $svc) }}
          echo "-> {{ $svc.name }} readiness"
          curl -fsS --max-time 10 "http://{{ $fullname }}-{{ $svc.name }}:{{ $port }}{{ $readyPath }}" >/dev/null
          {{- end }}
          {{- end }}
          {{- if .Values.crds.enabled }}
          echo "-> CRD group {{ $group }} established"
          curl -fsS --max-time 10 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "https://kubernetes.default.svc/apis/{{ $group }}" >/dev/null
          {{- end }}
          echo "OK"
