# Config that does not vary between install modes. What does vary — replicas,
# resources, rate limits, volume sizes — lives in values.mode.<mode>.yaml and is
# layered on top of this file:
#
#   helm install -f values.charts.yaml -f values.mode.<mode>.yaml ...
#
# Modes: minimal | standard | performance.

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi

nats:
  enabled: true
  image:
    registry: docker.io
    repository: nats
    tag: 2.12.1-scratch
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  # configuration: loaded from helm/app/config/nats.conf via
  #   --set-file nats.configuration=helm/app/config/nats.conf
  persistence:
    enabled: true
    path: /data
    size: 2Gi
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

kyverno:
  namespaceOverride: "telark"
  features:
    forceFailurePolicyIgnore:
      enabled: true
  webhooksCleanup:
    enabled: false
  # Replicas and resources intentionally omitted: they come from the install mode.

# metrics-server: required by HPAs and `kubectl top`. Default on.
# Disable for clusters that already ship it (GKE, AKS, k3s, OpenShift):
#   kubectl get apiservice v1beta1.metrics.k8s.io
# If the apiservice is present, override: --set metrics-server.enabled=false
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 400Mi

ollama:
  ollama:
    models:
      pull:
      #tested models from ollama registry: phi3.5(HIGH PROCESSING) / llama3.2:3b(LOW PROCESSING WITH INACCURATE RESULTS) / qwen2.5:3b(MEDIUM PROCESSING AS BEST FIT FOR OUR USE CASE)
       - qwen2.5:3b
  persistentVolume:
    enabled: true
    size: 10Gi
    # Empty -> cluster default class. Override per env via --set or values overlay.
    storageClass: ""
  extraEnv:
    - name: OLLAMA_NO_CLOUD
      value: "true"
    - name: OLLAMA_CONTEXT_LENGTH
      value: "2048"
    - name: OLLAMA_KEEP_ALIVE
      value: "-1"
    - name: OLLAMA_FLASH_ATTENTION
      value: "true"
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
