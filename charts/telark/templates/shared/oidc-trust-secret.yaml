{{/* Looked up so an upgrade keeps the keys the exporter wrote; cluster-less
renders (GitOps) set app.auth.oidc.existingSecret instead. */}}
{{- if not $.Values.app.auth.oidc.existingSecret }}
{{- $secretName := include "telark.oidcTrustSecretName" $ -}}
{{- $existing := lookup "v1" "Secret" $.Values.app.namespace $secretName -}}
{{- $jwk := "" -}}
{{- if and $existing $existing.data -}}
{{- $jwk = index $existing.data "googleJwkJson" | default "" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: oidc-trust
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  googleJwkJson: {{ $jwk | b64enc | quote }}
{{- end }}
