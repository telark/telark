{{- $service := "exporter" -}}
{{- $values := include "telark.modeValues" $ | fromYaml -}}
{{- $serviceConfig := index $values.services $service -}}
{{- if and $serviceConfig.enabled $values.app.persistence.enabled }}
{{- $sc := $values.app.persistence.storageClass | default "" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "telark.exporterSnapshotsPvcName" $ }}
  namespace: {{ $values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceConfig.name }}
spec:
  accessModes:
    - {{ $values.app.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ $values.app.persistence.size | default "1Gi" }}
  {{- if $sc }}
  {{- if eq "-" $sc }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
