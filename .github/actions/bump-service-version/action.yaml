name: 'Bump Service Version'
description: 'Bump service version in Helm values and return version information'
inputs:
  service:
    description: 'Name of the service'
    required: true
  build_type:
    description: 'Type of version bump (patch, minor, major, re-build-current)'
    required: true
  values_file_path:
    description: 'Path to the Helm values.yaml file'
    required: true
    default: './release/helm/app/values.yaml'

outputs:
  service_name:
    description: 'The processed service name (converted from kebab-case to camelCase)'
    value: ${{ steps.bump_version.outputs.service_name }}
  service_new_version:
    description: 'The new version number'
    value: ${{ steps.bump_version.outputs.service_new_version }}
  new_version:
    description: 'The complete new version with tag prefix'
    value: ${{ steps.bump_version.outputs.new_version }}
  service_current_version:
    description: 'The current version before bump'
    value: ${{ steps.bump_version.outputs.service_current_version }}

runs:
  using: 'composite'
  steps:
    - name: Bump Service Version
      id: bump_version
      shell: bash
      run: |
        # Check if service name contains '-'
        if [[ "${{ inputs.service }}" == *"-"* ]]; then
          # Convert kebab-case to camelCase (e.g., "demo-demo" → "demoDemo")
          service_name=$(echo "${{ inputs.service }}" | awk -F'-' '{for (i=2; i<=NF; i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1' OFS='')
        else
          # Keep it unchanged if no '-'
          service_name="${{ inputs.service }}"
        fi

        # Get current service information
        service_tag=$(yq ".services.${service_name}.imageTagPrefix" ${{ inputs.values_file_path }})
        service_current_version=$(yq ".services.${service_name}.version" ${{ inputs.values_file_path }})

        # Calculate new version based on build type
        case "${{ inputs.build_type }}" in
          major) 
            service_new_version=$(echo "$service_current_version" | awk -F. '{$1+=1;$2=0;$3=0;OFS=".";print $1,$2,$3}')
            ;;
          minor) 
            service_new_version=$(echo "$service_current_version" | awk -F. '{$2+=1;$3=0;OFS=".";print $1,$2,$3}')
            ;;
          patch) 
            service_new_version=$(echo "$service_current_version" | awk -F. '{$3+=1;OFS=".";print $1,$2,$3}')
            ;;
          re-build-current) 
            service_new_version=$service_current_version
            ;;
          *) 
            echo "Invalid version type: ${{ inputs.build_type }}"
            echo "Valid options: major, minor, patch, re-build-current"
            exit 1
            ;;
        esac
        
        # Update Helm Values file
        sed -i "/${service_name}:/,/version: /s/version: $service_current_version/version: $service_new_version/" ${{ inputs.values_file_path }}
        
        # Set outputs
        echo "service_name=$service_name" >> $GITHUB_OUTPUT
        echo "service_new_version=$service_new_version" >> $GITHUB_OUTPUT
        echo "new_version=$service_tag$service_new_version" >> $GITHUB_OUTPUT
        echo "service_current_version=$service_current_version" >> $GITHUB_OUTPUT
        
        # Log the version bump
        echo "✅ Version bumped for service: $service_name"
        echo "   Current: $service_current_version → New: $service_new_version"
        echo "   Build type: ${{ inputs.build_type }}"
        echo "   Full version: $service_tag$service_new_version"
