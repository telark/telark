name: 'Docker Login'
description: 'Log in to the container registry (docker.io).'
inputs:
  username:
    description: 'Container registry username'
    required: true
  password:
    description: 'Container registry password'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Docker Login
      uses: docker/login-action@v4.4.0
      with:
        registry: 'docker.io'
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
