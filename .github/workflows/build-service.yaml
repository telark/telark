name: Build & Deploy Service
run-name: Build Service "${{ inputs.service }}" with Bump "${{ inputs.build_type }}"
on:
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: choice
        description: Service
        default: discovery
        options:
          - discovery
          - exporter
          - notifier
          - auth
          - enrichment
      image_scan:
        required: false
        type: choice
        description: Image Scanning
        options:
          - skip
          - scan
      branch:
        required: true
        type: string
        description: Service Branch
        default: "main"
      build_type:
        required: false
        type: choice
        description: Service Build Type
        options:
          - patch
          - minor
          - major
          - re-build-current
      helm_build_type:
        required: false
        type: choice
        description: Helm Release Build Type
        default: skip
        options:
          - patch
          - minor
          - major
          - skip
      kyverno_config_mode:
        required: false
        type: choice
        description: Kyverno Config Mode
        options:
          - minimal
          - performance
        default: minimal

env:
  NAMESPACE: "telark"
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.service_data.outputs.new_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Bump Service Version
        id: service_data
        uses: ./.github/actions/bump-service-version
        with:
          service: ${{ inputs.service }}
          build_type: ${{ inputs.build_type }}
          values_file_path: './charts/helm/app/values.yaml'

      - name: Read image config from helm values
        id: image
        shell: bash
        run: |
          echo "registry=$(yq e '.app.image.registry' charts/helm/app/values.yaml)" >> $GITHUB_OUTPUT
          echo "repository=$(yq e '.app.image.repository' charts/helm/app/values.yaml)" >> $GITHUB_OUTPUT

      - name: Docker Login
        uses: docker/login-action@v4.0.0
        with:
          registry: "docker.io"
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and Push Service Image
        uses: ./.github/actions/build-push-service-image
        with:
          service_name: ${{ inputs.service }}
          service_path: './services/${{ inputs.service }}/'
          image_tag: ${{ steps.service_data.outputs.new_version }}
          container_registry_name: ${{ steps.image.outputs.registry }}
          container_registry_repo_name: ${{ steps.image.outputs.repository }}
          dockerfile_path: './services/${{ inputs.service }}/Dockerfile'
          platforms: 'linux/amd64'
          cache_enabled: 'true'
          push_enabled: 'true'
          access_user: ${{ secrets.ACCESS_USER }}
          access_token: ${{ secrets.ACCESS_TOKEN }}

      - name: Pull Latest Changes
        run: |
          git stash push -m "Temporary stash before pull" || true
          git pull origin main
          git stash pop || true

      - name: Commit Service Version
        uses: EndBug/add-and-commit@v10.0.0
        with:
          author_name: GitHub Action
          author_email: action@github.com
          cwd: './'
          message: "bump ${{ inputs.service }} to ${{ steps.service_data.outputs.new_version }}"

  trigger-helm-release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.build_type != 're-build-current' && inputs.helm_build_type != 'skip' }}
    steps:
      - name: Checkout Release Repository
        uses: actions/checkout@v6.0.2
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Trigger Helm Release Pipeline
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: telark/telark
          token: ${{ secrets.ACCESS_TOKEN }}
          event-type: execute-telark-helm-release
          client-payload: '{"build_type": "${{ inputs.helm_build_type }}", "ns": "${{ env.NAMESPACE }}", "sonar_scan": "skip", "kyverno_config_mode": "${{ inputs.kyverno_config_mode }}"}'

  restart-service:
    runs-on: self-hosted
    needs: build
    if: ${{ inputs.build_type == 're-build-current' }}
    steps:
      - name: Restart Deployment
        run: |
          DEPLOYMENT_NAME="telark-${{ inputs.service }}-service"
          kubectl rollout restart deployment $DEPLOYMENT_NAME -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment $DEPLOYMENT_NAME -n ${{ env.NAMESPACE }}