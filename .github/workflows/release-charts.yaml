# Release: publish the telark and telark-crds charts to the OCI registry
# (oci://ghcr.io/<owner>/charts) and cosign-sign every pushed chart. A manual run on a
# branch bumps each selected chart from its OWN Chart.yaml version (the two version
# independently), writes the result (and the Telark appVersion) back to Chart.yaml and
# commits it. It publishes telark-crds itself; telark it tags (v<version>), drafts its
# GitHub release and hands to a run of this workflow on that tag, which publishes and
# signs it, so the signature names the tag (telark install and upgrade check it), then
# publishes the release. Release tags come only from that bump run, so a pushed tag
# starts nothing. A version already in the registry fails the run before anything is
# pushed. Release notes and CHANGELOG.md come from cliff.toml, with a Dashboard UI part
# taken from telark/dashboard-ui's CHANGELOG.md. telark-crds is never tagged/released.
name: Release · Publish Charts
run-name: Publish charts (${{ github.event.inputs.chart || 'both' }} · ${{ github.ref_type == 'tag' && github.ref_name || format('bump {0}', github.event.inputs.bump || 'current') }})

on:
  workflow_dispatch:
    inputs:
      chart:
        description: "Which chart(s) to publish"
        type: choice
        default: both
        options:
          - both
          - telark
          - telark-crds
      bump:
        description: "Semver bump applied to the chart version (base = Chart.yaml)"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      release_type:
        description: "telark GitHub release kind"
        type: choice
        default: auto
        options:
          - auto        # pre-release if the version has a semver suffix, else release
          - release
          - prerelease

concurrency:
  # A group keeps one pending run, so each tag run gets its own: a queued bump run can't cancel it.
  group: release-charts-${{ github.ref_type == 'tag' && github.ref_name || 'bump' }}
  cancel-in-progress: false

env:
  CHART_DIR: charts/telark
  CRDS_DIR: charts/telark-crds
  # A manual run on a branch bumps; a run on a tag (started by a bump run) publishes as-is.
  BUMP_RUN: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the version bump + push the release tag / create the release
      packages: write
      pull-requests: read   # git-cliff reads PR numbers + authors for the changelog
      id-token: write   # keyless cosign signing via GitHub OIDC
      actions: write    # start the run on the new tag that publishes telark
    outputs:
      telark_version: ${{ steps.publish.outputs.telark_version }}
    steps:
      # The signature names the tag, so a v* tag must never move or vanish once a chart is signed from it.
      - name: Check the release tag ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protected=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets?targets=tag" --jq '.[] | select(.enforcement == "active") | .id' |
            while read -r id; do
              gh api "repos/${GITHUB_REPOSITORY}/rulesets/${id}" --jq 'select((.conditions.ref_name.include | index("refs/tags/v*") or index("~ALL")) and ([.rules[].type] | contains(["update", "deletion"]))) | .name'
            done)
          if [ -z "$protected" ]; then
            echo "::error::no active tag ruleset blocks moving and deleting refs/tags/v* (docs/PUBLISHING.md, Repository settings)"
            exit 1
          fi
          echo "Release tags protected by: ${protected}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags so git-cliff can build the changelog

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          # No root go.sum: key the cache on the file that pins helm-docs instead.
          cache-dependency-path: .github/actions/helm-docs-regenerate/action.yaml

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Resolve registry + selected charts
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
          # CRDs first, so they exist before the app that assumes them.
          case "${{ github.event.inputs.chart || 'both' }}" in
            telark)      dirs="$CHART_DIR" ;;
            telark-crds) dirs="$CRDS_DIR" ;;
            *)           dirs="$CRDS_DIR $CHART_DIR" ;;
          esac
          {
            echo "dirs=$dirs"
            echo "telark_current=$(yq e '.version' "$CHART_DIR/Chart.yaml")"
            echo "crds_current=$(yq e '.version' "$CRDS_DIR/Chart.yaml")"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate next telark version
        id: telark_semver
        if: ${{ env.BUMP_RUN == 'true' && github.event.inputs.chart != 'telark-crds' }}
        uses: ./.github/actions/semver-bump
        with:
          version: ${{ steps.meta.outputs.telark_current }}
          bump: ${{ github.event.inputs.bump }}

      - name: Calculate next telark-crds version
        id: crds_semver
        if: ${{ env.BUMP_RUN == 'true' && github.event.inputs.chart != 'telark' }}
        uses: ./.github/actions/semver-bump
        with:
          version: ${{ steps.meta.outputs.crds_current }}
          bump: ${{ github.event.inputs.bump }}

      # appVersion is the Telark release (telark's version). Only on chart=both does telark-crds take
      # it and telark's telark-crds dependency move to the new CRD version; otherwise both stay.
      - name: Write chart versions
        if: ${{ env.BUMP_RUN == 'true' }}
        env:
          TELARK_NEXT: ${{ steps.telark_semver.outputs.next_version }}
          CRDS_NEXT: ${{ steps.crds_semver.outputs.next_version }}
        run: |
          set -euo pipefail
          if [ -n "$TELARK_NEXT" ]; then
            yq -i '.version = strenv(TELARK_NEXT) | .appVersion = strenv(TELARK_NEXT)' "$CHART_DIR/Chart.yaml"
          fi
          if [ -n "$CRDS_NEXT" ]; then
            yq -i '.version = strenv(CRDS_NEXT)' "$CRDS_DIR/Chart.yaml"
          fi
          if [ -n "$TELARK_NEXT" ] && [ -n "$CRDS_NEXT" ]; then
            yq -i '.appVersion = strenv(TELARK_NEXT)' "$CRDS_DIR/Chart.yaml"
            yq -i '(.dependencies[] | select(.name == "telark-crds") | .version) = strenv(CRDS_NEXT)' "$CHART_DIR/Chart.yaml"
          fi

      - name: Add Helm dependency repos
        uses: ./.github/actions/helm-add-dependency-repos

      - name: Package, publish + sign
        id: publish
        env:
          COSIGN_YES: "true"
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRDS_REPINNED: ${{ env.BUMP_RUN == 'true' && github.event.inputs.chart == 'both' }}
        run: |
          set -euo pipefail
          registry="${{ steps.meta.outputs.registry }}"
          repo="${registry#oci://}"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          mkdir -p .cr-release
          # Never republish: check every selected chart before pushing any of them.
          existing=0
          for dir in ${{ steps.meta.outputs.dirs }}; do
            name=$(yq e '.name' "$dir/Chart.yaml")
            version=$(yq e '.version' "$dir/Chart.yaml")
            if helm show chart "${registry}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "::error::${name} ${version} is already published to ${registry}; refusing to overwrite it"
              existing=1
            fi
            # telark install and upgrade expect telark's signature to name the tag of its own version.
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$dir" = "$CHART_DIR" ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} doesn't match telark ${version}"
              existing=1
            fi
          done
          [ "$existing" -eq 0 ] || exit 1
          for dir in ${{ steps.meta.outputs.dirs }}; do
            name=$(yq e '.name' "$dir/Chart.yaml")
            version=$(yq e '.version' "$dir/Chart.yaml")
            if [ "$dir" = "$CHART_DIR" ] && [ "$BUMP_RUN" = "true" ]; then
              # A re-pinned telark-crds (pushed just above) is new to Chart.lock: re-resolve it for the bump
              # commit. telark itself is published by the run on its tag.
              if [ "$CRDS_REPINNED" = "true" ]; then
                helm dependency update "$dir"
              fi
              continue
            elif [ "$dir" = "$CHART_DIR" ]; then
              helm dependency build "$dir"
            fi
            helm package "$dir" --destination .cr-release
            helm push ".cr-release/${name}-${version}.tgz" "$registry" 2>&1 | tee .cr-release/push.log
            digest=$(awk '/[Dd]igest:/{print $NF}' .cr-release/push.log)
            echo "signing ${repo}/${name}@${digest}"
            # Credentials passed per call: `cosign login` would write them to
            # ~/.docker/config.json in plaintext (and warn about it).
            cosign sign --registry-username "$REGISTRY_USER" --registry-password "$REGISTRY_TOKEN" \
              "${repo}/${name}@${digest}"
            # Only the app chart gets a repo tag + release; telark-crds does not.
            if [ "$dir" = "$CHART_DIR" ]; then
              echo "telark_version=${version}" >> "$GITHUB_OUTPUT"
            fi
          done

      # The UI ships from telark/dashboard-ui (build-ui.yaml), whose CHANGELOG.md has a section per
      # UI version: carry the ones since the previous release's UI version into cliff.toml's body.
      - name: Collect dashboard UI changes
        if: ${{ env.BUMP_RUN == 'true' && steps.telark_semver.outputs.next_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UI_REPO: telark/dashboard-ui
        run: |
          set -euo pipefail
          # By version, not ancestry: a released tag can sit outside main's history.
          prev_tag=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/v[0-9]*')
          if [ -z "$prev_tag" ]; then echo "no previous release"; exit 0; fi
          ui_prev=$(git show "${prev_tag}:${CHART_DIR}/values.yaml" | yq e '.services.ui.version' -)
          ui_now=$(yq e '.services.ui.version' "$CHART_DIR/values.yaml")
          if [ "$ui_prev" = "$ui_now" ]; then echo "dashboard UI unchanged (${ui_now})"; exit 0; fi
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${UI_REPO}/contents/CHANGELOG.md?ref=v${ui_now}" > "$RUNNER_TEMP/ui-changelog.md" || true
          # The UI sections newer than ui_prev, headings two levels down. Their Contributors blocks
          # are left out: cliff.toml lists those logins in the release's one Contributors block.
          : > "$RUNNER_TEMP/ui-contributors"
          awk -v now="## [${ui_now}]" -v prev="## [${ui_prev}]" -v who="$RUNNER_TEMP/ui-contributors" '
            index($0, now) == 1 { on = 1 }
            index($0, prev) == 1 { on = 0 }
            !on { next }
            /^#+ Contributors *$/ { skip = 1; next }
            skip && /^#/ { skip = 0; print "" }
            skip {
              if (index($0, "(https://github.com/")) {
                u = $0; sub(/.*\(https:\/\/github\.com\//, "", u); sub(/\).*/, "", u); print u > who
              }
              next
            }
            { sub(/^##/, "####"); print }
          ' "$RUNNER_TEMP/ui-changelog.md" > "$RUNNER_TEMP/ui-notes.md"
          delim="UI_NOTES_$(openssl rand -hex 16)"
          {
            echo "TELARK_UI_NOTES<<${delim}"
            echo "v${ui_prev} → [v${ui_now}](https://github.com/${UI_REPO}/releases/tag/v${ui_now})"
            echo
            cat "$RUNNER_TEMP/ui-notes.md"
            echo "${delim}"
            echo "TELARK_UI_CONTRIBUTORS=$(sort -u "$RUNNER_TEMP/ui-contributors" | tr '\n' ' ')"
          } >> "$GITHUB_ENV"

      # Prepend the new version's section to CHANGELOG.md (git-cliff, Conventional
      # Commits); older sections are kept as written. --tag labels the just-bumped
      # commits under the release version, since the git tag is created a step later.
      - name: Generate changelog
        if: ${{ env.BUMP_RUN == 'true' && steps.telark_semver.outputs.next_version != '' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.telark_semver.outputs.next_version }} --prepend CHANGELOG.md
        env:
          OUTPUT: ${{ runner.temp }}/changelog-section.md

      # The same release section, alone, as the GitHub Release body.
      - name: Generate release notes
        if: ${{ env.BUMP_RUN == 'true' && steps.telark_semver.outputs.next_version != '' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.telark_semver.outputs.next_version }} --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Regenerate VALUES.md
        if: ${{ env.BUMP_RUN == 'true' }}
        uses: ./.github/actions/helm-docs-regenerate

      - name: Commit version bumps
        if: ${{ env.BUMP_RUN == 'true' }}
        run: |
          set -euo pipefail
          # Same command as `make values-docs` and the CI drift check — regenerated
          # by the step above, so the bump never leaves VALUES.md stale.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART_DIR/Chart.yaml" "$CHART_DIR/Chart.lock" "$CRDS_DIR/Chart.yaml" \
                  "$CHART_DIR/VALUES.md" "$CRDS_DIR/VALUES.md" CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no version changes to commit"
          else
            git commit -m "chore(release): bump chart version(s) [skip ci]"
            git push
          fi

      # Only telark is tagged + released on the repo. The version's semver
      # pre-release suffix (e.g. 1.2.0-rc.1) decides release vs pre-release.
      # The release stays a draft until the run on the tag has published and signed the chart.
      - name: Tag telark, draft its release and start the run on the tag
        if: ${{ env.BUMP_RUN == 'true' && steps.telark_semver.outputs.next_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELARK_VERSION: ${{ steps.telark_semver.outputs.next_version }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'auto' }}
        run: |
          set -euo pipefail
          v="$TELARK_VERSION"
          tag="v${v}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists"
            exit 1
          fi
          # release_type=auto derives from the semver suffix; release/prerelease force it.
          pre=""
          case "${{ github.event.inputs.release_type || 'auto' }}" in
            prerelease) pre="--prerelease" ;;
            release)    pre="" ;;
            *)          case "$v" in *-*) pre="--prerelease" ;; *) ;; esac ;;
          esac
          git tag "$tag"
          git push origin "$tag"          # pushed with GITHUB_TOKEN, so it does not re-trigger this workflow
          brew='s/^@BREW@//'
          case "$v" in
            *-*) brew='/^@BREW@/d' ;;   # the cask skips suffixed versions (skip_upload: auto)
            *)   ;;
          esac
          sed -e "s/@VERSION@/${v}/g" -e "$brew" >> "${{ runner.temp }}/release-notes.md" <<'EOF'

          ## Install the CLI

          ```sh
          @BREW@brew install telark/tap/telark
          @BREW@# or, on Linux and macOS
          curl -sSfL https://telark.io/install.sh | TELARK_VERSION=@VERSION@ sh
          ```

          Windows: `telark_@VERSION@_windows_amd64.zip` or `telark_@VERSION@_windows_arm64.zip` below. To check a download, see [Verifying downloads](https://github.com/telark/telark/blob/main/docs/CLI.md#verifying-downloads).
          EOF
          gh release create "$tag" --draft --title "$tag" --notes-file "${{ runner.temp }}/release-notes.md" $pre
          # A dispatch is the one event GITHUB_TOKEN may start: the run on the tag publishes and signs telark.
          # release_type goes along: goreleaser rewrites the draft's pre-release flag, so the cli job sets it again.
          gh workflow run release-charts.yaml --ref "$tag" -f chart=telark -f release_type="$RELEASE_TYPE"

  # The CLI built from the tag (.goreleaser.yaml): archives, checksums.txt signed keyless like the
  # chart, an SBOM per archive and build provenance join the drafted release, which goes public last.
  cli:
    needs: publish
    if: ${{ github.ref_type == 'tag' && needs.publish.outputs.telark_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach the assets and publish the release
      id-token: write       # keyless cosign signing and the provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # goreleaser reads the tag and the commit date

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Install syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      # HOMEBREW_TAP_TOKEN: a fine-grained token with contents write on telark/homebrew-tap only.
      - name: Build, sign and attach the CLI
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          COSIGN_YES: "true"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The bump run drafted the release; a rerun finds it already published.
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'auto' }}
        run: |
          set -euo pipefail
          pre=false
          case "$RELEASE_TYPE" in
            prerelease) pre=true ;;
            release)    ;;
            *)          case "$GITHUB_REF_NAME" in *-*) pre=true ;; *) ;; esac ;;
          esac
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$pre"
          fi
