# Install mode: minimal
#
# Smallest footprint that runs the product. Single replica per service, no
# disruption budgets, unbounded service resources so pods can burst on a small
# node instead of being throttled by limits that do not fit.
#
# For development, demos and evaluation. Losing a node takes the service with it.
#
# Layered over values.charts.yaml at install:
#   -f values.charts.yaml -f values.mode.minimal.yaml
#
# Capacity only. This says nothing about security posture: app.shared.crdGuard is
# an independent flag, deliberately, so a small cluster can still enforce the role
# model and a large one never enforces it by accident.

app:
  serviceDefaults:
    replicas: 1
  persistence:
    size: 1Gi
  shared:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

services:
  exporter:
    # Snapshots live on a ReadWriteOnce volume, so this cannot exceed one, and a
    # rolling update would deadlock on the volume handover.
    replicas: 1
    strategy: Recreate
    env:
      EXPORTER_K8S_CLIENT_QPS: "20"
      EXPORTER_K8S_CLIENT_BURST: "40"
    pdb:
      enabled: false
  discovery:
    replicas: 1
    env:
      DISCOVERY_K8S_CLIENT_QPS: "50"
      DISCOVERY_K8S_CLIENT_BURST: "100"
      FORCE_SYNC_WORKERS: "2"
    pdb:
      enabled: false
  enrichment:
    env:
      NUM_WORKERS: "1"
    pdb:
      enabled: false
  notifier:
    pdb:
      enabled: false
  auth:
    env:
      CLEANUP_WORKERS_PER_TYPE: "1"
    pdb:
      enabled: false

redis:
  master:
    persistence:
      size: 1Gi

nats:
  persistence:
    size: 2Gi

metrics-server:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 200Mi

kyverno:
  admissionController:
    replicas: 1
    podDisruptionBudget:
      enabled: false
    container:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      extraArgs:
        clientRateLimitQPS: 10
        clientRateLimitBurst: 20
    initContainer:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  backgroundController:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    extraArgs:
      clientRateLimitQPS: 10
      clientRateLimitBurst: 20
  cleanupController:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    extraArgs:
      clientRateLimitQPS: 10
      clientRateLimitBurst: 20
  reportsController:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    extraArgs:
      clientRateLimitQPS: 10
      clientRateLimitBurst: 20
