apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accessroles.{{ include "telark.apiGroup" $ }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: {{ include "telark.apiGroup" $ }}
  names:
    kind: AccessRole
    plural: accessroles
    singular: accessrole
    shortNames:
      - trole
    categories:
      - telark
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - description
                - version
                - type
                - priority
                - categoryRef
                - scopesAndPermissions
                - status
                - protection
                - creationDate
                - validity
              properties:
                name:
                  type: string
                  description: Human-readable UI-friendly name
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                version:
                  type: string
                  description: Semantic version of the role definition
                  pattern: '^v?[0-9]+(\.[0-9]+){0,2}$'
                  example: "1.0.0"
                type:
                  type: string
                  enum:
                    - built-in
                    - custom
                priority:
                  type: integer
                  description: Higher value = higher precedence when evaluating multiple roles
                  default: 0
                categoryRef:
                  type: string
                  description: Category id of the role
                scopesAndPermissions:
                  type: array
                  description: List of scopes with the highest granted RBAC level with fine-grained allow and deny rules
                  items:
                    type: object
                    required:
                      - scope
                      - level
                    properties:
                      scope:
                        type: string
                        minLength: 1
                      level:
                        type: string
                        enum:
                          - ReadOnly
                          - Contributor
                          - Owner
                          - Admin
                      rules:
                        type: array
                        items:
                          type: string
                          description: List of rules to be denied for this scope
                protection:
                  type: object
                  properties:
                    preventDeletion:
                      type: boolean
                      default: false
                    preventModification:
                      type: boolean
                      default: false
                    preventScopeChanges:
                      type: boolean
                      default: false
                    lockName:
                      type: boolean
                      default: false
                    lockCategory:
                      type: boolean
                      default: false
                    softDelete:
                      type: boolean
                      default: false
                      description: soft deletion is a feature that allows you to delete a role without actually deleting its CRD. This is useful for historical purposes)
                status:
                  type: string
                  enum:
                    - Active
                    - Inactive
                    - Deprecated
                    - Deleted
                validity:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - permanent
                        - temporary
                        - sessionBased
                    expiresAt:
                      type: string
                      format: date-time
                      description: Expiration moment for temporary roles
                    durationHours:
                      type: integer
                      minimum: 1
                      description: Auto-expiration based on assignment duration
                    autoRevoke:
                      type: boolean
                      description: Automatically revoke role when expired
                {{- include "dateFieldsSchema" . | nindent 16 }}
                createdBy:
                  type: string
                  description: ID of the user who created the role
                lastUpdatedBy:
                  type: string
                  description: ID of the user who last updated the role
                deprecatedAt:
                  type: string
                  format: date-time
                deletedAt:
                  type: string
                  format: date-time
