# Build: bump a component's version, build + push its container image, scan and
# sign it, then record the bump. Covers the Go/Python services that live in this
# repo and the dashboard UI, which lives in telark/dashboard-ui.
name: Build · Image
run-name: Build "${{ inputs.service }}" image (bump "${{ inputs.build_type }}")
on:
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: choice
        description: Service
        default: discovery
        options:
          - discovery
          - exporter
          - notifier
          - auth
          - enrichment
          - ui
      image_scan:
        required: false
        type: choice
        description: Image Scanning
        default: scan
        options:
          - skip
          - scan
      branch:
        required: false
        type: string
        description: Source branch (blank = main, or master for ui)
        default: ""
      build_type:
        required: false
        type: choice
        description: Service Build Type
        options:
          - re-build-current
          - patch
          - minor
          - major

concurrency:
  group: build-image-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: write   # commit the version bump
  id-token: write   # cosign keyless image signing (OIDC)

env:
  NAMESPACE: "telark"
  DOCKER_BUILDKIT: 1
  SERVICE: ${{ inputs.service }}
  CHART_VALUES: release/charts/telark/values.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.service_data.outputs.new_version }}
    steps:
      # For in-repo services the bump commit lands on the requested branch; for
      # the UI the bump belongs on telark main and `branch` selects the UI source.
      - name: Checkout telark (charts + composite actions)
        uses: actions/checkout@v7.0.1
        with:
          path: release
          ref: ${{ inputs.service == 'ui' && 'main' || (inputs.branch || 'main') }}

      - name: Checkout UI repository
        if: ${{ inputs.service == 'ui' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: telark/dashboard-ui
          token: ${{ secrets.ACCESS_TOKEN }}
          path: service
          ref: ${{ inputs.branch || 'master' }}

      - name: Resolve build target
        id: target
        shell: bash
        run: |
          if [[ "$SERVICE" == "ui" ]]; then
            # The UI image is amd64-only; the cluster runs it on amd64 nodes.
            {
              echo "context=service"
              echo "dockerfile=./service/Dockerfile"
              echo "platforms=linux/amd64"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "context=release/services/${SERVICE}/"
              echo "dockerfile=./release/services/${SERVICE}/Dockerfile"
              echo "platforms=linux/amd64,linux/arm64"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Go lint gate
        if: ${{ inputs.service != 'enrichment' && inputs.service != 'ui' }}
        uses: ./release/.github/actions/go-ci
        with:
          working-directory: release/services/${{ inputs.service }}
          cache-key: ${{ inputs.service }}
          access-user: ${{ secrets.ACCESS_USER }}
          access-token: ${{ secrets.ACCESS_TOKEN }}
          config-file: release/.golangci.yml
          test: 'false'

      - name: Bump Service Version
        id: service_data
        uses: ./release/.github/actions/bump-service-version
        with:
          service: ${{ inputs.service }}
          build_type: ${{ inputs.build_type }}
          values_file_path: '${{ env.CHART_VALUES }}'

      - name: Read image config from helm values
        id: image
        uses: ./release/.github/actions/helm-image-config
        with:
          values-file: ${{ env.CHART_VALUES }}
          service: ${{ inputs.service }}

      - name: Docker Login
        uses: ./release/.github/actions/docker-login
        with:
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and Push Image
        id: build
        uses: ./release/.github/actions/build-push-service-image
        with:
          service_name: ${{ inputs.service }}
          service_path: ${{ steps.target.outputs.context }}
          image_tag: ${{ steps.service_data.outputs.new_version }}
          container_registry_name: ${{ steps.image.outputs.registry }}
          container_registry_repo_name: ${{ steps.image.outputs.repository }}
          dockerfile_path: ${{ steps.target.outputs.dockerfile }}
          platforms: ${{ steps.target.outputs.platforms }}
          cache_enabled: 'true'
          push_enabled: 'true'
          # Only the Python image runs foreign-arch binaries at build time; the
          # Go images cross-compile and the UI image is single-arch.
          setup_qemu: ${{ inputs.service == 'enrichment' }}

      - name: Scan image for vulnerabilities (Trivy)
        if: ${{ inputs.image_scan == 'scan' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repository }}:${{ steps.service_data.outputs.new_version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # No empty-digest guard here: build-push-service-image already fails the
      # run when buildx produces no digest, so this step is unreachable without one.
      - name: Sign image (cosign keyless)
        shell: bash
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repository }}@${{ steps.build.outputs.image_digest }}
        run: cosign sign "$IMAGE"

      # In-repo services are tagged by the bump commit below; the UI source lives
      # in its own repo and needs its own tag.
      - name: Tag UI Repository
        if: ${{ inputs.service == 'ui' }}
        uses: ./release/.github/actions/tag-service-repo
        with:
          service_name: ${{ inputs.service }}
          service_version: ${{ steps.service_data.outputs.service_new_version }}
          service_path: service
          branch: ${{ inputs.branch || 'master' }}

      # The bump rewrote values.yaml, so the docs index is now stale. Regenerate
      # it here — add-and-commit picks it up — or the next CI run fails the
      # "VALUES.md is up to date" check on a change this workflow made.
      - name: Regenerate VALUES.md
        uses: ./release/.github/actions/helm-docs-regenerate
        with:
          cwd: release

      - name: Commit Service Version
        uses: ./release/.github/actions/git-commit-version-bump
        with:
          cwd: './release'
          message: "bump ${{ inputs.service }} to ${{ steps.service_data.outputs.new_version }}"
