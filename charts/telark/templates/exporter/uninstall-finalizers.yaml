{{- /*
Users, groups and roles carry cleanup finalizers that only auth clears, so once the release is gone deleting the CRDs or
namespace would hang. The first Job stops auth, or its leader sweeper restores them; the second removes them as the exporter.
*/}}
{{- $values := include "telark.modeValues" . | fromYaml }}
{{- $ns := .Values.app.namespace }}
{{- $name := printf "%s-uninstall-finalizers" (include "telark.fullname" .) }}
{{- $stopName := printf "%s-uninstall-stop-auth" (include "telark.fullname" .) }}
{{- $auth := .Values.services.auth }}
{{- $exporter := .Values.services.exporter }}
{{- $authDeployment := printf "%s-%s" (include "telark.fullname" .) $auth.name }}
{{- $authPods := include "telark.selectorLabels" (dict "root" . "component" $auth.name) | fromYaml }}
{{- $authSelector := list }}
{{- range $k, $v := $authPods }}{{ $authSelector = append $authSelector (printf "%s=%s" $k $v) }}{{ end }}
{{- $securityContext := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
{{- $podSecurityContext := dict "runAsNonRoot" true "runAsUser" 10001 "seccompProfile" (dict "type" "RuntimeDefault") }}
{{- $shared := $values.app.shared.resources }}
{{- $resources := dict "requests" (pick $shared.requests "memory" "cpu" "ephemeral-storage") "limits" (pick $shared.limits "memory" "ephemeral-storage") }}
{{- if $auth.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $authDeployment | quote }}]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ $authDeployment | quote }}]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $stopName }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- include "telark.imagePullSecrets" . | nindent 6 }}
      securityContext: {{- toYaml $podSecurityContext | nindent 8 }}
      initContainers:
        - name: stop-auth
          image: {{ $values.app.image.kubectl }}
          args: ["scale", "deployment", {{ $authDeployment | quote }}, "-n", {{ $ns | quote }}, "--replicas=0", "--cache-dir=/tmp"]
          securityContext: {{- toYaml $securityContext | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: wait-for-auth
          image: {{ $values.app.image.kubectl }}
          args: ["wait", "--for=delete", "pod", "-n", {{ $ns | quote }}, "-l", {{ join "," $authSelector | quote }}, "--timeout=120s", "--cache-dir=/tmp"]
          resources: {{- toYaml $resources | nindent 12 }}
          securityContext: {{- toYaml $securityContext | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- if $exporter.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      {{- /* The CRD write guard admits these writes from the exporter's ServiceAccount only. */}}
      serviceAccountName: {{ include "telark.serviceAccountName" (dict "root" . "serviceConfig" $exporter) }}
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- include "telark.imagePullSecrets" . | nindent 6 }}
      securityContext: {{- toYaml $podSecurityContext | nindent 8 }}
      containers:
        - name: remove-finalizers
          image: {{ .Values.app.image.registry }}/{{ $exporter.repository }}:{{ $exporter.version }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy | default "Always" }}
          args: ["remove-finalizers"]
          resources: {{- toYaml $resources | nindent 12 }}
          securityContext: {{- toYaml $securityContext | nindent 12 }}
{{- end }}
