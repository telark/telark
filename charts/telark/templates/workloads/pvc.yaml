{{- $service := "exporter" -}}
{{- $values := include "telark.modeValues" $ | fromYaml -}}
{{- $serviceConfig := index $values.services $service -}}
{{- if and $serviceConfig.enabled $values.app.persistence.enabled }}
{{- $storage := include "telark.exporterStorage" $ | fromYaml }}
{{- range $storage.claims }}
{{- /* A moving claim's old claim stays in this manifest once, so it carries keep before Helm drops it. */}}
{{- range compact (list .from .) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  namespace: {{ $values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceConfig.name }}
  annotations:
    # Snapshots and reports outlive the release, like the Redis, NATS and Ollama volumes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .size }}
  {{- if hasKey . "storageClassName" }}
  storageClassName: {{ .storageClassName | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
