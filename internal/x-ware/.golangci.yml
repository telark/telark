version: 2
linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - gocyclo
    - misspell
    - unparam
    - nakedret
    - perfsprint
    - prealloc
    - nolintlint
    - funlen
    - dupl
    - bodyclose
    - containedctx
    - goprintffuncname
    - whitespace
    - unconvert
    - revive
  settings:
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    funlen:
      lines: 60
      statements: 
    revive:
      enable-all-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: line-length-limit
          arguments:
            - 85
        - name: max-public-structs
          arguments:
            - 8
run:
  timeout: 2m
  tests: false

issues:
  max-issues-per-linter: 0