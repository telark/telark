# Build: bump the dashboard UI version, build + push its image, scan and sign
# it, tag the source repo, then record the bump.
name: Build · UI Image
run-name: Build UI image (bump "${{ inputs.build_type }}")
on:
  workflow_dispatch:
    inputs:
      image_scan:
        required: false
        type: choice
        description: Image Scanning
        default: scan
        options:
          - skip
          - scan
      ui_branch:
        required: false
        type: string
        description: dashboard-ui branch to build the image from (blank = master)
        default: ""
      branch:
        required: false
        type: string
        description: Telark branch the version bump commits to (blank = main)
        default: ""
      build_type:
        required: false
        type: choice
        description: Service Build Type
        options:
          - re-build-current
          - patch
          - minor
          - major

concurrency:
  group: build-ui
  cancel-in-progress: false

env:
  NAMESPACE: "telark"
  DOCKER_BUILDKIT: 1
  SERVICE: ui
  CHART_VALUES: release/charts/telark/values.yaml

jobs:
  gate-ui:
    name: Gate · UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service
    steps:
      - name: Checkout UI repository
        uses: actions/checkout@v7.0.1
        with:
          repository: telark/dashboard-ui
          token: ${{ secrets.ACCESS_TOKEN }}
          path: service
          ref: ${{ inputs.ui_branch || 'master' }}

      # Node 24 = the version the UI Dockerfile builds with.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: npm run check-all-and-build

  build:
    needs: gate-ui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commit the version bump
      id-token: write   # cosign keyless image signing (OIDC)
    outputs:
      image_tag: ${{ steps.release.outputs.new_version }}
    steps:
      - name: Checkout telark (charts + composite actions)
        uses: actions/checkout@v7.0.1
        with:
          path: release
          ref: ${{ inputs.branch || 'main' }}

      - name: Checkout UI repository
        uses: actions/checkout@v7.0.1
        with:
          repository: telark/dashboard-ui
          token: ${{ secrets.ACCESS_TOKEN }}
          path: service
          ref: ${{ inputs.ui_branch || 'master' }}

      # The UI image is amd64-only; the cluster runs it on amd64 nodes, and
      # nothing foreign-arch runs at build time, so QEMU stays off.
      - name: Release UI image
        id: release
        uses: ./release/.github/actions/release-service-image
        with:
          service: ${{ env.SERVICE }}
          build_type: ${{ inputs.build_type }}
          values_file: ${{ env.CHART_VALUES }}
          context: service
          dockerfile: ./service/Dockerfile
          platforms: linux/amd64
          registry_username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          registry_password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          image_scan: ${{ inputs.image_scan }}
          source_repo_path: service
          source_repo_branch: ${{ inputs.ui_branch || 'master' }}
