#General settings
server_name: nats-server
port: 4222

# JetStream config
jetstream {
  store_dir: "/data"
  max_mem: 1G
  max_file: 5G
}

authorization {
  users = [
    {
      user: "nats",
      password: "nats123",
      permissions: {
        publish = [
          "telark.applications.*",
          "$JS.ACK.>",  # ACK messages
          "$JS.API.>",
          "_INBOX.>"
        ]
        subscribe = [
          "telark.applications.*",
          "$JS.ACK.>",  # ACK messages
          "$JS.API.>",
          "_INBOX.>"
        ]
      }
    }
  ]
}

debug: true
trace: true
logtime: true
http_port: 8222
