# telark chart values; every key is described in ./README.md. Keys are camelCase, env keys SCREAMING_SNAKE_CASE.
# app.mode sizes the services (modes/*.yaml). Each services.<svc> inherits app.serviceDefaults, and its gates opt it
#   into the app.shared fragments. The subcharts at the bottom ignore app.mode: Helm resolves their values before it.
# storageClass: "" is the cluster default, "-" disables provisioning, "<name>" picks that class.

global:
  imagePullSecrets: []

# Rename the rendered resources; app.name stays the identity.
nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

# Installs the CRD definitions; false when GitOps applies them. app.security.crdGuard guards writes either way.
crds:
  enabled: true

ingress:
  enabled: false
  className: ""            # e.g. nginx
  host: ""                 # e.g. telark.example.com ("" = match any host)
  service: ui              # services.<key> to route to (the dashboard)
  path: /
  pathType: Prefix
  annotations: {}
  tls: []                  # [{ secretName: telark-tls, hosts: [telark.example.com] }]

# HTTPRoute alternative to the Ingress, attached to a Gateway you run (needs the Gateway API v1 CRDs).
gateway:
  enabled: false
  parentRefs: []           # [{ name: <gateway>, namespace: <ns>, sectionName: <listener> }]
  hostnames: []            # e.g. [telark.example.com] ([] = any host)
  service: ui              # services.<key> to route to (the dashboard)
  annotations: {}

# Needs the Prometheus Operator CRDs. labels must match your Prometheus serviceMonitorSelector.
monitoring:
  serviceMonitor:
    enabled: false
    path: /metrics
    interval: 30s
    labels: {}

app:
  name: "telark"           # source of truth for every resource name
  namespace: "telark"
  mode: standard           # minimal, standard (these values) or performance

  image:
    registry: "ghcr.io/telark"
    pullPolicy: "Always"   # dev builds re-push the same tag, so never IfNotPresent
    pullSecrets: []
    # The uninstall hooks run it: mirror it for air-gapped installs.
    kubectl: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385

  auth:
    bootstrap:
      admin: ""            # your admin email: the render fails without one
    passkey:
      id: ""  # required with ingress/gateway; empty follows the request host
      name: "Dashboard App"
      origin: ""  # required with ingress/gateway; empty follows the request Origin
    oidc:
      existingSecret: ""  # GitOps: your Secret with key googleJwkJson; empty = chart-managed

  security:
    # Only the owning service accounts may write telark resources: they hold the role model, so this is the
    # boundary, not an option. Independent of crds.enabled.
    crdGuard:
      enabled: true
      enforce: true
      extraAllowedUsers: []     # break-glass usernames; owning SAs always allowed
    networkPolicy:
      enabled: true             # ingress policies for the telark pods and NATS; needs an enforcing CNI
    # Empty value: generated on install, read back on upgrade. Cluster-less (GitOps) renders set existingSecret (key token).
    serviceToken:
      envVar: "TELARK_SERVICE_TOKEN"
      value: ""
      existingSecret: ""
    breakGlass:
      waitHours: 24             # how long a break-glass request waits before it completes on its own

  # Exporter claims (snapshots, reports), kept on uninstall. With storageClass "" an upgrade keeps their class,
  # and a new class copies the data to new claims.
  persistence:
    enabled: true
    storageClass: ""
    snapshotsSize: 512Mi
    reportsSize: 512Mi

  # Signed notifier deliveries. URLs and secrets are credentials, so they render into a Secret (GitOps: existingSecret, key targets.json).
  webhooks:
    existingSecret: ""
    targets: []

  ollama:
    autoPull: true         # false when air-gapped: models are pre-loaded
    runtimeUrl: ""         # an Ollama-API endpoint you run (no key); empty = the ollama subchart

  selfMonitoring:
    enabled: false         # true: discovery also lists telark's own namespace as applications

  serviceDefaults:
    port: 8080
    serviceType: ClusterIP
    replicas: 1
    terminationGracePeriodSec: 60
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    # Applies only once vpa.enabled installed the operator: its CRD must exist, so VPAs appear from the next upgrade.
    vpa:
      updateMode: Auto

  shared:
    redis:
      REDIS_HOST: "{{ .Release.Name }}-redis-master"
      REDIS_PORT: "6379"
    nats:
      NATS_HOST: "{{ .Release.Name }}-nats"
    # ephemeral-storage: logs (the kubelet keeps five 10Mi files) and disk emptyDirs. No preset sets it,
    # so a --set applies in every mode.
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
        ephemeral-storage: "50Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
        ephemeral-storage: "2Gi"
    healthCheck:
      port: http
      # The exporter, notifier and auth listen only once Redis answers, and a node loss keeps Redis
      # away while its volume moves: 5 minutes before liveness may restart them.
      startupProbe:
        path: /api/v1/status/live
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 60
      livenessProbe:
        path: /api/v1/status/live
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 15
        failureThreshold: 3
      readinessProbe:
        path: /api/v1/status/ready
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 15
        failureThreshold: 3
    podSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 1001
      runAsGroup: 1001
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

services:
  exporter:
    enabled: true
    name: "exporter-service"
    repository: "exporter"
    # @ignore
    version: 0.1.2
    category: "persistence-manager"
    # More than one replica needs a ReadWriteMany app.persistence.storageClass; break-glass recovery needs one (INSTALL).
    # Never autoscaled: the volume, not CPU, bounds it.
    replicas: 1
    autoscaling:
      enabled: false
    env:
      CORS_ALLOWED_ORIGINS: ""
      SNAPSHOTS_PATH: &snapshotsPath "/snapshots"
      REPORTS_PATH: &reportsPath "/reports"
      SNAPSHOTS_PVC_NAME: '{{ include "telark.exporterSnapshotsPvcName" . }}'
      SNAPSHOTS_PVC_NAMESPACE: '{{ .Values.app.namespace }}'
      SNAPSHOT_GC_INTERVAL_SEC: "3600"   # 0 = no orphan sweep
      EXPORTER_K8S_CLIENT_QPS: "50"
      EXPORTER_K8S_CLIENT_BURST: "100"
      EXPORTER_LIST_RENDER_CONCURRENCY: "2"
      BOOTSTRAP_ADMIN: '{{ .Values.app.auth.bootstrap.admin }}'
      # dig: a --reuse-values upgrade from 0.1.x lacks the key, and empty means the service default (24)
      BREAK_GLASS_WAIT_HOURS: '{{ dig "security" "breakGlass" "waitHours" "" .Values.app }}'
      OIDC_TRUST_SECRET_NAME: '{{ include "telark.oidcTrustSecretName" . }}'
    volumes:
      - name: snapshots-storage
        persistentVolumeClaim:
          claimName: '{{ include "telark.exporterSnapshotsPvcName" . }}'
      - name: reports-storage
        persistentVolumeClaim:
          claimName: '{{ include "telark.exporterReportsPvcName" . }}'
    volumeMounts:
      - name: snapshots-storage
        path: *snapshotsPath
      - name: reports-storage
        path: *reportsPath
    pdb:
      enabled: false
  discovery:
    enabled: true
    name: "discovery-service"
    repository: "discovery"
    # @ignore
    version: 0.2.0
    category: "discovery"
    useNatsCreds: true
    natsUser: publisher
    env:
      CORS_ALLOWED_ORIGINS: ""
      DISCOVERY_K8S_CLIENT_QPS: "100"
      DISCOVERY_K8S_CLIENT_BURST: "200"
      DISCOVERY_ROLLBACK_K8S_CLIENT_QPS: "100"
      DISCOVERY_ROLLBACK_K8S_CLIENT_BURST: "200"
      DISCOVERY_INFORMER_RESYNC_SEC: "600"
      DISCOVERY_ROLLBACK_INFORMER_RESYNC_SEC: "600"
      DISCOVERY_INFORMER_RESYNC_JITTER_FRACTION: "0.2"
      DISCOVERY_INFORMER_COALESCING_WINDOW_SEC: "5"
      DISCOVERY_INFORMER_COALESCING_MAX_WAIT_SEC: "10"
      DISCOVERY_COALESCE_BUFFER_MAX_ENTRIES: "500"
      DISCOVERY_SNAPSHOT_FETCH_TIMEOUT_MS: "5000"
      DISCOVERY_AUTO_CLEANUP_ENABLED: "true"
      DISCOVERY_AUTO_CLEANUP_DELETE_ENABLED: "true"
      DISCOVERY_AUTO_CLEANUP_CYCLE_INTERVAL_SEC: "60"
      DISCOVERY_AUTO_CLEANUP_EMPTY_CYCLES_REQUIRED: "2"
      DISCOVERY_AUTO_CLEANUP_GRACE_PERIOD_SEC: "0"
      COORDINATION_BATCH_SIZE: "10"
      COORDINATION_BATCH_BLOCK_SEC: "2"
      COORDINATION_MAX_RETRY_ATTEMPTS: "5"
      COORDINATION_LOCK_TTL_SEC: "120"
      COORDINATION_LOCK_HEARTBEAT_SEC: "30"
      COORDINATION_ELECTION_TTL_SEC: "15"
      COORDINATION_ELECTION_RENEW_SEC: "5"
      COORDINATION_DEDUP_TTL_SEC: "60"
      COORDINATION_STALE_CLAIM_MIN_IDLE_SEC: "300"
      COORDINATION_STALE_CLAIM_INTERVAL_SEC: "60"
      COORDINATION_SHUTDOWN_CLEANUP_TIMEOUT_SEC: "45"
      REDIS_RETRY_INTERVAL_SEC: "5"
      REDIS_MAX_WAIT_SEC: "180"
      REDIS_PING_TIMEOUT_SEC: "2"
      # The leader's stream reads (FORCE_SYNC_WORKERS + 1) each block a pooled connection: keep the pool well above them.
      REDIS_POOL_SIZE: "20"
      FORCE_SYNC_WORKERS: "6"
      FORCE_SYNC_STREAM_MAX_LEN: "5000"
      FORCE_SYNC_DEDUP_TTL_SEC: "600"
      FORCE_SYNC_JOB_TIMEOUT_SEC: "300"
      FORCE_SYNC_MAINTENANCE_INTERVAL_SEC: "60"
      FORCE_SYNC_PEL_IDLE_RECLAIM_SEC: "60"
      FORCE_SYNC_ACK_RETENTION_SEC: "3600"
      SNAPSHOT_WRITE_MAX_ATTEMPTS: "5"
      SNAPSHOT_WRITE_RETRY_INTERVAL_SEC: "2"
      PROTECTION_PLAN_TICK_INTERVAL_SEC: "31"
      PROTECTION_PLAN_REPORT_MAX_VIOLATIONS: "5000"
      PROTECTION_PLAN_REPORT_CHECKPOINT_SEC: "900"
      REST_EXPORTER_DURATION_LOG_ENABLED: "true"
      REST_EXPORTER_DURATION_LOG_DEDUP_SEC: "10"
      INSIGHTS_INDEX_REFRESH_SEC: "15"
      INSIGHTS_INDEX_RESYNC_SEC: "300"
      INSIGHTS_STALE_AFTER_SEC: "86400"
      SELF_MONITORING_ENABLED: '{{ .Values.app.selfMonitoring.enabled }}'
    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    # Off in standard: on one replica a budget only blocks node drains. performance turns it on.
    pdb:
      enabled: false
  analyzer:
    enabled: true
    name: "analyzer-service"
    repository: "analyzer"
    # @ignore
    version: 0.1.2
    category: "ai-insights"
    # One worker bound to one Ollama slot (OLLAMA_NUM_PARALLEL=1): a second replica would only queue behind it.
    autoscaling:
      enabled: false
    env:
      CORS_ALLOWED_ORIGINS: ""
      REDIS_POOL_SIZE: "10"
      OLLAMA_HOST: '{{ default (printf "http://%s-ollama:11434" .Release.Name) .Values.app.ollama.runtimeUrl }}'
      OLLAMA_AUTO_PULL: '{{ .Values.app.ollama.autoPull }}'
      # Only the bundled runtime: models on a runtimeUrl you run are never deleted.
      OLLAMA_PRUNE_MODELS: '{{ and (dig "ollama" "enabled" .Values.ollama.enabled .Values.app) (empty .Values.app.ollama.runtimeUrl) }}'
      ANALYZER_MODE: "fast"
      ANALYZER_NUM_THREAD: "2"           # = ollama.resources.limits.cpu; never above the node's vCPU
      ANALYZER_CONTEXT_TOKENS: "4096"    # = OLLAMA_CONTEXT_LENGTH; deep: 8192
      ANALYZER_CHARS_PER_TOKEN: "3.5"
      ANALYZER_NARRATE_TIMEOUT_SEC: "45"
      ANALYZER_MAX_STEPS: "8"
      ANALYZER_MAX_TOOL_CALLS: "8"
      ANALYZER_TOOL_RESULT_MAX_BYTES: "2048"
      ANALYZER_WALL_SEC: "480"
      ANALYZER_LOOP_TIMEOUT_SEC: "120"
      ANALYZER_EMIT_TIMEOUT_SEC: "180"
      ANALYZER_QUEUE_MAX: "100"
      ANALYZER_AUTO_COOLDOWN_SEC: "600"
      ANALYZER_MANUAL_COOLDOWN_SEC: "60"
      ANALYZER_CONFIG_POLL_SEC: "30"
      ANALYZER_REVIEW_INTERVAL_SEC: "7200"  # 0 = no review sweep
      ANALYZER_REVIEW_TICK_SEC: "120"
      ANALYZER_REVIEW_APPS_PER_MIN: "20"
      ANALYZER_REVIEW_WORKLOADS_MAX: "10"
      ANALYZER_USAGE_MIN_SAMPLES: "12"
      ANALYZER_USAGE_MIN_SPAN_SEC: "43200"
      ANALYZER_CHANGE_VELOCITY_PER_DAY: "20"
      ANALYZER_CHANGE_RISK_MIN_SPAN_SEC: "259200"
      # -- Namespaces or plan environments matching it count as production.
      # @default -- `(^\|[-_.])(prod\|production\|prd)($\|[-_.])`
      ANALYZER_PRODUCTION_PATTERN: '(^|[-_.])(prod|production|prd)($|[-_.])'
    pdb:
      enabled: false
  notifier:
    enabled: true
    name: "notifier-service"
    repository: "notifier"
    # @ignore
    version: 0.1.2
    category: "event-streaming"
    terminationGracePeriodSec: 30
    useNatsCreds: true
    natsUser: consumer
    automountServiceAccountToken: false
    env:
      NOTIFIER_APPLY_WORKERS: "8"   # one app always maps to the same worker, so its events stay ordered
      WEBHOOK_TARGETS_FILE: "/etc/telark/webhooks/targets.json"
    volumes:
      - name: webhooks
        secret:
          name: '{{ include "telark.webhooksSecretName" . }}'
    volumeMounts:
      - name: webhooks
        path: /etc/telark/webhooks
        readOnly: true
    pdb:
      enabled: false
  auth:
    enabled: true
    name: "auth-service"
    repository: "auth"
    # @ignore
    version: 0.1.2
    category: "auth"
    terminationGracePeriodSec: 30
    automountServiceAccountToken: false
    env:
      CORS_ALLOWED_ORIGINS: ""
      REDIS_DB: "1"
      REDIS_RETRY_INTERVAL_SEC: "2"
      REDIS_MAX_WAIT_SEC: "180"
      REDIS_PING_TIMEOUT_SEC: "3"
      # 3 × CLEANUP_WORKERS_PER_TYPE stream reads each block a pooled connection: keep the pool well above them.
      REDIS_POOL_SIZE: "16"
      CLEANUP_WORKERS_PER_TYPE: "2"
      CLEANUP_STREAM_MAXLEN: "10000"
      CLEANUP_LAG_ALERT_THRESHOLD: "500"
      CLEANUP_SWEEPER_INTERVAL_SECONDS: "60"
      CLEANUP_JOB_MAX_ATTEMPTS: "5"
      CLEANUP_DEDUP_TTL_SECONDS: "600"
      CLEANUP_XCLAIM_MIN_IDLE_SECONDS: "60"
      CLEANUP_LIST_TIMEOUT_SECONDS: "10"
      CLEANUP_PATCH_TIMEOUT_SECONDS: "5"
      CLEANUP_MAX_CONCURRENT_PATCHES: "4"
      BOOTSTRAP_ADMIN: '{{ .Values.app.auth.bootstrap.admin }}'
      # dig: a --reuse-values upgrade from 0.1.x lacks the key, and empty means the service default (24)
      BREAK_GLASS_WAIT_HOURS: '{{ dig "security" "breakGlass" "waitHours" "" .Values.app }}'
      ENROLL_INVITE_TTL_SEC: "3600"
      RP_ID: '{{ .Values.app.auth.passkey.id }}'
      RP_NAME: '{{ .Values.app.auth.passkey.name }}'
      RP_ORIGIN: '{{ .Values.app.auth.passkey.origin }}'
      CHALLENGE_TIMEOUT: "60"
      SESSION_EXPIRY: "24"
      RATE_LIMIT_PER_CLIENT: "30"
      RATE_LIMIT_GLOBAL: "3000"
      # Proxies in front of the ui: the ingress or gateway is one; add one per L7 proxy in front of it.
      RATE_LIMIT_TRUSTED_HOPS: '{{ if or .Values.ingress.enabled .Values.gateway.enabled }}1{{ else }}0{{ end }}'
      RECONCILE_TICK_SECONDS: "5"
      RECONCILE_PASS_DEADLINE_SECONDS: "30"
      RECONCILE_BACKOFF_INITIAL_SECONDS: "5"
      RECONCILE_BACKOFF_MAX_SECONDS: "300"
      OIDC_TRUST_FILE: "/etc/telark/oidc/googleJwkJson"
    volumes:
      - name: oidc-trust
        secret:
          name: '{{ include "telark.oidcTrustSecretName" . }}'
    volumeMounts:
      - name: oidc-trust
        path: /etc/telark/oidc
        readOnly: true
    pdb:
      enabled: false
  ui:
    enabled: true
    name: "ui-service"
    repository: "ui"
    # @ignore
    version: 0.1.2
    category: "ui"
    terminationGracePeriodSec: 30
    # nginx runs as its own uid 101, not the shared 1001, so it gets its own contexts.
    includeSecurity: false
    useRedis: false
    serviceToken: false      # nginx only proxies browser calls; it never calls a service itself
    automountServiceAccountToken: false
    # nginx answers /healthz itself, with no upstream call.
    healthCheck:
      startupProbe:
        path: /healthz
      livenessProbe:
        path: /healthz
      readinessProbe:
        path: /healthz
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: nginx-cache
        path: /var/cache/nginx
      - name: tmp
        path: /tmp

redis:
  architecture: standalone
  # Bitnami publishes only :latest for free, so the digest pins one build of it.
  image:
    digest: sha256:33a5a129cadcc5dfa294e5a1fe622efcbe3774a8b85c731ac14d0532877b7d16
  auth:
    enabled: true  # required: the render fails without it
    # Chart-generated (templates/shared/redis-secret.yaml) and read back on upgrade. GitOps: name
    # a Secret you manage (key redis-password); the chart then generates none.
    existingSecret: '{{ .Release.Name }}-redis-secret'
  # Defense in depth behind the password: ingress only from pods labeled <release>-redis-client.
  networkPolicy:
    enabled: true
    allowExternal: false
  master:
    # Also CONFIG and ACL, so no client can turn the password off at runtime.
    disableCommands: [FLUSHDB, FLUSHALL, CONFIG, ACL]
    persistence:
      enabled: true
      size: 2Gi
    # Replaces the nano preset (same requests). Redis never evicts, so the limit must hold every
    # app's analyzer documents, which grow with the number of applications.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 2Gi

nats:
  enabled: true            # not a subchart switch: it only gates telark's NATS NetworkPolicy
  # GitOps: Secrets you manage (keys username + password) instead of the generated ones.
  existingSecrets:
    publisher: ""
    consumer: ""
  image:
    registry: docker.io
    repository: nats
    tag: 2.12.15-scratch
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  # Inlined, so no --set-file. Users come from their Secrets (extraEnvVars: rename them with app.name).
  # No http_port: the monitoring endpoint is unauthenticated, so probes use the client port.
  configuration: |
    server_name: nats-server
    port: 4222
    jetstream {
      store_dir: "/data"
      max_mem: 1G
      # Below the 1Gi volume, so JetStream refuses new messages before the disk fills.
      max_file: 700M
    }
    authorization {
      users = [
        {
          user: $NATS_PUBLISHER_USER,
          password: $NATS_PUBLISHER_PASSWORD,
          permissions: {
            publish   = ["telark.applications.*"]
            subscribe = ["_INBOX.>"]
          }
        },
        {
          user: $NATS_CONSUMER_USER,
          password: $NATS_CONSUMER_PASSWORD,
          permissions: {
            publish   = ["$JS.API.>", "$JS.ACK.>"]
            subscribe = ["telark.applications.*", "_INBOX.>"]
          }
        }
      ]
    }
  extraEnvVars:
    - name: NATS_PUBLISHER_USER
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.publisher | default "telark-nats-publisher-secret" }}'
          key: username
    - name: NATS_PUBLISHER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.publisher | default "telark-nats-publisher-secret" }}'
          key: password
    - name: NATS_CONSUMER_USER
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.consumer | default "telark-nats-consumer-secret" }}'
          key: username
    - name: NATS_CONSUMER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.consumer | default "telark-nats-consumer-secret" }}'
          key: password
  customLivenessProbe:
    tcpSocket:
      port: client
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  customReadinessProbe:
    tcpSocket:
      port: client
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  # The chart's own policy admits any pod (allowExternal); telark renders a narrower one.
  networkPolicy:
    enabled: false
  persistence:
    enabled: true
    path: /data
    size: 1Gi

kyverno:
  enabled: true            # false: telark uses a Kyverno you already run
  namespaceOverride: "telark"
  # true: admission never blocks while Kyverno is down, so enforce plans are best-effort.
  features:
    forceFailurePolicyIgnore:
      enabled: true
  # Broken as a subchart; templates/policies/kyverno-webhook-cleanup.yaml does its job.
  webhooksCleanup:
    enabled: false
  admissionController:
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    container:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      extraArgs:
        clientRateLimitQPS: 50
        clientRateLimitBurst: 100
    initContainer:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
  backgroundController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    extraArgs:
      clientRateLimitQPS: 50
      clientRateLimitBurst: 100
  cleanupController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    extraArgs:
      clientRateLimitQPS: 50
      clientRateLimitBurst: 100
  reportsController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    extraArgs:
      clientRateLimitQPS: 50
      clientRateLimitBurst: 100

# HPAs and kubectl top need it. false where the cluster already serves v1beta1.metrics.k8s.io (GKE, AKS, k3s, OpenShift).
metrics-server:
  enabled: true
  args: []                 # --kubelet-insecure-tls only where kubelet certificates are self-signed (kind, minikube)
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 400Mi

# VPA operator for app.serviceDefaults.vpa. An upgrade that turns it on needs its CRDs applied first (INSTALL).
vpa:
  enabled: false

# Analyzer model runtime. Nothing is pulled at start: the analyzer pulls the model chosen in Settings.
ollama:
  enabled: true
  ollama:
    models:
      # Stays empty: the subchart's start-up pull ignores autoPull and a failed pull crash-loops the pod.
      pull: []
  persistentVolume:
    enabled: true
    size: 6Gi                # the default model plus any one catalog model: a switch deletes the others
    storageClass: ""
    annotations:
      helm.sh/resource-policy: keep
  # CPU tiny profile (granite4:350m, 4k context: ~1.1Gi resident, idle CPU): minimal fits one
  # 2 vCPU / 8 GiB node. Other profiles: README.
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    # No memory limit: Ollama's free-memory check counts page cache inside the
    # cgroup, so pulled blobs eventually fill any limit and loads are refused.
    limits:
      cpu: "2"
  # Runs as root: the image keeps its models and key under /root/.ollama (a 0700 home), where the
  # volume mounts. It writes nothing else, so the root filesystem stays read-only.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  extraEnv:
    - name: OLLAMA_NO_CLOUD
      value: "true"
    - name: OLLAMA_CONTEXT_LENGTH
      value: "4096"
    - name: OLLAMA_KEEP_ALIVE
      value: "-1"
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "1"
    - name: OLLAMA_MAX_QUEUE
      value: "8"
    - name: OLLAMA_FLASH_ATTENTION
      value: "1"
    - name: OLLAMA_KV_CACHE_TYPE
      value: "q8_0"
