name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security issues here. See SECURITY.md for private reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. helm install ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - chart (telark)
        - chart (telark-crds)
        - discovery
        - exporter
        - auth
        - notifier
        - analyzer
        - ui (dashboard)
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Chart version / app version / image tag.
    validations:
      required: true
  - type: input
    id: k8s
    attributes:
      label: Kubernetes version & provider
      placeholder: e.g. 1.33 on EKS
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
