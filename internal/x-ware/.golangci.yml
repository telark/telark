# Shared golangci-lint config for every Go service. Services carry no local
# config; CI pins this file with --config (see .github/actions/go-ci).
# Thresholds are the loosest of the former per-service configs, unified here.
version: "2"
linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - gocyclo
    - misspell
    - unparam
    - nakedret
    - perfsprint
    - prealloc
    - nolintlint
    - funlen
    - dupl
    - bodyclose
    - containedctx
    - goprintffuncname
    - whitespace
    - unconvert
    - revive
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 12
    misspell:
      locale: US
    funlen:
      lines: 60
    gosec:
      excludes:
        - G101
        - G118
    revive:
      enable-all-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: package-naming
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: flag-parameter
          disabled: true
        # The exporter/handler layers name every operation Verb...(w, args) and
        # write to the ResponseWriter instead of returning. The rule would force
        # the two Get* of ten such functions to break that convention.
        - name: get-return
          disabled: true
        - name: line-length-limit
          arguments:
            - 150
        # Counted per file, so a request/response or endpoint types file trips it
        # for being what it is. Raising the cap only moves the next failure.
        - name: max-public-structs
          disabled: true
        - name: function-result-limit
          arguments:
            - 8
        - name: argument-limit
          arguments:
            - 9
        - name: var-naming
          arguments:
            - ["ID"] # AllowList
            - [] # DenyList
            - - skip-package-name-checks: true
run:
  go: "1.27"
  # 3m tripped on a cold lint cache (201s); warm runs are well under.
  timeout: 10m
  tests: true
issues:
  max-issues-per-linter: 0
  # Default is 3: repeated messages get capped, so every reported count is a floor, not a total.
  max-same-issues: 0
