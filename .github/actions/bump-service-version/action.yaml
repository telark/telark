name: 'Bump Service Version'
description: 'Bump service version in Helm values and return version information'
inputs:
  service:
    description: 'Name of the service'
    required: true
  build_type:
    description: 'Type of version bump (patch, minor, major)'
    required: true
  values_file_path:
    description: 'Path to the Helm values.yaml file'
    required: true
    default: './release/charts/telark/values.yaml'

outputs:
  service_name:
    description: 'The processed service name (converted from kebab-case to camelCase)'
    value: ${{ steps.bump_version.outputs.service_name }}
  service_new_version:
    description: 'The new version number'
    value: ${{ steps.bump_version.outputs.service_new_version }}
  new_version:
    description: 'The new image tag (semver, no prefix)'
    value: ${{ steps.bump_version.outputs.new_version }}
  service_current_version:
    description: 'The current version before bump'
    value: ${{ steps.bump_version.outputs.service_current_version }}

runs:
  using: 'composite'
  steps:
    # Inputs reach the script through env, never string interpolation, so a
    # value carrying shell syntax cannot escape into the command.
    - name: Bump Service Version
      id: bump_version
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        BUILD_TYPE: ${{ inputs.build_type }}
        VALUES_FILE_PATH: ${{ inputs.values_file_path }}
        # .github/actions/<name> -> up two -> .github -> scripts. Anchored on
        # action_path, not the workspace, so it resolves under any checkout path.
        SCRIPT_DIR: ${{ github.action_path }}/../../scripts
      run: bash "$SCRIPT_DIR/bump-service-version.sh"
