apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationsasresources.erpi.{{ $.Values.app.name }}
  labels:
    app.kubernetes.io/name: applicationsasresources.erpi.{{ $.Values.app.name }}
    app.kubernetes.io/part-of: {{ $.Values.app.name }}
spec:
  group: erpi.{{ $.Values.app.name }}
  names:
    kind: ApplicationAsResource
    plural: applicationsasresources
    singular: applicationasresource
    shortNames:
      - applications
      - application
      - appres
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                displayName:
                  type: string
                description:
                  type: string
                  nullable: true
                health:
                  type: object
                  properties:
                    status:
                      type: string
                    reason:
                      type: string
                      nullable: true
                    readyReplicas:
                      type: integer
                    totalReplicas:
                      type: integer
                resourceCount:
                  type: integer
                namespaces:
                  type: object
                  properties:
                    total:
                      type: integer
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          resourceCount:
                            type: integer
                managed:
                  type: object
                  properties:
                    by:
                      type: string
                    chart:
                      type: string
                      nullable: true
                    version:
                      type: string
                      nullable: true
                createdAt:
                  type: string
                lastUpdated:
                  type: string
                resourceSummary:
                  type: object
                  properties:
                    Deployment:
                      type: integer
                    StatefulSet:
                      type: integer
                    DaemonSet:
                      type: integer
                    Job:
                      type: integer
                    CronJob:
                      type: integer
                    Service:
                      type: integer
                    NetworkPolicy:
                      type: integer
                    Ingress:
                      type: integer
                    ServiceAccount:
                      type: integer
                    ConfigMap:
                      type: integer
                    Secret:
                      type: integer
                    PersistentVolumeClaim:
                      type: integer
                    HorizontalPodAutoscaler:
                      type: integer
                    VerticalPodAutoscaler:
                      type: integer
                resources:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                insights:
                  type: object
                  properties:
                    enriched:
                      type: boolean
                    enrichedAt:
                      type: string
                    confidence:
                      type: string
                      nullable: true
                    summary:
                      type: string
                      nullable: true
                    techStack:
                      type: array
                      items:
                        type: string
                    role:
                      type: string
                      nullable: true
                    dependencies:
                      type: array
                      items:
                        type: string
                    category:
                      type: string
                      nullable: true
                    risks:
                      type: array
                      items:
                        type: string
                    suggestions:
                      type: array
                      items:
                        type: string
                    relatedApps:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          reason:
                            type: string
                    promptVersion:
                      type: string
                      nullable: true
                images:
                  type: array
                  items:
                    type: string
                ports:
                  type: array
                  items:
                    type: integer
                configMapRefs:
                  type: array
                  items:
                    type: string
                secretRefs:
                  type: array
                  items:
                    type: string
                serviceMappings:
                  type: array
                  items:
                    type: string
                ingressRules:
                  type: array
                  items:
                    type: string
                envVarKeys:
                  type: array
                  items:
                    type: string
                snapshots:
                  type: array
                  items:
                    type: object
                    properties:
                      generation:
                        type: integer
                      changeClass:
                        type: string
                      severity:
                        type: string
                      takenAt:
                        type: string
                      id:
                        type: string
                      namespace:
                        type: string
                      path:
                        type: string
                rollbacks:
                  type: array
                  default: []
                  items:
                    type: object
                    required:
                      - id
                      - targetSnapshotId
                      - targetGeneration
                      - targetPath
                      - triggeredBy
                      - triggeredAt
                      - status
                      - namespace
                    properties:
                      id:
                        type: string
                      targetSnapshotId:
                        type: string
                      targetGeneration:
                        type: integer
                      targetPath:
                        type: string
                      triggeredBy:
                        type: string
                      triggeredAt:
                        type: string
                        format: date-time
                      completedAt:
                        type: string
                        format: date-time
                      status:
                        type: string
                        enum: [pending, in_progress, success, failed]
                      error:
                        type: string
                        default: ""
                      restoredGeneration:
                        type: integer
                      namespace:
                        type: string
                metrics:
                  type: object
                  properties:
                    derived:
                      type: object
                      properties:
                        totalChanges:
                          type: integer
                        changesByClass:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        changesBySeverity:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        totalIncidents:
                          type: integer
                        totalRecoveries:
                          type: integer
                        snapshotCount:
                          type: integer
                        firstChangeDetectedAt:
                          type: string
                        lastChangeDetectedAt:
                          type: string
                        changeVelocityPerDay:
                          type: number
                        uniqueFingerprints:
                          type: integer
                    workloads:
                      type: array
                      items:
                        type: object
                        properties:
                          resourceName:
                            type: string
                          resourceKind:
                            type: string
                          namespace:
                            type: string
                          baseline:
                            type: object
                            properties:
                              fingerprint:
                                type: string
                              replicas:
                                type: integer
                              requests:
                                type: object
                                properties:
                                  cpu:
                                    type: string
                                  memory:
                                    type: string
                              limits:
                                type: object
                                properties:
                                  cpu:
                                    type: string
                                  memory:
                                    type: string
                          usage:
                            {{- include "usageBlockSchema" . | nindent 28 }}
                lastForceSync:
                  type: object
                  properties:
                    jobId:
                      type: string
                    phase:
                      type: string
                      enum:
                        - queued
                        - running
                        - completed
                        - failed
                    requestedAt:
                      type: string
                      format: date-time
                      nullable: true
                    startedAt:
                      type: string
                      format: date-time
                      nullable: true
                    completedAt:
                      type: string
                      format: date-time
                      nullable: true
                    requestedBy:
                      type: string
                    reason:
                      type: string
                    error:
                      type: string
                history:
                  type: object
                  properties:
                    generation:
                      type: integer
                    hasDrift:
                      type: boolean
                    lastModifiedBy:
                      type: string
                      nullable: true
                    lastModifiedAt:
                      type: string
                      nullable: true
                    changeLog:
                      type: array
                      items:
                        type: object
                        properties:
                          generation:
                            type: integer
                          detectedAt:
                            type: string
                          changeClass:
                            type: string
                            enum:
                              - topology
                              - deployment
                              - scaling
                              - resources
                              - config
                              - incident
                              - recovery
                              - rollback
                              - drift
                              - ""
                          severity:
                            type: string
                            enum:
                              - critical
                              - high
                              - medium
                              - low
                              - ""
                          changedBy:
                            type: string
                            nullable: true
                          fingerprint:
                            type: string
                          isIncident:
                            type: boolean
                          isRecovery:
                            type: boolean
                          changes:
                            type: array
                            items:
                              type: object
                              properties:
                                field:
                                  type: string
                                description:
                                  type: string
                                changeType:
                                  type: string
                                  enum:
                                    - added
                                    - removed
                                    - updated
                                    - rollback
                                oldValue:
                                  type: string
                                  nullable: true
                                newValue:
                                  type: string
                                  nullable: true
