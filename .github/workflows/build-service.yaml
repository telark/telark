# Build: bump a component's version, build + push its container image, scan and
# sign it, then record the bump. Covers the Go/Python services that live in this repo
name: Build · Service Image
run-name: Build "${{ inputs.service }}" image (bump "${{ inputs.build_type }}")
on:
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: choice
        description: Service
        default: discovery
        options:
          - discovery
          - exporter
          - notifier
          - auth
          - analyzer
      image_scan:
        required: false
        type: choice
        description: Image Scanning
        default: scan
        options:
          - skip
          - scan
      branch:
        required: false
        type: string
        description: Source branch (blank = main)
        default: ""
      build_type:
        required: false
        type: choice
        description: Service Build Type
        options:
          - re-build-current
          - patch
          - minor
          - major

concurrency:
  group: build-image-${{ inputs.service }}
  cancel-in-progress: false

env:
  NAMESPACE: "telark"
  DOCKER_BUILDKIT: 1
  CHART_VALUES: release/charts/telark/values.yaml

jobs:
  # One gate per service kind: exactly one runs per dispatch, the other skips.
  # `build` tolerates a skipped gate but not a failed one (see its `if`).
  gate-go:
    name: Gate · Go
    if: ${{ inputs.service != 'analyzer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout telark (charts + composite actions)
        uses: actions/checkout@v7.0.1
        with:
          path: release
          ref: ${{ inputs.branch || 'main' }}

      # test: 'false' — CI already ran the suites on the PR; this gate only
      # re-lints the code about to be shipped.
      - name: Go lint gate
        uses: ./release/.github/actions/go-ci
        with:
          working-directory: release/services/${{ inputs.service }}
          cache-key: ${{ inputs.service }}-lint
          access-user: ${{ secrets.ACCESS_USER }}
          access-token: ${{ secrets.ACCESS_TOKEN }}
          config-file: release/.golangci.yml
          test: 'false'

  gate-analyzer:
    name: Gate · Python
    if: ${{ inputs.service == 'analyzer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Syntax check
        run: python -m compileall -q .

      # Same two-process split and ratchet floor as ci.yaml, so local, CI and
      # build never disagree. Never lower 95.
      - name: Test
        run: |
          python -m pytest --cov=. --cov-report= tests/test_*_cov.py -q
          python -m pytest --cov=. --cov-append --cov-report= tests/test_authz.py tests/test_insights.py tests/test_exporter.py -q
          python -m coverage report --fail-under=95

  build:
    needs: [gate-go, gate-analyzer]
    # A skipped gate is expected (only one kind runs); a failed or cancelled
    # gate must block the build.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commit the version bump
      id-token: write   # cosign keyless image signing (OIDC)
    outputs:
      image_tag: ${{ steps.release.outputs.new_version }}
    steps:
      - name: Checkout telark (charts + composite actions)
        uses: actions/checkout@v7.0.1
        with:
          path: release
          ref: ${{ inputs.branch || 'main' }}

      - name: Release service image
        id: release
        uses: ./release/.github/actions/release-service-image
        with:
          service: ${{ inputs.service }}
          build_type: ${{ inputs.build_type }}
          values_file: ${{ env.CHART_VALUES }}
          context: release/services/${{ inputs.service }}/
          dockerfile: ./release/services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          registry_username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          registry_password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          image_scan: ${{ inputs.image_scan }}
          # Only the Python image runs foreign-arch binaries at build time; the
          # Go images cross-compile.
          setup_qemu: ${{ inputs.service == 'analyzer' }}
