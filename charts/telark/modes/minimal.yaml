# Install mode: minimal — selected with --set app.mode=minimal
#
# Smallest footprint that runs the product. Single replica per service, no
# disruption budgets, small resource envelopes so pods fit a single dev node.
# For development, demos and evaluation. Losing a node takes the service with it.
#
# Sizes telark's own services only — subchart sizing (redis, nats, kyverno) is
# fixed by the chart and does not vary by mode. Capacity here says nothing about
# security posture (app.crdGuard is independent).
# Measured 2026-09-17: fine to a few hundred apps; at 1 000 apps discovery OOMs
# at 256Mi and the 20 QPS exporter limit throttles bulk deletes — use standard.

app:
  serviceDefaults:
    replicas: 1
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
  shared:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

services:
  exporter:
    replicas: 1
    strategy: Recreate
    env:
      EXPORTER_K8S_CLIENT_QPS: "20"
      EXPORTER_K8S_CLIENT_BURST: "40"
    pdb:
      enabled: false
  discovery:
    replicas: 1
    env:
      DISCOVERY_K8S_CLIENT_QPS: "50"
      DISCOVERY_K8S_CLIENT_BURST: "100"
      FORCE_SYNC_WORKERS: "2"
    pdb:
      enabled: false
  enrichment:
    env:
      NUM_WORKERS: "1"
    pdb:
      enabled: false
  notifier:
    pdb:
      enabled: false
  auth:
    env:
      CLEANUP_WORKERS_PER_TYPE: "1"
    pdb:
      enabled: false
