apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usersasresources.erpi.{{ $.Values.app.name }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: erpi.{{ $.Values.app.name }}
  names:
    kind: UserAsResource
    plural: usersasresources
    singular: userasresource
    shortNames:
      - users
      - usr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - id
                - username
                - fullname
                - email
                - creationDate
                - status
              properties:
                id:
                  type: string
                  description: Unique identifier for the user
                  pattern: '^u-[0-9a-f]{5}-[0-9a-f]{4}-[0-9a-f]{4}$'
                  minLength: 17
                  maxLength: 17
                username:
                  type: string
                  description: Unique username used for login
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_-]+$'
                fullname:
                  type: string
                  description: Display name of the user
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  description: User's email address
                  format: email
                assignedRolesIDs:
                  type: array
                  items:
                    type: string
                assignedGroupsIDs:
                  type: array
                  items:
                    type: string
                identities:
                  type: array
                  description: External identity provider links
                  items:
                    type: object
                    properties:
                      provider:
                        type: string
                        description: Identity provider name (e.g. google)
                      issuer:
                        type: string
                        description: Token issuer URL
                      subject:
                        type: string
                        description: Unique subject identifier from provider
                avatar:
                  type: object
                  description: Avatar configuration for DiceBear
                  properties:
                    style:
                      type: string
                      description: DiceBear avatar style name
                    seed:
                      type: string
                      description: Avatar seed for generation
                status:
                  type: object
                  description: User status information
                  required:
                    - phase
                  properties:
                    phase:
                      type: string
                      description: Current phase of the user account
                    lastLoginAt:
                      type: string
                      description: ISO 8601 timestamp of last login (optional)
                      format: date-time
                {{- include "dateFieldsSchema" . | nindent 16 }}

