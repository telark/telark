{{- $service := "exporter" -}}
{{- $values := include "telark.modeValues" $ | fromYaml -}}
{{- $serviceConfig := index $values.services $service -}}
{{- if and $serviceConfig.enabled $values.app.persistence.enabled }}
{{- $sc := $values.app.persistence.storageClass | default "" -}}
{{- $claims := list (dict "name" (include "telark.exporterSnapshotsPvcName" $) "size" ($values.app.persistence.size | default "1Gi")) (dict "name" (include "telark.exporterReportsPvcName" $) "size" ($values.app.persistence.reportsSize | default "2Gi")) }}
{{- range $claims }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  namespace: {{ $values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceConfig.name }}
spec:
  accessModes:
    - {{ $values.app.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .size }}
  {{- if $sc }}
  {{- if eq "-" $sc }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
