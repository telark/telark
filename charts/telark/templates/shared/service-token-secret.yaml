{{/*
Shared secret proving one Telark service is calling another. Peers present it
on internal endpoints that cannot require a user session, such as the session
creation the login flow depends on.

The value is looked up before it is generated so that an upgrade keeps the
token already in the cluster. Regenerating it on every upgrade would leave
pods on both sides of a rollout unable to authenticate each other.
*/}}
{{- $secretName := printf "%s-service-token-secret" $.Values.app.name -}}
{{- $existing := lookup "v1" "Secret" $.Values.app.namespace $secretName -}}
{{- $token := $.Values.app.serviceToken.value -}}
{{- if not $token -}}
{{- if and $existing $existing.data -}}
{{- $token = index $existing.data "token" | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: service-token
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
