{{- /*
Without an aggregation label the built-in admin and edit roles never include it, and the binding names only
app.auth.request.subjects (empty by default): whoever may bind roles grants it.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Values.app.name }}-auth
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: security
rules:
  - apiGroups: [{{ include "telark.apiGroup" $ | quote }}]
    resources: ["authrequests"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [{{ include "telark.apiGroup" $ | quote }}]
    resources: ["telarkconfigs"]
    verbs: ["get"]
{{- with $.Values.app.auth.request.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Values.app.name }}-auth
  namespace: {{ $.Values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: security
subjects:
  {{- range . }}
  - kind: {{ .kind }}
    name: {{ .name | quote }}
    apiGroup: rbac.authorization.k8s.io
  {{- end }}
roleRef:
  kind: ClusterRole
  name: {{ $.Values.app.name }}-auth
  apiGroup: rbac.authorization.k8s.io
{{- end }}
