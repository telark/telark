# Build: build + push the dashboard-ui image, tag the UI repo, then dispatch a
# cluster deploy.
name: Build · UI Image
run-name: Build UI image (bump "${{ inputs.build_type }}")
on:
  workflow_dispatch:
    inputs:
      image_scan:
        required: false
        type: choice
        description: Image Scanning
        default: skip
        options:
          - skip
          - scan
      branch:
        required: true
        type: string
        description: UI Branch
        default: "master"
      build_type:
        required: false
        type: choice
        description: UI Build Type
        options:
          - re-build-current
          - patch
          - minor
          - major

env:
  NAMESPACE: "telark"
  DOCKER_BUILDKIT: 1
  SERVICE: "ui"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.service_data.outputs.new_version }}
    steps:
      - name: Checkout UI Repository
        uses: actions/checkout@v7.0.1
        with:
          repository: telark/dashboard-ui
          token: ${{ secrets.ACCESS_TOKEN }}
          path: service
          ref: ${{ github.event.inputs.branch }}

      - name: Checkout Core Repository
        uses: actions/checkout@v7.0.1
        with:
          repository: telark/telark
          path: release
          ref: 'main'
          fetch-depth: 0

      - name: Bump UI Version
        id: service_data
        uses: ./release/.github/actions/bump-service-version
        with:
          service: ${{ env.SERVICE }}
          build_type: ${{ inputs.build_type }}
          values_file_path: './release/charts/telark/values.yaml'

      - name: Read image config from helm values
        id: image
        uses: ./release/.github/actions/helm-image-config
        with:
          values-file: release/charts/telark/values.yaml
          service: ${{ env.SERVICE }}

      - name: Docker Login
        uses: ./release/.github/actions/docker-login
        with:
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and Push UI Image
        uses: ./release/.github/actions/build-push-service-image
        with:
          service_name: ${{ env.SERVICE }}
          service_path: 'service'
          image_tag: ${{ steps.service_data.outputs.new_version }}
          container_registry_name: ${{ steps.image.outputs.registry }}
          container_registry_repo_name: ${{ steps.image.outputs.repository }}
          dockerfile_path: './service/Dockerfile'
          platforms: 'linux/amd64'
          cache_enabled: 'true'
          push_enabled: 'true'

      - name: Tag UI Repository
        uses: ./release/.github/actions/tag-service-repo
        with:
          service_name: ${{ env.SERVICE }}
          service_version: ${{ steps.service_data.outputs.service_new_version }}
          service_path: service
          branch: ${{ inputs.branch }}

      - name: Commit UI Version
        uses: ./release/.github/actions/git-commit-version-bump
        with:
          cwd: './release'
          message: "bump ui to ${{ steps.service_data.outputs.new_version }}"
