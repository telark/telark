# git-cliff configuration for telark/dashboard-ui, used by build-ui.yaml (via release-service-image).
# Same parsers and template as ../cliff.toml: keep them in sync. Each UI build prepends its version.

[remote.github]
owner = "telark"
repo = "dashboard-ui"

[changelog]
header = """
# Changelog

All notable changes to the Telark dashboard UI are documented here.\n
"""
body = """
{%- set repo_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% if version and previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% elif version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [unreleased]
{% endif -%}
{% if commits | length == 0 %}
No user-facing changes.
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{%- set subject = commit.message | split(pat="\n") | first | trim %}
{%- set pr = subject | split(pat=" (#") | last | trim_end_matches(pat=")") | int(default=0) %}
- {{ subject | trim_end_matches(pat=" (#" ~ pr ~ ")") | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}\
{% if pr %} ([#{{ pr }}]({{ repo_url }}/pull/{{ pr }})){% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo_url }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{%- set contributors = github.contributors | filter(attribute="username") | map(attribute="username") | unique | sort -%}
{% if contributors | length > 0 %}
### Contributors
{% for username in contributors %}{% if username is not ending_with("[bot]") and username != "actions-user" %}
- [@{{ username }}](https://github.com/{{ username }})
{%- endif %}{% endfor %}
{% endif %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '^\s+', replace = "" },
  { pattern = '^([^\n]*)\n([^\n])', replace = "${1}\n\n${2}" },
  { pattern = '^', replace_command = '''pr=$(gh api "repos/telark/dashboard-ui/commits/$COMMIT_SHA/pulls" --jq 'map(select(.base.ref == .base.repo.default_branch))[0].number // empty' 2>/dev/null </dev/null) || pr=; sed "1{/ (#[0-9][0-9]*)\$/!s/\$/${pr:+ (#$pr)}/;}"''' },
]
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 5 -->💥 Breaking Changes" },
  { message = '^[a-z]+\((release|ci|build|tests?)\)', skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^security", group = "<!-- 3 -->🔐 Security" },
  { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
  { message = ".*", skip = true },
]
