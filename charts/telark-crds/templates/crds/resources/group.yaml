apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: groupsasresources.erpi.{{ $.Values.app.name }}
  labels:
    app.kubernetes.io/name: groupsasresources.erpi.{{ $.Values.app.name }}
    app.kubernetes.io/part-of: {{ $.Values.app.name }}
spec:
  group: erpi.{{ $.Values.app.name }}
  names:
    kind: GroupAsResource
    plural: groupsasresources
    singular: groupasresource
    shortNames:
      - group
      - groups
      - grp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - id
                - name
                - description
                - categoryID
                - creationDate
              properties:
                id:
                  type: string
                  description: Unique identifier for the group
                  pattern: '^ug-[0-9a-f]{5}-[0-9a-f]{4}-[0-9a-f]{4}$'
                  minLength: 18
                  maxLength: 18
                assignedUsersIDs:
                  type: array
                  items:
                    type: string
                assignedRolesIDs:
                  type: array
                  items:
                    type: string
                name:
                  type: string
                  description: Name of the group
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  description: Description of the group's purpose
                  minLength: 1
                  maxLength: 300
                categoryID:
                  type: string
                  description: Category ID of the group
                {{- include "dateFieldsSchema" . | nindent 16 }}
                createdBy:
                  type: string
                  description: ID of the user who created the role
                lastUpdatedBy:
                  type: string
                  description: ID of the user who last updated the role

