name: 'Setup Helm and Go'
description: 'Install Helm and Go for chart tooling (helm-docs, kubeconform, etc).'
inputs:
  go-version:
    description: 'Go version to install'
    required: false
    default: '1.26'

runs:
  using: 'composite'
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@v5.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
