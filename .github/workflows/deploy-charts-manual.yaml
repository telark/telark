# Deploy: manual button that dispatches the "Deploy · Charts to Cluster" worker
# to package and install the charts onto the cluster.
name: Deploy · Charts to Cluster (manual)
run-name: Deploy charts to cluster — manual (bump "${{ inputs.build_type }}")
on:
  workflow_dispatch:
    inputs:
      build_type:
        required: false
        type: choice
        description: Build Type
        options:
          - patch
          - minor
          - major
      install_mode:
        required: false
        type: choice
        description: "Install Mode (sizing for every chart: replicas, resources, rate limits, volumes)"
        options:
          - minimal
          - standard
          - performance
        default: minimal

      sonar_scan:
        required: false
        type: choice
        description: SonarQube Scan
        options:
          - allow
          - skip
        default: skip

env:
  NAMESPACE: "telark"

jobs:
  trigger-helm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Helm Release Pipeline
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          repository: telark/telark
          token: ${{ secrets.ACCESS_TOKEN }}
          event-type: execute-telark-helm-release
          client-payload: '{"build_type": "${{ inputs.build_type }}", "ns": "${{ env.NAMESPACE }}", "sonar_scan": "${{ inputs.sonar_scan }}", "install_mode": "${{ inputs.install_mode }}"}'