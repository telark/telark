name: 'Go CI'
description: 'Set up Go, restore the build + module cache, then test and/or lint. Run test and lint as separate jobs: -race builds are not reusable by lint, so each gets its own cache-key.'
inputs:
  working-directory:
    description: 'Directory holding the Go module (contains go.mod)'
    required: false
    default: '.'
  packages:
    description: 'Package pattern to test and lint, relative to working-directory (e.g. ./services/auth/...)'
    required: true
  cache-key:
    description: 'Unique cache-key component, e.g. the service or package name'
    required: true
  test:
    description: 'Run go test -race'
    required: false
    default: 'true'
  lint:
    description: 'Run golangci-lint'
    required: false
    default: 'true'
  config-file:
    description: 'Path to the shared .golangci.yml, relative to the workspace root'
    required: false
    default: '.golangci.yml'
  coverage-threshold:
    description: 'Minimum total coverage percent; the build fails below it (0 = no gate)'
    required: false
    default: '0'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod
        # Explicit cache below (with restore-keys) instead of setup-go's
        # exact-match cache, so a changed go.sum still reuses the prior build.
        cache: false

    # restore/save split, not plain actions/cache: its post step is skipped when
    # the job fails, so a run that times out never seeds the cache and the next
    # run is cold again. The explicit save below runs with if: always().
    - name: Restore Go build and module cache
      id: go-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # ~/.cache/golangci-lint is left to golangci-lint-action's own cache.
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ inputs.cache-key }}-${{ hashFiles(format('{0}/go.sum', inputs.working-directory), '.golangci.yml') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ inputs.cache-key }}-

    # A restore-keys hit carries every stale build forward, so the cache only ever
    # grew (discovery 0.9 -> 2.4 GB). Backdate every entry: go re-stamps the ones it
    # reads, and the trim before save drops the rest.
    - name: Backdate restored build cache
      if: ${{ steps.go-cache.outputs.cache-matched-key != '' }}
      shell: bash
      run: find ~/.cache/go-build -type f -exec touch -m -d 2000-01-01 {} +

    # No separate `go build ./...`: both Test (`go test ./...`) and Lint compile
    # every package, so a standalone build step is a third redundant compile.

    - name: Test
      if: ${{ inputs.test == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        PACKAGES: ${{ inputs.packages }}
        # action_path is absolute, so this still resolves from working-directory.
        # .github/actions/<name> -> up two -> .github -> scripts.
        SCRIPT_DIR: ${{ github.action_path }}/../../scripts
      run: bash "$SCRIPT_DIR/go-ci-test.sh"

    - name: Lint
      if: ${{ inputs.lint == 'true' }}
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        # Pinned, not `latest`: a linter release can add rules overnight and
        # break an unrelated PR. Bump deliberately, after running it locally.
        version: v2.14.0
        working-directory: ${{ inputs.working-directory }}
        args: --config=${{ github.workspace }}/${{ inputs.config-file }} ${{ inputs.packages }}

    - name: Trim build cache to entries used by this run
      if: always() && steps.go-cache.outputs.cache-hit != 'true' && steps.go-cache.outputs.cache-matched-key != ''
      shell: bash
      run: find ~/.cache/go-build -type f ! -newermt 2000-01-02 -delete

    - name: Save Go build and module cache
      if: always() && steps.go-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ steps.go-cache.outputs.cache-primary-key }}
