name: 'Setup Helm and Go'
description: 'Install Helm and Go for chart tooling (helm-docs, kubeconform, etc).'
inputs:
  go-version:
    description: 'Go version to install'
    required: false
    default: '1.27'

runs:
  using: 'composite'
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        # Keyed on the file that pins helm-docs, the only thing `go run` builds here,
        # so the cache survives module dependency bumps (a cold build costs 25-35 s).
        cache-dependency-path: .github/actions/helm-docs-regenerate/action.yaml
