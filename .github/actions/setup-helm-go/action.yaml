name: 'Setup Helm and Go'
description: 'Install Helm and Go for chart tooling (helm-docs, kubeconform, etc).'
inputs:
  go-version:
    description: 'Go version to install'
    required: false
    default: '1.27'

runs:
  using: 'composite'
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@v5.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        # No root go.sum, so the default cache never restored and `go run helm-docs`
        # rebuilt every run (25-35 s). Key it on the file that pins helm-docs.
        cache-dependency-path: .github/actions/helm-docs-regenerate/action.yaml
