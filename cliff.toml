# git-cliff configuration — https://git-cliff.org
# Renders CHANGELOG.md and the GitHub Release notes. The release workflow prepends each version's
# section and never rebuilds older ones, so the compare link sits in the heading, not in a footer.

[remote.github]
owner = "telark"
repo = "telark"

[changelog]
header = """
# Changelog

All notable changes to Telark are documented here.\n
"""
body = """
{%- set repo_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% if version and previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% elif version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{%- set subject = commit.message | split(pat="\n") | first | trim %}
{%- set pr = subject | split(pat=" (#") | last | trim_end_matches(pat=")") | int(default=0) %}
- {{ subject | trim_end_matches(pat=" (#" ~ pr ~ ")") | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}\
{% if pr %} ([#{{ pr }}]({{ repo_url }}/pull/{{ pr }})){% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo_url }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{%- set ui_notes = get_env(name="TELARK_UI_NOTES", default="") -%}
{% if ui_notes %}
### 🖥️ Dashboard UI

{{ ui_notes }}
{% endif %}
{%- set contributors = github.contributors | filter(attribute="username") | map(attribute="username") | unique | sort -%}
{% if contributors | length > 0 %}
### Contributors
{% for username in contributors %}{% if username is not ending_with("[bot]") and username != "actions-user" %}
- [@{{ username }}](https://github.com/{{ username }})
{%- endif %}{% endfor %}
{% endif %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The first commit parser already files breaking commits; true would only let them bypass .cliffignore.
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # Repair two slips git-conventional rejects (filter_unconventional would drop the commit):
  # leading whitespace, and a body that starts on line 2 with no blank line after the subject.
  { pattern = '^\s+', replace = "" },
  { pattern = '^([^\n]*)\n([^\n])', replace = "${1}\n\n${2}" },
  # git-cliff only links squash merges, so ask GitHub for the PR that brought the commit to main (or the
  # release branch's open PR) and add it as the squash-style "(#123)" suffix the template links.
  { pattern = '^', replace_command = '''pr=$(gh api "repos/telark/telark/commits/$COMMIT_SHA/pulls" --jq 'map(select(.base.ref == .base.repo.default_branch))[0].number // empty' 2>/dev/null </dev/null) || pr=; sed "1{/ (#[0-9][0-9]*)\$/!s/\$/${pr:+ (#$pr)}/;}"''' },
]
# First match wins; the HTML comments only order the sections.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 5 -->💥 Breaking Changes" },
  { message = '^[a-z]+\((release|ci|build|tests?)\)', skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^security", group = "<!-- 3 -->🔐 Security" },
  { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
  # Everything else (refactor, test, style, chore, ci, build, …) is maintenance, not release news.
  { message = ".*", skip = true },
]
