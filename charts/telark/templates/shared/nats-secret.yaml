{{/*
NATS auth credentials. The password is looked up before it is generated so an
upgrade keeps the value already in the cluster — regenerating it would drop the
running NATS server and every connected client mid-rollout. One secret feeds
both sides: the server env-expands $NATS_PASSWORD in nats.configuration (values.yaml),
and the client services mount it via app.shared.natsEnvFromSecret.
*/}}
{{- $secretName := printf "%s-nats-secret" $.Values.app.name -}}
{{- $existing := lookup "v1" "Secret" $.Values.app.namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: nats
type: Opaque
data:
  username: {{ "nats" | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
