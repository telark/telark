name: CI
run-name: CI for ${{ github.head_ref || github.ref_name }}

# Quality gate for pull requests: every service builds, lints and tests before a
# change can merge. Build/release workflows stay manual (workflow_dispatch); this
# is the automated check that protects the repo.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # The internal telark modules (data, rest, x-ware, kcore) resolve as private
  # today and public at release. GOPRIVATE + the token step below cover both; the
  # token is harmless once the modules are public. Note: local `replace` directives
  # pointing at sibling paths must be absent (release state) for these jobs to pass.
  GOPRIVATE: github.com/telark/*
  GOWORK: "off"
  CHART_DIR: charts/telark
  CRDS_DIR: charts/telark-crds

jobs:
  go:
    name: Go · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, discovery, exporter, notifier]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Go CI
        uses: ./.github/actions/go-ci
        with:
          working-directory: services/${{ matrix.service }}
          cache-key: ${{ matrix.service }}
          access-user: ${{ secrets.ACCESS_USER }}
          access-token: ${{ secrets.ACCESS_TOKEN }}

  enrichment:
    name: Python · enrichment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/enrichment
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/enrichment/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Syntax check
        run: python -m compileall -q .

      # The stub-based suites replace sys.modules at import, so they run in a
      # separate process from the real-dependency suites to avoid cross-pollution.
      - name: Test
        run: |
          python -m pytest tests/test_*_cov.py -q
          python -m pytest tests/test_authz.py tests/test_insights.py tests/test_provider_config.py -q

  helm:
    name: Helm · lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          helm lint "$CHART_DIR"
          helm lint "$CRDS_DIR"
