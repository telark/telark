name: Cleanup Unused Docker Images
run-name: Cleanup Unused Docker Images (Dry Run ${{ inputs.dry_run }})

on:
  schedule:
    # Run every day at 17:00 Paris time (3:00 PM UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        required: false
        type: boolean
        description: Dry run mode (show what would be deleted without actually deleting)
        default: false
      days_old:
        required: false
        type: number
        description: Delete images older than X days
        default: 3

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Get Docker Hub Authentication Token
        id: auth
        run: |
          echo "Getting Docker Hub authentication token..."
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST -d '{"username": "${{ secrets.CONTAINER_REGISTRY_USERNAME }}", "password": "${{ secrets.CONTAINER_REGISTRY_PASSWORD }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')
          
          if [[ -z "$TOKEN" ]]; then
            echo "Error: Failed to get authentication token"
            exit 1
          fi
          
          echo "Authentication successful"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Get Protected Images from Helm Values
        id: protected
        run: |
          # Get all service names
          SERVICES=$(yq e '.services | keys | .[]' helm/app/values.yaml)
          
          PROTECTED_IMAGES=""
          for SERVICE in $SERVICES; do
            ENABLED=$(yq e ".services.$SERVICE.enabled" helm/app/values.yaml)
            if [[ "$ENABLED" == "true" ]]; then
              TAG=$(yq e ".services.$SERVICE.imageTagPrefix" helm/app/values.yaml)
              VERSION=$(yq e ".services.$SERVICE.version" helm/app/values.yaml)
              IMAGE_NAME="${TAG}${VERSION}"
              PROTECTED_IMAGES="$PROTECTED_IMAGES $IMAGE_NAME"
              echo "Protecting image: $IMAGE_NAME (service: $SERVICE)"
            fi
          done
          
          echo "Protected images: $PROTECTED_IMAGES"
          
          # Save to file instead of using GITHUB_OUTPUT for complex data
          echo "$PROTECTED_IMAGES" > protected_images.txt

      - name: Get All Repository Tags
        id: tags
        run: |          
          REGISTRY="$(yq e '.app.image.registry' helm/app/values.yaml)/$(yq e '.app.image.repository' helm/app/values.yaml)"
          TOKEN="${{ steps.auth.outputs.token }}"
          
          ALL_TAGS=""
          PAGE=1
          
          while true; do
            echo "Fetching page $PAGE of tags..."
            
            # Get tags for current page
            PAGE_RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REGISTRY/tags/?page=$PAGE&page_size=100")
            
            # Check if response is valid
            if [[ "$PAGE_RESPONSE" == "null" ]] || [[ "$PAGE_RESPONSE" == "" ]]; then
              echo "No more pages to fetch."
              break
            fi
            
            # Extract tags from current page (handle null safely)
            PAGE_TAGS=$(echo "$PAGE_RESPONSE" | jq -r '.results[]?.name // empty' 2>/dev/null || echo "")
            
            # If no tags returned, we've reached the end
            if [[ -z "$PAGE_TAGS" ]]; then
              echo "No more tags found on page $PAGE."
              break
            fi
            
            # Add tags from this page to our list
            ALL_TAGS="$ALL_TAGS $PAGE_TAGS"
            PAGE=$((PAGE + 1))
          done
          
          TOTAL_TAGS=$(echo "$ALL_TAGS" | wc -w)
          echo "Found $TOTAL_TAGS total tags"
          
          # Save to file instead of using GITHUB_OUTPUT for complex data
          echo "$ALL_TAGS" > all_tags.txt
          echo "total_tags=$TOTAL_TAGS" >> $GITHUB_OUTPUT

      - name: Find Old Images for Deletion
        id: old_images
        run: |
          echo "Finding images older than ${{ inputs.days_old }} days..."
          
          REGISTRY="$(yq e '.app.image.registry' helm/app/values.yaml)/$(yq e '.app.image.repository' helm/app/values.yaml)"
          TOKEN="${{ steps.auth.outputs.token }}"
          ALL_TAGS=$(cat all_tags.txt)
          PROTECTED_IMAGES=$(cat protected_images.txt)
          DAYS_OLD="${{ inputs.days_old }}"
          
          # Use GNU date syntax for Ubuntu
          CUTOFF_DATE=$(date -d "$DAYS_OLD days ago" +%Y-%m-%dT%H:%M:%S)
          echo "Cutoff date: $CUTOFF_DATE"
          
          OLD_IMAGES=""
          
          for tag in $ALL_TAGS; do
            # Skip latest tag
            if [[ "$tag" == "latest" ]]; then
              continue
            fi
            
            # Skip protected images (currently used by services)
            if [[ " $PROTECTED_IMAGES " == *" $tag "* ]]; then
              echo "Skipping protected image: $tag (currently in use)"
              continue
            fi
            
            # Get tag details
            TAG_INFO=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REGISTRY/tags/$tag/")
            
            CREATED=$(echo "$TAG_INFO" | jq -r '.tag_last_pushed // empty')
            
            if [[ "$CREATED" < "$CUTOFF_DATE" ]] && [[ -n "$CREATED" ]]; then
              echo "Found old image: $REGISTRY:$tag (created: $CREATED)"
              OLD_IMAGES="$OLD_IMAGES $tag"
            fi
          done
          
          OLD_COUNT=$(echo "$OLD_IMAGES" | wc -w)
          echo "Found $OLD_COUNT old images for deletion"
          
          # Save to file instead of using GITHUB_OUTPUT for complex data
          echo "$OLD_IMAGES" > old_images.txt
          echo "old_count=$OLD_COUNT" >> $GITHUB_OUTPUT

      - name: Show Images to be Deleted
        run: |
          OLD_IMAGES=$(cat old_images.txt)
          OLD_COUNT="${{ steps.old_images.outputs.old_count }}"
          
          if [[ -n "$OLD_IMAGES" ]]; then
            echo "Images that would be deleted ($OLD_COUNT total):"
            for tag in $OLD_IMAGES; do
              echo "  - botriack/telark:$tag"
            done
          else
            echo "No old images found to delete."
          fi

      - name: Delete Old Images
        if: ${{ !inputs.dry_run && steps.old_images.outputs.old_count != '0' }}
        run: |
          echo "Deleting old images..."
          
          REGISTRY="$(yq e '.app.image.registry' helm/app/values.yaml)/$(yq e '.app.image.repository' helm/app/values.yaml)"
          TOKEN="${{ steps.auth.outputs.token }}"
          OLD_IMAGES=$(cat old_images.txt)
          
          for tag in $OLD_IMAGES; do
            echo "Deleting: $REGISTRY:$tag"
            curl -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REGISTRY/tags/$tag/"
          done
          echo "Cleanup completed."

      - name: Dry Run Summary
        if: ${{ inputs.dry_run }}
        run: |
          OLD_COUNT="${{ steps.old_images.outputs.old_count }}"
          
          if [[ "$OLD_COUNT" != "0" ]]; then
            echo "DRY RUN MODE: No images were actually deleted."
            echo "To actually delete these images, run this workflow with dry_run=false"
          else
            echo "DRY RUN MODE: No images found to delete."
          fi 