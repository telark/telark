name: 'UI Gate'
description: 'Type-check, lint and build a dashboard-ui checkout. Shared by build-ui.yaml and the dashboard-ui CI.'
inputs:
  working-directory:
    description: 'Path of the dashboard-ui checkout'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    # Node 26 = the version the UI Dockerfile builds with.
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --ignore-scripts

    - name: Type-check, lint and build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run check-all-and-build
