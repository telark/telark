name: 'Go CI'
description: 'Set up Go, restore the build + module cache, authenticate private telark modules, then build (and optionally test + lint).'
inputs:
  working-directory:
    description: 'Directory holding the Go module (contains go.mod)'
    required: true
  cache-key:
    description: 'Unique cache-key component, e.g. the service or package name'
    required: true
  access-user:
    description: 'GitHub user for private module access'
    required: true
  access-token:
    description: 'GitHub token for private module access'
    required: true
  test:
    description: 'Run go test -race'
    required: false
    default: 'true'
  lint:
    description: 'Run golangci-lint'
    required: false
    default: 'true'
  coverage-threshold:
    description: 'Minimum total coverage percent; the build fails below it (0 = no gate)'
    required: false
    default: '0'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod
        # Explicit cache below (with restore-keys) instead of setup-go's
        # exact-match cache, so a changed go.sum still reuses the prior build.
        cache: false

    - name: Cache Go build and module cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ inputs.cache-key }}-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-go-${{ inputs.cache-key }}-

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go build ./...

    - name: Test
      if: ${{ inputs.test == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # -coverpkg=./... so tests in internal/tests/* count against the code they
      # exercise (per-package coverage reports 0 for this layout).
      run: |
        go test -race -coverpkg=./... -coverprofile=coverage.out ./...
        total=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
        echo "Total coverage: ${total}%"
        awk -v t="$total" -v m='${{ inputs.coverage-threshold }}' \
          'BEGIN { if (t+0 < m+0) { printf "coverage %.1f%% is below threshold %s%%\n", t, m; exit 1 } }'

    - name: Lint
      if: ${{ inputs.lint == 'true' }}
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: latest
        working-directory: ${{ inputs.working-directory }}
        args: --config=${{ github.workspace }}/.golangci.yml
