# Install mode: performance — selected with --set app.mode=performance
#
# Large cluster, high change rate. Three replicas per service, disruption budgets
# that keep a quorum up through a drain, and client rate limits raised so the
# services are not the bottleneck when thousands of resources move at once.
#
# Costs roughly an order of magnitude more than minimal to run — pick it when the
# cluster is genuinely large, not to be safe. Sizes telark's own services only;
# subcharts (redis, nats, kyverno) ship fixed production-grade defaults, owned by
# the chart and identical in every mode.
# Capacity only — app.crdGuard (security posture) is an independent flag.

app:
  serviceDefaults:
    replicas: 3
  persistence:
    size: 50Gi
    # The exporter is the only stateful service and everything depends on it, so
    # this mode refuses to run it on a volume one node can hold. It needs a
    # ReadWriteMany class, which is environment-specific — pass it at install:
    #   --set app.persistence.storageClass=<rwx-class>  (an EFS class on EKS).
    # The storage guard fails the install rather than silently dropping to one replica.
    accessMode: ReadWriteMany
  shared:
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"

services:
  exporter:
    # Safe above one replica only because snapshot writes go to a uniquely named
    # temp file and are renamed into place, so concurrent writers cannot publish
    # a partial file. Requires the ReadWriteMany volume declared above, which the
    # storage guard enforces. Rolling update is safe on RWX (no volume handover).
    replicas: 3
    strategy: RollingUpdate
    env:
      EXPORTER_K8S_CLIENT_QPS: "200"
      EXPORTER_K8S_CLIENT_BURST: "400"
    pdb:
      enabled: true
      minAvailable: 2
    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  discovery:
    replicas: 3
    env:
      DISCOVERY_K8S_CLIENT_QPS: "300"
      DISCOVERY_K8S_CLIENT_BURST: "600"
      FORCE_SYNC_WORKERS: "8"
    pdb:
      enabled: true
      minAvailable: 2
  enrichment:
    env:
      NUM_WORKERS: "6"
    pdb:
      enabled: true
      minAvailable: 2
  notifier:
    pdb:
      enabled: true
      minAvailable: 2
  auth:
    env:
      CLEANUP_WORKERS_PER_TYPE: "4"
    pdb:
      enabled: true
      minAvailable: 2
