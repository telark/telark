{{/* Target URLs and signing secrets are credentials: a Secret the notifier mounts and re-reads.
Cluster-less renders (GitOps) point app.webhooks.existingSecret at their own (key targets.json). */}}
{{- if and $.Values.services.notifier.enabled (not $.Values.app.webhooks.existingSecret) }}
{{- $names := list -}}
{{- range $.Values.app.webhooks.targets -}}
{{- if has .name $names -}}
{{- fail (printf "app.webhooks.targets: the name %q is used twice" .name) -}}
{{- end -}}
{{- $names = append $names .name -}}
{{- /* The notifier's rule for host names (internal/webhooks/targets.go), which refuses the whole file. */ -}}
{{- $host := (urlParse .url).hostname | lower | trimSuffix "." -}}
{{- $local := or (eq $host "localhost") (not (contains "." $host)) (hasSuffix ".svc" $host) (hasSuffix ".cluster.local" $host) -}}
{{- if and $local (not .allowPrivate) (not (regexMatch "^[0-9.]+$|:" $host)) -}}
{{- fail (printf "app.webhooks.targets: %q names a local or cluster host, which needs allowPrivate" .name) -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telark.webhooksSecretName" $ }}
  namespace: {{ $.Values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: webhooks
type: Opaque
data:
  targets.json: {{ $.Values.app.webhooks.targets | toJson | b64enc | quote }}
{{- end }}
