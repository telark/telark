# Install mode performance (--set app.mode=performance), for large clusters with a high change
# rate: three replicas per service, disruption budgets that keep a quorum through a drain, and
# client rate limits raised so the services keep up when thousands of resources move at once.
# Costs about ten times minimal: pick it for a genuinely large cluster, not to be safe. Sizes
# telark's own services only (redis, nats and kyverno keep the chart's production defaults in every
# mode) and says nothing about security (app.security.crdGuard is separate).

app:
  serviceDefaults:
    replicas: 1
    # Every service starts at one replica; the HPA ceiling is raised fleet-wide
    # (exporter never scales).
    autoscaling:
      minReplicas: 1
      maxReplicas: 5
  persistence:
    snapshotsSize: 2Gi
    reportsSize: 2Gi
  shared:
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"

services:
  exporter:
    env:
      EXPORTER_K8S_CLIENT_QPS: "200"
      EXPORTER_K8S_CLIENT_BURST: "400"
      SNAPSHOT_GC_INTERVAL_SEC: "900"
    pdb:
      enabled: true
      minAvailable: 1
  discovery:
    env:
      DISCOVERY_K8S_CLIENT_QPS: "300"
      DISCOVERY_K8S_CLIENT_BURST: "600"
      FORCE_SYNC_WORKERS: "12"
      # Each stream worker holds a pooled connection in a blocking read: keep the pool above them.
      REDIS_POOL_SIZE: "24"
      DISCOVERY_AUTO_CLEANUP_CYCLE_INTERVAL_SEC: "120"
    # maxUnavailable, not minAvailable: a drain takes one pod at a time, even at one replica.
    pdb:
      enabled: true
      maxUnavailable: 1
  analyzer:
    env:
      ANALYZER_REVIEW_APPS_PER_MIN: "60"
    pdb:
      enabled: true
      maxUnavailable: 1
  notifier:
    env:
      NOTIFIER_APPLY_WORKERS: "32"
    pdb:
      enabled: true
      maxUnavailable: 1
  auth:
    env:
      CLEANUP_WORKERS_PER_TYPE: "4"
      REDIS_POOL_SIZE: "24"
    pdb:
      enabled: true
      maxUnavailable: 1
