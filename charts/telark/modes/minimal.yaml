# Install mode minimal (--set app.mode=minimal), the smallest footprint: one replica per service,
# no disruption budgets, small resources that fit one dev node. For development, demos and
# evaluation: a lost node takes the service down. Sizes telark's own services only (redis, nats and
# kyverno are the same in every mode) and says nothing about security (app.security.crdGuard is separate).
# As applications grow, discovery outgrows 256Mi and the exporter's 20 QPS limit throttles bulk
# deletes, so use standard.

app:
  serviceDefaults:
    replicas: 1
    autoscaling:
      enabled: false
  shared:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

services:
  exporter:
    replicas: 1
    env:
      EXPORTER_K8S_CLIENT_QPS: "20"
      EXPORTER_K8S_CLIENT_BURST: "40"
      SNAPSHOT_GC_INTERVAL_SEC: "7200"
    pdb:
      enabled: false
  discovery:
    replicas: 1
    env:
      DISCOVERY_K8S_CLIENT_QPS: "50"
      DISCOVERY_K8S_CLIENT_BURST: "100"
      FORCE_SYNC_WORKERS: "2"
      PROTECTION_PLAN_REPORT_MAX_VIOLATIONS: "2000"
      PROTECTION_PLAN_REPORT_CHECKPOINT_SEC: "1800"
    pdb:
      enabled: false
  analyzer:
    env:
      ANALYZER_REVIEW_APPS_PER_MIN: "10"
    pdb:
      enabled: false
  notifier:
    env:
      NOTIFIER_APPLY_WORKERS: "2"
    pdb:
      enabled: false
  auth:
    env:
      CLEANUP_WORKERS_PER_TYPE: "1"
    pdb:
      enabled: false
