apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: protectionplans.{{ include "telark.apiGroup" $ }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: {{ include "telark.apiGroup" $ }}
  names:
    kind: ProtectionPlan
    plural: protectionplans
    singular: protectionplan
    shortNames:
      - tplan
    categories:
      - telark
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Approval
          type: string
          jsonPath: .status.approval.state
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Scope
          type: string
          jsonPath: .spec.scope.type
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Created
          type: string
          jsonPath: .spec.createdAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - severity
                - priority
                - scope
                - policies
                - mode
                - timeMode
                - createdAt
                - createdBy
                - lastUpdatedAt
                - lastUpdatedBy
                - participantRefs
              properties:
                name:
                  type: string
                  description: Human-readable name for the protection plan
                  minLength: 1
                  maxLength: 64
                description:
                  type: string
                  description: Optional description of the protection plan's purpose
                  maxLength: 512
                  nullable: true
                severity:
                  type: string
                  description: Severity level of the protection plan
                  enum: [low, medium, high, critical]
                priority:
                  type: integer
                  description: Execution priority (-100 to 100, higher wins)
                  minimum: -100
                  maximum: 100
                  default: 0
                scope:
                  type: object
                  description: Target scope for the protection plan
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      description: Scope type — applications or namespaces
                      enum: [applications, namespaces]
                    applicationRefs:
                      type: array
                      description: Application names targeted when type=applications
                      items:
                        type: string
                      nullable: true
                    namespaces:
                      type: array
                      description: Namespace names targeted when type=namespaces
                      items:
                        type: string
                      nullable: true
                    exclusions:
                      type: object
                      nullable: true
                      description: Kinds (any scope) and named resources (applications scope only) this plan never enforces on
                      properties:
                        kinds:
                          type: array
                          maxItems: 50
                          nullable: true
                          items:
                            type: string
                            minLength: 1
                            maxLength: 63
                        resources:
                          type: array
                          maxItems: 200
                          nullable: true
                          items:
                            type: object
                            required: [kind, name, namespace]
                            properties:
                              kind: {type: string, minLength: 1, maxLength: 63}
                              name: {type: string, minLength: 1, maxLength: 253}
                              namespace: {type: string, minLength: 1, maxLength: 63}
                  x-kubernetes-validations:
                    - rule: >
                        self.type == 'applications'
                          ? (has(self.applicationRefs) && size(self.applicationRefs) > 0 && (!has(self.namespaces) || size(self.namespaces) == 0))
                          : (has(self.namespaces) && size(self.namespaces) > 0 && (!has(self.applicationRefs) || size(self.applicationRefs) == 0))
                      message: "scope.type=applications requires non-empty applicationRefs and no namespaces; scope.type=namespaces requires non-empty namespaces and no applicationRefs"
                    - rule: "self.type == 'applications' || !has(self.exclusions) || !has(self.exclusions.resources) || size(self.exclusions.resources) == 0"
                      message: "scope.exclusions.resources is only allowed when scope.type=applications"
                policies:
                  type: array
                  description: Ordered list of policy templates applied by this plan
                  items:
                    type: object
                    required:
                      - templateID
                    properties:
                      templateID:
                        type: string
                        description: ID of the policy template to apply
                      params:
                        type: object
                        description: Template-specific parameters (validated server-side)
                        x-kubernetes-preserve-unknown-fields: true
                        nullable: true
                mode:
                  type: string
                  description: Enforcement mode for all rendered policies
                  enum: [audit, enforce]
                timeMode:
                  type: string
                  description: Whether the plan is permanent or time-bounded
                  enum: [permanent, time_range]
                timeRange:
                  type: object
                  description: Active window when timeMode=time_range
                  nullable: true
                  properties:
                    startAt:
                      type: string
                      description: RFC3339 timestamp when the plan becomes active
                      format: date-time
                    endAt:
                      type: string
                      description: RFC3339 timestamp when the plan terminates
                      format: date-time
                createdAt:
                  type: string
                  description: RFC3339 timestamp when the plan was created
                  format: date-time
                createdBy:
                  type: string
                  description: ID of the user who created the plan
                lastUpdatedAt:
                  type: string
                  description: RFC3339 timestamp of the most recent update
                  format: date-time
                lastUpdatedBy:
                  type: string
                  description: ID of the user who last updated the plan
                participantRefs:
                  type: array
                  description: User IDs of participants associated with this plan
                  items:
                    type: string
                environmentRef:
                  type: string
                  description: "Optional environment category id (scope plan-environments); metadata only, never affects enforcement. Empty string clears it."
                  maxLength: 19
                tagRefs:
                  type: array
                  description: "Optional tag category ids (scope plan-tags); metadata only."
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 19
                approvalMode:
                  type: string
                  description: Whether the plan deploys without approval; absent means automatic
                  enum: [automatic, required]
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current lifecycle phase of the plan
                  enum: [draft, scheduled, active, terminated, canceled, failed, pending_approval]
                reason:
                  type: string
                  description: Human-readable explanation for the current phase (failures or cancellations)
                  nullable: true
                conditions:
                  {{- include "conditionsSchema" . | nindent 18 }}
                observedGeneration:
                  type: integer
                  format: int64
                  description: metadata.generation of the spec this status reflects
                renderedPolicies:
                  type: array
                  description: Names of Kyverno Policy resources deployed by this plan
                  items:
                    type: string
                  nullable: true
                health:
                  type: string
                  description: Health/drift status of the plan's deployed Kyverno policies
                  enum: [unknown, healthy, drifted, degraded]
                  default: unknown
                healthCheckedAt:
                  type: string
                  description: RFC3339 timestamp of the last health reconciliation
                  format: date-time
                  nullable: true
                healthDetail:
                  type: array
                  description: Per-policy presence and readiness breakdown from the last health check
                  nullable: true
                  items:
                    type: object
                    properties:
                      policyName:
                        type: string
                      namespace:
                        type: string
                      present:
                        type: boolean
                      ready:
                        type: boolean
                      failureAction:
                        type: string
                startedAt:
                  type: string
                  description: RFC3339 timestamp when the plan became active
                  format: date-time
                  nullable: true
                startedBy:
                  type: string
                  description: ID of the user or system that activated the plan
                  nullable: true
                terminatedAt:
                  type: string
                  description: RFC3339 timestamp when the plan was terminated or cancelled
                  format: date-time
                  nullable: true
                terminatedBy:
                  type: string
                  description: ID of the user or system that terminated the plan
                  nullable: true
                approval:
                  type: object
                  nullable: true
                  required:
                    - state
                    - requestedBy
                    - requestedAt
                  properties:
                    state:
                      type: string
                      enum: [pending, approved, rejected]
                    requestedBy:
                      type: string
                      maxLength: 64
                    requestedAt:
                      type: string
                      format: date-time
                    decidedBy:
                      type: string
                      maxLength: 64
                      nullable: true
                    decidedAt:
                      type: string
                      format: date-time
                      nullable: true
                    comment:
                      type: string
                      maxLength: 500
                      nullable: true
                    history:
                      type: array
                      maxItems: 20
                      items:
                        type: object
                        required:
                          - event
                          - by
                          - at
                        properties:
                          event:
                            type: string
                            enum: [requested, approved, rejected]
                          by:
                            type: string
                            maxLength: 64
                          at:
                            type: string
                            format: date-time
                          comment:
                            type: string
                            maxLength: 500
