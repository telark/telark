version: 2
linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - gocyclo
    - misspell
    - unparam
    - nakedret
    - perfsprint
    - prealloc
    - nolintlint
    - funlen
    - dupl
    - bodyclose
    - containedctx
    - goprintffuncname
    - whitespace
    - unconvert
    - revive
  settings:
    gocyclo:
      min-complexity: 12
    misspell:
      locale: US
      exclude:
    funlen:
      lines: 60
      statements: 
    gosec:
      exclude:
        - G101
    revive:
      enable-all-rules: true
      rules:
        - name: line-length-limit
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        #- name: line-length-limit
        #  arguments:
        #    - 100
        - name: max-public-structs
          arguments:
            - 10
run:
  timeout: 2m
  tests: false

issues:
  max-issues-per-linter: 0