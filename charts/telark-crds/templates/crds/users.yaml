apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.{{ include "telark.apiGroup" $ }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: {{ include "telark.apiGroup" $ }}
  names:
    kind: User
    plural: users
    singular: user
    shortNames:
      - tuser
    categories:
      - telark
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - username
                - fullname
                - email
                - creationDate
                - status
              properties:
                username:
                  type: string
                  description: Unique username used for login
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_-]+$'
                fullname:
                  type: string
                  description: Display name of the user
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  description: User's email address
                  format: email
                roleRefs:
                  type: array
                  items:
                    type: string
                groupRefs:
                  type: array
                  items:
                    type: string
                bootstrap:
                  type: boolean
                  description: Chart-managed bootstrap administrator; set by services only
                identities:
                  type: array
                  description: External identity provider links
                  items:
                    type: object
                    properties:
                      provider:
                        type: string
                        description: Identity provider name (e.g. google)
                      issuer:
                        type: string
                        description: Token issuer URL
                      subject:
                        type: string
                        description: Unique subject identifier from provider
                avatar:
                  type: object
                  description: Avatar configuration for DiceBear
                  properties:
                    style:
                      type: string
                      description: DiceBear avatar style name
                    seed:
                      type: string
                      description: Avatar seed for generation
                settings:
                  type: object
                  description: Per-user display preferences. Timestamps stay stored in UTC; these only affect rendering.
                  properties:
                    timezone:
                      type: string
                      description: IANA time zone name used to render timestamps (e.g. Europe/Paris)
                      maxLength: 64
                      pattern: '^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+){0,2}$'
                    region:
                      type: string
                      description: ISO 3166-1 alpha-2 country code (e.g. FR)
                      pattern: '^[A-Z]{2}$'
                    theme:
                      type: string
                      description: UI theme preference
                      maxLength: 32
                status:
                  type: object
                  description: User status information
                  required:
                    - phase
                  properties:
                    phase:
                      type: string
                      description: Current phase of the user account
                      enum:
                        - active
                        - inactive
                        - suspended
                    lastLoginAt:
                      type: string
                      description: ISO 8601 timestamp of last login (optional)
                      format: date-time
                {{- include "dateFieldsSchema" . | nindent 16 }}

