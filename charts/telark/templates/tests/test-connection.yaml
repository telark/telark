{{- $svc := .Values.services.auth -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "telark.fullname" . }}-test-connection
  namespace: {{ .Values.app.namespace }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: readiness
      image: busybox:1.37
      command:
        - wget
        - -S
        - --spider
        - --timeout=10
        - http://{{ include "telark.fullname" . }}-{{ $svc.name }}:{{ .Values.app.serviceDefaults.port }}{{ .Values.app.shared.healthCheck.readinessProbe.path }}
