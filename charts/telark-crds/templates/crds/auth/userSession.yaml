apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usersessions.auth.{{ $.Values.app.name }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: auth.{{ $.Values.app.name }}
  names:
    kind: UserSession
    plural: usersessions
    singular: usersession
    shortNames:
      - session
      - sess
      - us
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          # The name is the token digest the services look sessions up by.
          x-kubernetes-validations:
            - rule: self.metadata.name.matches('^session-[0-9a-f]{64}$')
              message: name must be session-<sha256 hex of the token>
          properties:
            spec:
              type: object
              required:
                - userId
                - createdTimestamp
                - expiresTimestamp
              properties:
                userId:
                  type: string
                  description: User ID associated with this session
                createdTimestamp:
                  type: string
                  format: date-time
                  description: Timestamp when the session was created
                expiresTimestamp:
                  type: string
                  format: date-time
                  description: Timestamp when the session expires
                ipAddress:
                  type: string
                  description: IP address from which the session was created (optional)
                deviceMetadata:
                  type: object
                  description: Optional browser/device context provided by the UI
                  properties:
                    browser:
                      type: string
                    device:
                      type: string
                    os:
                      type: string
                    location:
                      type: string
                    userAgent:
                      type: string

