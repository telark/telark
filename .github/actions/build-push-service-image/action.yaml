name: 'Build and Push Service Image'
description: 'Build and push Docker image for a service with optimized caching'
inputs:
  service_name:
    description: 'Name of the service'
    required: true
  service_path:
    description: 'Path to the service directory'
    required: true
    default: 'service'
  image_tag:
    description: 'Tag for the Docker image'
    required: true
  container_registry_name:
    description: 'Container registry and namespace (e.g. ghcr.io/telark)'
    required: true
    default: 'ghcr.io/telark'
  container_registry_repo_name:
    description: 'Per-service image repository name (e.g. exporter)'
    required: true
  dockerfile_path:
    description: 'Path to the Dockerfile'
    required: false
    default: './service/Dockerfile'
  platforms:
    description: 'Target platforms for the build'
    required: false
    default: 'linux/amd64'
  build_args:
    description: 'Additional build arguments (JSON format)'
    required: false
    default: '{}'
  cache_enabled:
    description: 'Enable Docker layer caching'
    required: false
    default: 'true'
  push_enabled:
    description: 'Enable pushing to registry'
    required: false
    default: 'true'
  setup_qemu:
    description: 'Register QEMU binfmt handlers. Only needed when a build stage executes foreign-arch binaries (e.g. pip install); Go images cross-compile instead.'
    required: false
    default: 'true'

outputs:
  image_name:
    description: 'Full image name with tag'
    value: ${{ steps.build_image.outputs.image_name }}
  image_digest:
    description: 'Image digest'
    value: ${{ steps.build_image.outputs.image_digest }}
  build_time:
    description: 'Build time in seconds'
    value: ${{ steps.build_image.outputs.build_time }}

runs:
  using: 'composite'
  steps:
    - name: Set up QEMU
      if: ${{ inputs.setup_qemu == 'true' }}
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0, cross-arch emulation for linux/arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: |
          image=moby/buildkit:buildx-stable-1
          network=host

    # Exposes ACTIONS_RUNTIME_TOKEN / cache URLs so a manual `docker buildx build`
    # can use the GitHub Actions cache backend (type=gha).
    - name: Expose GitHub Actions runtime
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

    # Inputs reach the script through env, never string interpolation, so a
    # value carrying shell syntax cannot escape into the build command.
    - name: Build and Push Service Image
      id: build_image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service_name }}
        SERVICE_PATH: ${{ inputs.service_path }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        CONTAINER_REGISTRY_NAME: ${{ inputs.container_registry_name }}
        CONTAINER_REGISTRY_REPO_NAME: ${{ inputs.container_registry_repo_name }}
        DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        PLATFORMS: ${{ inputs.platforms }}
        BUILD_ARGS: ${{ inputs.build_args }}
        CACHE_ENABLED: ${{ inputs.cache_enabled }}
        PUSH_ENABLED: ${{ inputs.push_enabled }}
        # .github/actions/<name> -> up two -> .github -> scripts. Anchored on
        # action_path, not the workspace, so it resolves under any checkout path.
        SCRIPT_DIR: ${{ github.action_path }}/../../scripts
      run: bash "$SCRIPT_DIR/build-push-service-image.sh"

    # No disk cleanup before the build: the runner has ~80G free. This shows
    # what the build used, so a smaller runner disk is caught early.
    - name: Report disk usage
      if: ${{ always() }}
      shell: bash
      run: df -h /
