# telark — Helm chart values. Full per-key reference: ./README.md
#
# Layout:  app.*            app-wide config (identity, images, auth, storage,
#                           shared pod fragments).
#          services.<svc>   per-workload blocks; inherit app.serviceDefaults and
#                           opt into shared fragments via gates.
#          Subcharts        bottom of this file. Service sizing: app.mode.
#
# Conventions: keys camelCase; container env keys SCREAMING_SNAKE_CASE.
# Gates (per service, defaults): includeResources / includeHealthCheck /
#   includeSecurity / useRedis = true, useNatsCreds = false.
# storageClass: "" = cluster default · "-" = disable provisioning · "<name>" = that class.

# global: propagated to subcharts.
global:
  imagePullSecrets: []

# app.name is the source of truth for the app identity. These override the name
# used for rendered resources without touching app.name.
nameOverride: ""
fullnameOverride: ""

# Added to the metadata of every rendered resource.
commonLabels: {}
commonAnnotations: {}

# CRDs ship with the chart (telark-crds subchart) — one install covers everything.
# Disable for out-of-band/GitOps management; every CRD carries resource-policy:keep.
crds:
  enabled: true

# Prometheus-Operator ServiceMonitor for each service's /metrics. Off by default
# (needs the Operator CRDs). labels must match your Prometheus serviceMonitorSelector.
monitoring:
  serviceMonitor:
    enabled: false
    path: /metrics
    interval: 30s
    labels: {}

# Ingress for the dashboard (the ui service). Off by default — else reach it via
# kubectl port-forward. Set className + host for your controller; add tls for HTTPS.
ingress:
  enabled: false
  className: ""            # e.g. nginx
  host: ""                 # e.g. telark.example.com ("" = match any host)
  service: ui              # services.<key> to route to (the dashboard)
  path: /
  pathType: Prefix
  annotations: {}
  tls: []                  # [{ secretName: telark-tls, hosts: [telark.example.com] }]

# Gateway API alternative to the Ingress: an HTTPRoute for the dashboard attached to a
# Gateway you already run. Needs Gateway API v1 CRDs + a controller implementing HTTPRoute.
gateway:
  enabled: false
  parentRefs: []           # [{ name: <gateway>, namespace: <ns>, sectionName: <listener> }]
  hostnames: []            # e.g. [telark.example.com] ([] = any host)
  service: ui              # services.<key> to route to (the dashboard)
  annotations: {}

app:
  # Identity — app.name is the source of truth for every resource name.
  name: "telark"
  namespace: "telark"

  # Install mode: sizes every telark service (replicas, resources, rate limits,
  # disruption budgets) from one flag. minimal = dev/demo, a few hundred apps ·
  # standard = the values below, verified at 2 000 apps (2026-09-18 stress run)
  # · performance = beyond that. Override: --set app.mode=performance.
  # Subcharts don't follow this flag (Helm resolves their values before it) — they
  # ship production-grade defaults for every mode. See the Subcharts section.
  mode: standard

  # One-node cluster: the exporter runs a single replica on a ReadWriteOnce
  # volume instead of two on ReadWriteMany (no RWX storage class needed).
  singleNode: false

  # Container images. Full ref per service: <registry>/<service.repository>:<service.version>.
  image:
    # Docker Hub namespace (account/org) that hosts the per-service repos.
    registry: "telark"
    pullPolicy: "Always"        # re-build-current re-pulls the same tag, so never IfNotPresent
    # Public images pull anonymously. Add pull secrets here (or via
    # global.imagePullSecrets) only for a private registry/mirror.
    pullSecrets: []

  # Auth service — WebAuthn relying-party identity + bootstrap admins.
  # Set bootstrap.admins to your admin email(s): with it empty and selfRegistration
  # "false" nobody could ever log in, so the render fails.
  auth:
    bootstrap:
      admins: []
    passkey:
      id: ""  # required with ingress/gateway; empty follows the request host
      name: "Dashboard App"
      origin: ""  # required with ingress/gateway; empty follows the request Origin
      selfRegistration: "false"  # gates passkey registration only; OIDC users unaffected

  # Optional subcharts. Their config lives in the Subcharts section below.
  kyverno:
    enabled: true
    # true: admission never blocks while Kyverno is down, so enforce plans are best-effort.
    # Must equal kyverno.features.forceFailurePolicyIgnore.enabled (the render checks).
    failOpen: true
  # Local model runtime for the analyzer; autoPull=false for air-gapped, see README.
  ollama:
    enabled: true
    autoPull: true
    # Ollama-API endpoint you run yourself (connected mode, no key); empty = the subchart.
    runtimeUrl: ""

  # Storage for the exporter PVCs (snapshots, reports).
  # storageClass: "" = cluster default · "-" = disable provisioning · "<name>" = that class.
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
    reportsSize: 2Gi

  # Shared secret services present to each other. Empty = generated on install and
  # read back on upgrade. GitOps (cluster-less renders): set existingSecret (key: token).
  serviceToken:
    envVar: "TELARK_SERVICE_TOKEN"
    value: ""
    existingSecret: ""

  # Admission-side guard: only owning service accounts may write Telark CRs.
  # The CRs are the authorization data, so this is the boundary, not an option.
  crdGuard:
    enabled: true
    enforce: true
    extraAllowedUsers: []       # break-glass usernames; owning SAs always allowed

  # Ingress NetworkPolicies for the telark pods and NATS (needs an enforcing CNI).
  networkPolicy:
    enabled: true

  # Per-service defaults. Override any key on a services.<svc> block.
  serviceDefaults:
    port: 8080
    serviceType: ClusterIP
    replicas: 1
    terminationGracePeriodSec: 60
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # Every service starts at one replica and scales horizontally on CPU (HPA,
    # autoscaling/v2) — never the exporter (replicas fixed by the mode). minimal turns
    # this off; performance raises the ceiling. Vertical scaling: see vpa below.
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    # VerticalPodAutoscaler per service, rendered only when vpa.enabled installed
    # the operator (its CRD must exist, so it appears on the upgrade after the
    # install). Auto resizes requests/limits in place of the shared defaults.
    vpa:
      updateMode: Auto

  # Shared pod fragments, applied per service via gates:
  # includeResources · includeHealthCheck · includeSecurity · useRedis · useNatsCreds.
  shared:
    redis:
      REDIS_HOST: "{{ .Release.Name }}-redis-master"   # redis subchart master service
      REDIS_PORT: "6379"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    healthCheck:
      port: http
      livenessProbe:
        path: /api/v1/status/live
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 15
        failureThreshold: 3
      readinessProbe:
        path: /api/v1/status/ready
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 15
        failureThreshold: 3
    podSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 1001
      runAsGroup: 1001
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    nats:
      NATS_HOST: "{{ .Release.Name }}-nats"   # nats subchart client service

# Per-service configuration. See README.md for the full env reference and gate semantics.
services:
  exporter:
    enabled: true
    name: "exporter-service"
    repository: "exporter"
    # @ignore
    version: 4.1.0
    category: "export"
    # Two replicas share the snapshot volume, so the chart derives the rest:
    # replicas > 1 → RollingUpdate + ReadWriteMany (needs app.persistence.storageClass
    # set to an RWX class); 1 replica (minimal, or app.singleNode=true) → Recreate +
    # ReadWriteOnce. Never autoscaled — the volume, not CPU, bounds it.
    replicas: 2
    autoscaling:
      enabled: false
    env:
      CORS_ALLOWED_ORIGINS: ""
      SNAPSHOTS_PATH: &snapshotsPath "/snapshots"
      REPORTS_PATH: &reportsPath "/reports"
      SNAPSHOTS_PVC_NAME: '{{ include "telark.exporterSnapshotsPvcName" . }}'
      SNAPSHOTS_PVC_NAMESPACE: '{{ .Values.app.namespace }}'
      EXPORTER_K8S_CLIENT_QPS: "50"
      EXPORTER_K8S_CLIENT_BURST: "100"
      # Orphan snapshot sweep: unreferenced files older than 1h on the PVC. 0 = off.
      SNAPSHOT_GC_INTERVAL_SEC: "3600"
      BOOTSTRAP_ADMINS: '{{ join "," .Values.app.auth.bootstrap.admins }}'
    volumes:
      - name: snapshots-storage
        persistentVolumeClaim:
          claimName: '{{ include "telark.exporterSnapshotsPvcName" . }}'
      - name: reports-storage
        persistentVolumeClaim:
          claimName: '{{ include "telark.exporterReportsPvcName" . }}'
    volumeMounts:
      - name: snapshots-storage
        path: *snapshotsPath
      - name: reports-storage
        path: *reportsPath
    pdb:
      enabled: false
  discovery:
    enabled: true
    name: "discovery-service"
    repository: "discovery"
    # @ignore
    version: 2.1.0
    category: "sync"
    useNatsCreds: true
    natsUser: publisher
    env:
      CORS_ALLOWED_ORIGINS: ""
      DISCOVERY_K8S_CLIENT_QPS: "100"
      DISCOVERY_K8S_CLIENT_BURST: "200"
      DISCOVERY_ROLLBACK_K8S_CLIENT_QPS: "100"
      DISCOVERY_ROLLBACK_K8S_CLIENT_BURST: "200"
      DISCOVERY_INFORMER_RESYNC_SEC: "600"
      DISCOVERY_ROLLBACK_INFORMER_RESYNC_SEC: "600"
      DISCOVERY_INFORMER_RESYNC_JITTER_FRACTION: "0.2"
      DISCOVERY_INFORMER_COALESCING_WINDOW_SEC: "5"
      DISCOVERY_INFORMER_COALESCING_MAX_WAIT_SEC: "10"
      DISCOVERY_COALESCE_BUFFER_MAX_ENTRIES: "500"
      DISCOVERY_SNAPSHOT_FETCH_TIMEOUT_MS: "5000"
      COORDINATION_BATCH_SIZE: "10"
      COORDINATION_BATCH_BLOCK_SEC: "2"
      COORDINATION_MAX_RETRY_ATTEMPTS: "5"
      COORDINATION_LOCK_TTL_SEC: "120"
      COORDINATION_LOCK_HEARTBEAT_SEC: "30"
      COORDINATION_ELECTION_TTL_SEC: "15"
      COORDINATION_ELECTION_RENEW_SEC: "5"
      COORDINATION_DEDUP_TTL_SEC: "60"
      COORDINATION_STALE_CLAIM_MIN_IDLE_SEC: "300"
      COORDINATION_STALE_CLAIM_INTERVAL_SEC: "60"
      COORDINATION_SHUTDOWN_CLEANUP_TIMEOUT_SEC: "45"
      REDIS_RETRY_INTERVAL_SEC: "5"
      REDIS_MAX_WAIT_SEC: "180"
      REDIS_PING_TIMEOUT_SEC: "2"
      SNAPSHOT_WRITE_MAX_ATTEMPTS: "5"
      SNAPSHOT_WRITE_RETRY_INTERVAL_SEC: "2"
      PROTECTION_PLAN_TICK_INTERVAL_SEC: "31"
      PROTECTION_PLAN_REPORT_MAX_VIOLATIONS: "5000"
      PROTECTION_PLAN_REPORT_CHECKPOINT_SEC: "900"
      FORCE_SYNC_WORKERS: "6"
      FORCE_SYNC_STREAM_MAX_LEN: "5000"
      FORCE_SYNC_DEDUP_TTL_SEC: "600"
      FORCE_SYNC_JOB_TIMEOUT_SEC: "300"
      FORCE_SYNC_MAINTENANCE_INTERVAL_SEC: "60"
      FORCE_SYNC_PEL_IDLE_RECLAIM_SEC: "60"
      FORCE_SYNC_ACK_RETENTION_SEC: "3600"
      REST_EXPORTER_DURATION_LOG_ENABLED: "true"
      DISCOVERY_AUTO_CLEANUP_ENABLED: "true"
      DISCOVERY_AUTO_CLEANUP_DELETE_ENABLED: "true"
      DISCOVERY_AUTO_CLEANUP_CYCLE_INTERVAL_SEC: "60"
      DISCOVERY_AUTO_CLEANUP_EMPTY_CYCLES_REQUIRED: "2"
      DISCOVERY_AUTO_CLEANUP_GRACE_PERIOD_SEC: "0"
      REST_EXPORTER_DURATION_LOG_DEDUP_SEC: "10"
      INSIGHTS_INDEX_REFRESH_SEC: "15"
      INSIGHTS_INDEX_RESYNC_SEC: "300"
      INSIGHTS_STALE_AFTER_SEC: "86400"
    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    # Disruption budgets stay off in standard: with one replica they only block
    # node drains. performance enables them once the floor is above one.
    pdb:
      enabled: false
  analyzer:
    enabled: true
    name: "analyzer-service"
    repository: "analyzer"
    # @ignore
    version: 0.1.5
    category: "ai-insights"
    # One analysis worker bound to one Ollama slot (OLLAMA_NUM_PARALLEL=1): a
    # second replica would only queue behind it. Never autoscaled.
    autoscaling:
      enabled: false
    env:
      REDIS_POOL_SIZE: "10"
      OLLAMA_HOST: '{{ default (printf "http://%s-ollama:11434" .Release.Name) .Values.app.ollama.runtimeUrl }}'
      OLLAMA_AUTO_PULL: '{{ .Values.app.ollama.autoPull }}'
      ANALYZER_MODE: "fast"
      # = ollama.resources.limits.cpu; never above the node's vCPU.
      ANALYZER_NUM_THREAD: "2"
      ANALYZER_NARRATE_TIMEOUT_SEC: "45"
      ANALYZER_MAX_STEPS: "8"
      ANALYZER_MAX_TOOL_CALLS: "8"
      ANALYZER_TOOL_RESULT_MAX_BYTES: "2048"
      ANALYZER_WALL_SEC: "480"
      ANALYZER_LOOP_TIMEOUT_SEC: "120"
      ANALYZER_EMIT_TIMEOUT_SEC: "180"
      ANALYZER_CHARS_PER_TOKEN: "3.5"
      ANALYZER_CONTEXT_TOKENS: "4096"  # deep: 8192
      ANALYZER_QUEUE_MAX: "100"
      ANALYZER_AUTO_COOLDOWN_SEC: "600"
      ANALYZER_MANUAL_COOLDOWN_SEC: "60"
      ANALYZER_CONFIG_POLL_SEC: "30"
      ANALYZER_REVIEW_INTERVAL_SEC: "7200"  # 0 = no review sweep
      ANALYZER_REVIEW_TICK_SEC: "120"
      ANALYZER_REVIEW_APPS_PER_MIN: "20"
      ANALYZER_REVIEW_WORKLOADS_MAX: "10"
      ANALYZER_USAGE_MIN_SAMPLES: "12"
      ANALYZER_USAGE_MIN_SPAN_SEC: "43200"
      ANALYZER_CHANGE_VELOCITY_PER_DAY: "20"
      ANALYZER_CHANGE_RISK_MIN_SPAN_SEC: "259200"
      # -- Namespaces or plan environments matching it count as production.
      # @default -- `(^\|[-_.])(prod\|production\|prd)($\|[-_.])`
      ANALYZER_PRODUCTION_PATTERN: '(^|[-_.])(prod|production|prd)($|[-_.])'
      # Comma-separated browser origins allowed by CORS; empty sends no CORS headers.
      CORS_ALLOWED_ORIGINS: ""
    pdb:
      enabled: false
  notifier:
    enabled: true
    name: "notifier-service"
    repository: "notifier"
    # @ignore
    version: 0.3.2
    category: "notification"
    terminationGracePeriodSec: 30
    useNatsCreds: true
    natsUser: consumer
    automountServiceAccountToken: false
    env:
      # Concurrent apply workers; one app always maps to the same worker (ordered).
      NOTIFIER_APPLY_WORKERS: "8"
    pdb:
      enabled: false
  auth:
    enabled: true
    name: "auth-service"
    repository: "auth"
    # @ignore
    version: 0.4.0
    category: "auth"
    terminationGracePeriodSec: 30
    automountServiceAccountToken: false
    env:
      CORS_ALLOWED_ORIGINS: ""
      REDIS_DB: "1"
      REDIS_RETRY_INTERVAL_SEC: "2"
      REDIS_MAX_WAIT_SEC: "30"
      REDIS_PING_TIMEOUT_SEC: "3"
      BOOTSTRAP_ADMINS: '{{ join "," .Values.app.auth.bootstrap.admins }}'
      SELF_REGISTRATION_ENABLED: '{{ .Values.app.auth.passkey.selfRegistration }}'
      RP_ID: '{{ .Values.app.auth.passkey.id }}'
      RP_NAME: '{{ .Values.app.auth.passkey.name }}'
      RP_ORIGIN: '{{ .Values.app.auth.passkey.origin }}'
      CHALLENGE_TIMEOUT: "60"
      SESSION_EXPIRY: "24"
      RECONCILE_TICK_SECONDS: "5"
      RECONCILE_PASS_DEADLINE_SECONDS: "30"
      CLEANUP_WORKERS_PER_TYPE: "2"
      CLEANUP_STREAM_MAXLEN: "10000"
      CLEANUP_LAG_ALERT_THRESHOLD: "500"
      CLEANUP_SWEEPER_INTERVAL_SECONDS: "60"
      CLEANUP_JOB_MAX_ATTEMPTS: "5"
      CLEANUP_DEDUP_TTL_SECONDS: "600"
      CLEANUP_XCLAIM_MIN_IDLE_SECONDS: "60"
      CLEANUP_LIST_TIMEOUT_SECONDS: "10"
      CLEANUP_PATCH_TIMEOUT_SECONDS: "5"
      CLEANUP_MAX_CONCURRENT_PATCHES: "4"
      RECONCILE_BACKOFF_INITIAL_SECONDS: "5"
      RECONCILE_BACKOFF_MAX_SECONDS: "300"
    pdb:
      enabled: false
  ui:
    enabled: true
    name: "ui-service"
    repository: "ui"
    # @ignore
    version: 1.0.0
    category: "ui"
    terminationGracePeriodSec: 30
    # Static assets behind nginx: it serves no /api/v1/status route, so probes
    # stay off. Resources still apply.
    includeHealthCheck: false
    # nginx runs as its own uid 101, not the shared 1001, so it gets its own contexts.
    includeSecurity: false
    useRedis: false
    automountServiceAccountToken: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: nginx-cache
        path: /var/cache/nginx
      - name: tmp
        path: /tmp
    # nodePort: 30080         # with serviceType: NodePort (unset = allocated by Kubernetes)

# ─── Subcharts ───────────────────────────────────────────────────────────────
# Helm resolves a subchart's values before templates run, so app.mode (a
# template-time input) cannot reach them. These ship production-grade defaults,
# owned by the chart and identical across every mode.

redis:
  architecture: standalone
  auth:
    enabled: false
  # Redis runs without auth, so the network is the only boundary: ingress is
  # restricted to pods carrying the <release>-redis-client label.
  networkPolicy:
    enabled: true
    allowExternal: false
  master:
    persistence:
      enabled: true
      size: 4Gi
    # Replaces the nano preset (same requests). Redis never evicts, so the limit must hold every
    # app's analyzer documents: about 210 MiB at 2 000 apps in the worst case.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 150m
        memory: 512Mi
        ephemeral-storage: 2Gi

nats:
  enabled: true
  # GitOps: Secrets you manage (keys username + password) instead of the generated ones.
  existingSecrets:
    publisher: ""
    consumer: ""
  image:
    registry: docker.io
    repository: nats
    tag: 2.12.15-scratch
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  # NATS server config, inlined so the chart installs with no --set-file. The
  # server env-expands each user from its Secret (see extraEnvVars): discovery
  # publishes, notifier consumes. Change the secret names below if you change app.name.
  # No http_port: the monitoring endpoint is unauthenticated, so probes use the client port.
  configuration: |
    server_name: nats-server
    port: 4222
    jetstream {
      store_dir: "/data"
      max_mem: 1G
      max_file: 5G
    }
    authorization {
      users = [
        {
          user: $NATS_PUBLISHER_USER,
          password: $NATS_PUBLISHER_PASSWORD,
          permissions: {
            publish   = ["telark.applications.*"]
            subscribe = ["_INBOX.>"]
          }
        },
        {
          user: $NATS_CONSUMER_USER,
          password: $NATS_CONSUMER_PASSWORD,
          permissions: {
            publish   = ["$JS.API.>", "$JS.ACK.>"]
            subscribe = ["telark.applications.*", "_INBOX.>"]
          }
        }
      ]
    }
  extraEnvVars:
    - name: NATS_PUBLISHER_USER
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.publisher | default "telark-nats-publisher-secret" }}'
          key: username
    - name: NATS_PUBLISHER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.publisher | default "telark-nats-publisher-secret" }}'
          key: password
    - name: NATS_CONSUMER_USER
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.consumer | default "telark-nats-consumer-secret" }}'
          key: username
    - name: NATS_CONSUMER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.existingSecrets.consumer | default "telark-nats-consumer-secret" }}'
          key: password
  customLivenessProbe:
    tcpSocket:
      port: client
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  customReadinessProbe:
    tcpSocket:
      port: client
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  # The chart's own policy admits any pod (allowExternal); telark renders a narrower one.
  networkPolicy:
    enabled: false
  persistence:
    enabled: true
    path: /data
    size: 4Gi
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

kyverno:
  namespaceOverride: "telark"
  # Set together with app.kyverno.failOpen: Helm cannot pass a parent value to a subchart.
  features:
    forceFailurePolicyIgnore:
      enabled: true
  webhooksCleanup:
    enabled: false
  admissionController:
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    container:
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          memory: 512Mi
      extraArgs:
        clientRateLimitQPS: 50
        clientRateLimitBurst: 100
    initContainer:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
  backgroundController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    extraArgs:
      clientRateLimitQPS: 50
      clientRateLimitBurst: 100
  cleanupController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    extraArgs:
      clientRateLimitQPS: 50
      clientRateLimitBurst: 100
  reportsController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    extraArgs:
      clientRateLimitQPS: 50
      clientRateLimitBurst: 100

# metrics-server: required by HPAs and `kubectl top`. Default on.
# Disable for clusters that already ship it (GKE, AKS, k3s, OpenShift):
#   kubectl get apiservice v1beta1.metrics.k8s.io
# If present, override: --set metrics-server.enabled=false
# Vertical Pod Autoscaler operator (recommender/updater/admission). Off by
# default; --set vpa.enabled=true for standard/performance — subcharts cannot
# follow app.mode. Needs metrics-server (bundled). Objects: app.serviceDefaults.vpa.
vpa:
  enabled: false

metrics-server:
  enabled: true
  # Add --kubelet-insecure-tls only for kind/minikube-style clusters whose kubelet
  # certificates are self-signed (see INSTALL).
  args:
    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 400Mi

# Analyzer model runtime (app.ollama.enabled). Nothing is pulled at start: the
# analyzer pulls the model chosen in Settings. Profiles, models, air-gapped: README.
ollama:
  ollama:
    models:
      # Stays empty: the subchart's start-up pull ignores autoPull and a failed pull crash-loops the pod.
      pull: []
  persistentVolume:
    enabled: true
    size: 10Gi               # 20Gi when trialing 8B models
    # Empty -> cluster default class. Override per env via --set or values overlay.
    storageClass: ""
    annotations:
      helm.sh/resource-policy: keep
  # CPU tiny profile (granite4:350m, 4k context: ~1.1Gi resident, idle CPU). One size for
  # every app.mode, which cannot reach a subchart: minimal fits one 2 vCPU / 8 GiB node. Others: README.
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    # No memory limit: Ollama's free-memory check counts page cache inside the
    # cgroup, so pulled blobs eventually fill any limit and loads are refused.
    limits:
      cpu: "2"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  extraEnv:
    - name: OLLAMA_NO_CLOUD
      value: "true"
    - name: OLLAMA_CONTEXT_LENGTH
      value: "4096"
    - name: OLLAMA_KEEP_ALIVE
      value: "-1"
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "1"
    - name: OLLAMA_MAX_QUEUE
      value: "8"
    - name: OLLAMA_FLASH_ATTENTION
      value: "1"
    - name: OLLAMA_KV_CACHE_TYPE
      value: "q8_0"
