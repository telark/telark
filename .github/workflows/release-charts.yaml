# Release: publish the telark and telark-crds charts to the OCI registry
# (oci://ghcr.io/<owner>/charts), each at the version in its OWN Chart.yaml, and
# cosign-sign every pushed chart. The two charts version independently — telark-crds
# bumps only when a CRD changes. A pushed `v*` tag publishes both; a manual run can
# target one. Already-published versions are skipped, so the job is idempotent and
# only ships a chart whose Chart.yaml version is new. On a manual bump the new
# version is committed back; the telark app chart is then tagged (v<version>) and a
# GitHub release is created — a pre-release when the version carries a semver
# suffix (e.g. 1.2.0-rc.1). telark-crds is published + committed but never
# tagged/released.
name: Release · Publish Charts
run-name: Publish charts (${{ github.event.inputs.chart || 'both' }} · bump ${{ github.event.inputs.bump || 'current' }})

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      chart:
        description: "Which chart(s) to publish"
        type: choice
        default: both
        options:
          - both
          - telark
          - telark-crds
      bump:
        description: "Semver bump applied to the chart version (base = Chart.yaml)"
        type: choice
        default: current
        options:
          - current   # publish the version already in Chart.yaml
          - patch
          - minor
          - major
      release_type:
        description: "telark GitHub release kind"
        type: choice
        default: auto
        options:
          - auto        # pre-release if the version has a semver suffix, else release
          - release
          - prerelease

permissions:
  contents: write   # commit the version bump + push the release tag / create the release
  packages: write
  id-token: write   # keyless cosign signing via GitHub OIDC

concurrency:
  group: release-charts
  cancel-in-progress: false

env:
  CHART_DIR: charts/telark
  CRDS_DIR: charts/telark-crds

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # full history + tags so git-cliff can build the changelog

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Resolve registry + selected charts
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
          # CRDs first, so they exist before the app that assumes them.
          case "${{ github.event.inputs.chart || 'both' }}" in
            telark)      dirs="$CHART_DIR" ;;
            telark-crds) dirs="$CRDS_DIR" ;;
            *)           dirs="$CRDS_DIR $CHART_DIR" ;;
          esac
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - name: Add dependency repos
        run: |
          helm repo add bitnami        https://charts.bitnami.com/bitnami
          helm repo add kyverno        https://kyverno.github.io/kyverno/
          helm repo add otwld          https://helm.otwld.com/
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/

      - name: Package, publish + sign
        id: publish
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          registry="${{ steps.meta.outputs.registry }}"
          repo="${registry#oci://}"
          echo "${{ secrets.ACCESS_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # cosign uses the Docker keychain, not helm's registry config — log it in too.
          echo "${{ secrets.ACCESS_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p .cr-release
          bump="${{ github.event.inputs.bump || 'current' }}"
          published=0
          for dir in ${{ steps.meta.outputs.dirs }}; do
            name=$(yq e '.name' "$dir/Chart.yaml")
            version=$(yq e '.version' "$dir/Chart.yaml")
            # Base version comes from Chart.yaml; the selected bump increments it.
            case "$bump" in
              major) version=$(echo "$version" | awk -F. '{$1+=1;$2=0;$3=0;OFS=".";print $1,$2,$3}') ;;
              minor) version=$(echo "$version" | awk -F. '{$2+=1;$3=0;OFS=".";print $1,$2,$3}') ;;
              patch) version=$(echo "$version" | awk -F. '{$3+=1;OFS=".";print $1,$2,$3}') ;;
            esac
            # Write it back so `helm package` uses it (commit this bump to Chart.yaml).
            [ "$bump" != "current" ] && yq -i ".version = \"$version\"" "$dir/Chart.yaml"
            if helm show chart "${registry}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "skip ${name} ${version} — already published"
              continue
            fi
            [ "$dir" = "$CHART_DIR" ] && helm dependency build "$dir"
            helm package "$dir" --destination .cr-release
            out=$(helm push ".cr-release/${name}-${version}.tgz" "$registry" 2>&1); echo "$out"
            digest=$(echo "$out" | awk '/[Dd]igest:/{print $NF}')
            echo "signing ${repo}/${name}@${digest}"
            cosign sign "${repo}/${name}@${digest}"
            published=$((published+1))
            # Only the app chart gets a repo tag + release; telark-crds does not.
            [ "$dir" = "$CHART_DIR" ] && echo "telark_version=${version}" >> "$GITHUB_OUTPUT"
          done
          if [ "$published" -eq 0 ]; then
            echo "Nothing new to publish — bump the chart version(s) in Chart.yaml."
          fi

      # Regenerate CHANGELOG.md for the new version (git-cliff, Conventional
      # Commits). --tag labels the just-bumped commits under the release version,
      # since the git tag itself is created a step later.
      - name: Generate changelog
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'current' && steps.publish.outputs.telark_version != '' }}
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --tag v${{ steps.publish.outputs.telark_version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit version bumps
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'current' }}
        run: |
          set -euo pipefail
          # Regenerate VALUES.md so its version badge tracks the bump — same command
          # as `make values-docs` and the CI drift check — and commit it together, so
          # the bump never leaves VALUES.md stale.
          go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2 --chart-search-root charts --output-file VALUES.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART_DIR/Chart.yaml" "$CRDS_DIR/Chart.yaml" \
                  "$CHART_DIR/VALUES.md" "$CRDS_DIR/VALUES.md" CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no version changes to commit"
          else
            git commit -m "chore(release): bump chart version(s) [skip ci]"
            git push
          fi

      # Only telark is tagged + released on the repo. The version's semver
      # pre-release suffix (e.g. 1.2.0-rc.1) decides release vs pre-release.
      - name: Tag + release telark
        if: ${{ steps.publish.outputs.telark_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.publish.outputs.telark_version }}"
          tag="v${v}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists — skipping tag + release"
            exit 0
          fi
          # release_type=auto derives from the semver suffix; release/prerelease force it.
          pre=""
          case "${{ github.event.inputs.release_type || 'auto' }}" in
            prerelease) pre="--prerelease" ;;
            release)    pre="" ;;
            *)          case "$v" in *-*) pre="--prerelease" ;; esac ;;
          esac
          git tag "$tag"
          git push origin "$tag"          # pushed with GITHUB_TOKEN, so it does not re-trigger this workflow
          gh release create "$tag" --title "$tag" --generate-notes $pre
