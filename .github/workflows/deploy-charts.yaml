# Deploy: self-hosted worker that lints, packages and `helm install`s the telark
# and telark-crds charts into the target k8s cluster. Triggered by the manual
# deploy workflow (repository_dispatch). Not an official chart release.
name: Deploy · Charts to Cluster
run-name: Deploy charts to cluster (bump "${{ github.event.client_payload.build_type }}")
on:
  repository_dispatch:
    types: [execute-telark-helm-release]

permissions:
  contents: read
  packages: read   # pull the published telark-crds chart from GHCR

# Chart paths declared once, reused by every step below.
env:
  CHART_DIR: charts/telark
  CRDS_DIR: charts/telark-crds
  RELEASES_DIR: charts/releases

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        if: ${{ github.event.client_payload.sonar_scan != 'skip' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Lint Helm Charts
        run: |
          helm lint "$CRDS_DIR" -f "$CHART_DIR/values.yaml"
          helm lint "$CHART_DIR"

      - name: Bump App Chart Version
        id: chart_version
        run: |
          set -euo pipefail
          current_version=$(yq e '.version' "$CHART_DIR/Chart.yaml")
          case "${{ github.event.client_payload.build_type }}" in
            major) new_version=$(echo "$current_version" | awk -F. '{$1+=1;$2=0;$3=0;OFS=".";print $1,$2,$3}');;
            minor) new_version=$(echo "$current_version" | awk -F. '{$2+=1;$3=0;OFS=".";print $1,$2,$3}');;
            patch) new_version=$(echo "$current_version" | awk -F. '{$3+=1;OFS=".";print $1,$2,$3}');;
            *) echo "Invalid version type"; exit 1;;
          esac
          sed -i '' "s/version: $current_version/version: $new_version/" "$CHART_DIR/Chart.yaml"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Update Helm Dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add otwld https://helm.otwld.com/
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm dependency build "$CHART_DIR"

      - name: Package app chart
        run: |
          set -euo pipefail
          dest="$RELEASES_DIR/${{ steps.chart_version.outputs.new_version }}"
          mkdir -p "$dest"
          helm package "$CHART_DIR" --destination "$dest"

      - name: Registry login (pull published CRDs)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Bypass admission webhooks for upgrade
        run: |
          set -euo pipefail
          # Delete custom telark webhooks (the chart recreates them).
          for kind in validatingwebhookconfigurations mutatingwebhookconfigurations; do
            names=$(kubectl get "$kind" -o name 2>/dev/null | grep -i 'telark' || true)
            if [ -n "${names:-}" ]; then
              echo "$names" | xargs kubectl delete --ignore-not-found=true || true
            fi
          done
          # Set Kyverno webhooks to failurePolicy=Ignore so a self-upgrade-induced
          # webhook outage cannot stall apiserver requests on chart resources.
          # Kyverno regenerates its own webhook configs at startup, restoring policy.
          for kind in validatingwebhookconfigurations mutatingwebhookconfigurations; do
            for w in $(kubectl get "$kind" -o name 2>/dev/null | grep -i kyverno || true); do
              n=$(kubectl get "$w" -o jsonpath='{.webhooks[*].name}' | wc -w | tr -d ' ')
              for i in $(seq 0 $((n-1))); do
                kubectl patch "$w" --type=json \
                  -p="[{\"op\":\"add\",\"path\":\"/webhooks/${i}/failurePolicy\",\"value\":\"Ignore\"}]" || true
              done
            done
          done

      - name: Install Helm Charts
        run: |
          set -euo pipefail
          namespace="${{ github.event.client_payload.ns }}"
          # Sizes every telark service: replicas, resources, client rate limits,
          # volumes. Defaulted here because the payload may come from a dispatch
          # that does not set it, and an empty mode is not a valid app.mode.
          install_mode="${{ github.event.client_payload.install_mode }}"  # minimal | standard | performance
          install_mode="${install_mode:-minimal}"
          app_release="${namespace}-release"
          app_version="${{ steps.chart_version.outputs.new_version }}"
          app_pkg="$RELEASES_DIR/${app_version}/telark-${app_version}.tgz"

          case "$install_mode" in
            minimal|standard|performance) ;;
            *) echo "unknown install_mode '${install_mode}': expected minimal, standard or performance" >&2; exit 1 ;;
          esac

          if ! kubectl get namespace "$namespace" >/dev/null 2>&1; then
            kubectl create namespace "$namespace"
          fi

          if helm status "$app_release" -n "$namespace" >/dev/null 2>&1; then
            status=$(helm status "$app_release" -n "$namespace" --output json | jq -r '.info.status')
            if [ "$status" != "deployed" ]; then
              helm uninstall "$app_release" -n "$namespace" --wait
            fi
          fi

          # App: services, subcharts, and the telark-crds subchart — CRDs ship with
          # the chart (resource-policy:keep preserves them), so one release covers
          # everything. app.mode sizes every telark service; NATS config is inlined.
          helm upgrade --install "$app_release" "$app_pkg" \
            -n "$namespace" \
            --set "app.mode=${install_mode}" \
            --force-conflicts \
            --cleanup-on-fail \
            --timeout 15m
