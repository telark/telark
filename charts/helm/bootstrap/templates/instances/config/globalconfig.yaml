apiVersion: erpi.{{ $.Values.app.name }}/v1alpha1
kind: GlobalConfig
metadata:
  name: global-config
  namespace: {{ $.Values.app.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.app.name }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  excludedNamespaces:
    - "default"
    - "kube-system"
    - "kube-public"
    - "kube-node-lease"
  userSettings:
    theme: "default"
    density: "default"
    uiViewSize: "default"
    fetchIntervalSeconds: 60
  ai:
    enabled: false
    provider: ""
    apiKey: ""
  snapshots:
    maxPerApp: 5
  cluster:
    version: "" #set during discovery-service startup
  oidc:
    enabled: {{ $.Values.app.auth.oidc.enabled }}
    googleClientID: {{ $.Values.app.auth.oidc.googleClientID | quote }}
