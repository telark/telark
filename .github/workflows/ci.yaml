name: CI
run-name: CI for ${{ github.head_ref || github.ref_name }}

# Quality gate for pull requests: every service lints and tests before a
# change can merge. Build/release workflows stay manual (workflow_dispatch); this
# is the automated check that protects the repo.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: charts/telark
  CRDS_DIR: charts/telark-crds

jobs:
  go:
    name: Go · ${{ matrix.service }} · ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # coverage = ratchet floor (just below current); raise as coverage
      # improves. Never lower it — that is the point.
      # test and lint run as parallel legs: -race builds are not reusable by lint,
      # so one job paid both compiles back to back (discovery: 483 s + 353 s).
      matrix:
        service: [auth, discovery, exporter, notifier, data, rest, kcore, x-ware]
        task: [test, lint]
        include:
          - { service: auth, path: services/auth, coverage: 60 }
          - { service: discovery, path: services/discovery, coverage: 50 }
          - { service: exporter, path: services/exporter, coverage: 55 }
          - { service: notifier, path: services/notifier, coverage: 75 }
          - { service: data, path: internal/data, coverage: 73 }
          - { service: rest, path: internal/rest, coverage: 54 }
          - { service: kcore, path: internal/kcore, coverage: 22 }
          - { service: x-ware, path: internal/x-ware, coverage: 47 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go CI
        uses: ./.github/actions/go-ci
        with:
          packages: ./${{ matrix.path }}/...
          cache-key: ${{ matrix.service }}-${{ matrix.task }}
          coverage-threshold: ${{ matrix.coverage }}
          test: ${{ matrix.task == 'test' }}
          lint: ${{ matrix.task == 'lint' }}

      - name: Upload coverage to Codecov
        if: ${{ matrix.task == 'test' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: ${{ matrix.service }}
          slug: telark/telark
          fail_ci_if_error: false

  analyzer:
    name: Python · analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Syntax check
        run: python -m compileall -q .

      # The stub-based suites replace sys.modules at import, so they run in a
      # separate process from the real-dependency suites to avoid cross-pollution.
      # --cov-append across the two processes, then one combined gate. 95 is the
      # ratchet floor (current ~99%); raise as coverage improves, never lower.
      - name: Test
        run: |
          python -m pytest --cov=. --cov-report= tests/test_*_cov.py -q
          python -m pytest --cov=. --cov-append --cov-report= tests/test_authz.py tests/test_insights.py tests/test_exporter.py -q
          python -m coverage report --fail-under=95
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/analyzer/coverage.xml
          flags: analyzer
          slug: telark/telark
          fail_ci_if_error: false

  helm:
    name: Helm · lint + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm and Go
        uses: ./.github/actions/setup-helm-go

      # Subchart .tgz are git-ignored build artifacts, so fetch them before
      # anything lints or renders the chart. Mirrors `make deps`.
      - name: Add Helm dependency repos
        uses: ./.github/actions/helm-add-dependency-repos

      - name: Fetch chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint charts
        run: |
          helm lint "$CHART_DIR" --set app.auth.bootstrap.admin=test@example.com
          helm lint "$CRDS_DIR" -f "$CHART_DIR/values.yaml"

      # Same command as `make values-docs`, so local + CI never disagree.
      - name: Regenerate VALUES.md
        uses: ./.github/actions/helm-docs-regenerate

      - name: Check VALUES.md is up to date
        run: |
          git diff --exit-code -- charts/telark/VALUES.md charts/telark-crds/VALUES.md \
            || { echo "VALUES.md is stale — run 'make values-docs' and commit."; exit 1; }

      # Schema-validate the rendered manifests against Kubernetes + CRD schemas
      # (every mode). Mirrors `make helm-validate`.
      - name: Validate rendered manifests
        uses: ./.github/actions/helm-kubeconform-validate
        with:
          chart-dir: ${{ env.CHART_DIR }}
