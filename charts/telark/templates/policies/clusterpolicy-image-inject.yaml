{{- if and .Values.app.kyverno.enabled (.Capabilities.APIVersions.Has "kyverno.io/v1/ClusterPolicy") }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "telark.fullname" . }}-inject-modifier
  labels:
{{- include "telark.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    # The policy must outlive the hook: it is the only source of last-modified annotations.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # This policy uses admission request variables (request.userInfo.*),
  # which are not available in Kyverno background mode.
  background: false
  failurePolicy: Ignore
  # Never block writes — admission webhook must fail open if Kyverno is unhealthy
  # or a rule errors. Audit only, never Enforce.
  validationFailureAction: Audit
  rules:
    {{- $by := "telark.io/last-modified-by" }}
    {{- $at := "telark.io/last-modified-at" }}
    {{- $op := "telark.io/last-modified-operation" }}
    {{- $annotations := "{{ request.object.metadata.annotations || `{}` | length(@) }}" }}
    # JSON6902 adds, not patchStrategicMerge: a strategic merge re-serialises the whole object and
    # collapses list entries that share a merge key (duplicate env names) in user workloads.
    # Only the kinds discovery snapshots, minus Secret (Kyverno would see every payload):
    # a wildcard would route every Lease, EndpointSlice and Event write through Kyverno.
    - name: inject-last-modified-new-annotations
      match: &match
        any:
          - resources:
              kinds:
                - apps/v1/Deployment
                - apps/v1/StatefulSet
                - apps/v1/DaemonSet
                - batch/v1/Job
                - batch/v1/CronJob
                - v1/ConfigMap
                - v1/Service
                - v1/PersistentVolumeClaim
                - v1/ServiceAccount
                - networking.k8s.io/v1/Ingress
                - networking.k8s.io/v1/NetworkPolicy
                - autoscaling/v2/HorizontalPodAutoscaler
                {{- /* Kyverno rejects a policy naming a kind the cluster does not serve. */}}
                {{- if .Capabilities.APIVersions.Has "autoscaling.k8s.io/v1/VerticalPodAutoscaler" }}
                - autoscaling.k8s.io/v1/VerticalPodAutoscaler
                {{- end }}
              # Matching on namespaces ensures cluster-scoped resources are not targeted.
              namespaces:
                - "*"
      exclude: &exclude
        any:
          - resources:
              namespaces:
                # Avoid self-mutation loops / policy churn in our own/system namespaces.
                - {{ .Values.app.namespace }}
                - kyverno
                - kube-system
                - kube-public
                - kube-node-lease
      # A JSON pointer cannot add a key to a missing map: this rule creates it.
      preconditions:
        all:
          - key: {{ $annotations | quote }}
            operator: Equals
            value: 0
      mutate:
        patchesJson6902: |-
          - op: add
            path: /metadata/annotations
            value:
              {{ $by }}: {{ "{{ request.userInfo.username }}" | quote }}
              {{ $at }}: {{ "{{ time_now_utc() }}" | quote }}
              {{ $op }}: {{ "{{ request.operation }}" | quote }}
    - name: inject-last-modified-by
      match: *match
      exclude: *exclude
      preconditions:
        all:
          - key: {{ $annotations | quote }}
            operator: GreaterThan
            value: 0
      mutate:
        patchesJson6902: |-
          - op: add
            path: /metadata/annotations/{{ $by | replace "/" "~1" }}
            value: {{ "{{ request.userInfo.username }}" | quote }}
          - op: add
            path: /metadata/annotations/{{ $at | replace "/" "~1" }}
            value: {{ "{{ time_now_utc() }}" | quote }}
          - op: add
            path: /metadata/annotations/{{ $op | replace "/" "~1" }}
            value: {{ "{{ request.operation }}" | quote }}
{{- end }}
