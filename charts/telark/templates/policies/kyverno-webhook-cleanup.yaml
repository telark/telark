{{- /*
Kyverno's webhooks outlive an uninstall and sit in front of every API write. Its own
hooks (kyverno.webhooksCleanup) can't remove them as a subchart: scale-to-zero selects
part-of=kyverno (here <release>-kyverno), and delete-webhooks deletes a ValidatingAdmissionPolicy
instead of each validating webhook (kyverno cmd/readiness-checker/main.go, v1.19.1).
Stop the controllers first, or they re-create the webhooks as soon as they are gone.
*/}}
{{- $values := include "telark.modeValues" . | fromYaml }}
{{- if $values.kyverno.enabled }}
{{- $ns := .Values.app.namespace }}
{{- $kyverno := printf "app.kubernetes.io/part-of=%s" (ternary .Release.Name (printf "%s-kyverno" .Release.Name) (contains "kyverno" .Release.Name) | trunc 63 | trimSuffix "-") }}
{{- $securityContext := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "telark.fullname" . }}-kyverno-scale
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "telark.fullname" . }}-kyverno-scale
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "telark.fullname" . }}-kyverno-scale
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "telark.fullname" . }}-kyverno-webhook-cleanup
  namespace: {{ $ns }}
  labels:
    {{- include "telark.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      # Kyverno's own hooks use this account for the same scale and delete calls.
      serviceAccountName: kyverno-admission-controller
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: scale-to-zero
          image: {{ $values.app.image.kubectl }}
          args: ["scale", "deployment", "-n", {{ $ns | quote }}, "-l", {{ $kyverno | quote }}, "--replicas=0", "--cache-dir=/tmp"]
          securityContext: {{- toYaml $securityContext | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
        - name: wait-for-pods
          image: {{ $values.app.image.kubectl }}
          args: ["wait", "--for=delete", "pod", "-n", {{ $ns | quote }}, "-l", {{ $kyverno | quote }}, "--timeout=120s", "--cache-dir=/tmp"]
          securityContext: {{- toYaml $securityContext | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: delete-webhooks
          image: {{ $values.app.image.kubectl }}
          args: ["delete", "validatingwebhookconfigurations,mutatingwebhookconfigurations", "-l", "webhook.kyverno.io/managed-by=kyverno", "--ignore-not-found", "--cache-dir=/tmp"]
          resources:
            requests:
              memory: {{ $values.app.shared.resources.requests.memory }}
              cpu: {{ $values.app.shared.resources.requests.cpu }}
              ephemeral-storage: {{ index $values.app.shared.resources.requests "ephemeral-storage" }}
            limits:
              memory: {{ $values.app.shared.resources.limits.memory }}
              ephemeral-storage: {{ index $values.app.shared.resources.limits "ephemeral-storage" }}
          securityContext: {{- toYaml $securityContext | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
