name: Trigger & Install Helm Release
run-name: Trigger & Install Helm Release with Bump "${{ github.event.client_payload.build_type }}"
on:
  repository_dispatch:
    types: [execute-telark-helm-release]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        if: ${{ github.event.client_payload.sonar_scan != 'skip' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Lint Helm Charts
        run: |
          helm lint charts/helm/bootstrap -f charts/helm/app/values.yaml
          helm lint charts/helm/app

      - name: Bump App Chart Version
        id: chart_version
        run: |
          set -euo pipefail
          current_version=$(yq e '.version' charts/helm/app/Chart.yaml)
          case "${{ github.event.client_payload.build_type }}" in
            major) new_version=$(echo "$current_version" | awk -F. '{$1+=1;$2=0;$3=0;OFS=".";print $1,$2,$3}');;
            minor) new_version=$(echo "$current_version" | awk -F. '{$2+=1;$3=0;OFS=".";print $1,$2,$3}');;
            patch) new_version=$(echo "$current_version" | awk -F. '{$3+=1;OFS=".";print $1,$2,$3}');;
            *) echo "Invalid version type"; exit 1;;
          esac
          sed -i '' "s/version: $current_version/version: $new_version/" charts/helm/app/Chart.yaml
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Update Helm Dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add otwld https://helm.otwld.com/
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm dependency build charts/helm/app

      - name: Package Helm charts
        run: |
          set -euo pipefail
          mkdir -p releases/${{ steps.chart_version.outputs.new_version }}
          helm package charts/helm/bootstrap --destination charts/releases/${{ steps.chart_version.outputs.new_version }}
          helm package charts/helm/app       --destination charts/releases/${{ steps.chart_version.outputs.new_version }}

      - name: Bypass admission webhooks for upgrade
        run: |
          set -euo pipefail
          # Delete custom telark webhooks (the chart recreates them).
          for kind in validatingwebhookconfigurations mutatingwebhookconfigurations; do
            names=$(kubectl get "$kind" -o name 2>/dev/null | grep -i 'telark' || true)
            if [ -n "${names:-}" ]; then
              echo "$names" | xargs kubectl delete --ignore-not-found=true || true
            fi
          done
          # Set Kyverno webhooks to failurePolicy=Ignore so a self-upgrade-induced
          # webhook outage cannot stall apiserver requests on chart resources.
          # Kyverno regenerates its own webhook configs at startup, restoring policy.
          for kind in validatingwebhookconfigurations mutatingwebhookconfigurations; do
            for w in $(kubectl get "$kind" -o name 2>/dev/null | grep -i kyverno || true); do
              n=$(kubectl get "$w" -o jsonpath='{.webhooks[*].name}' | wc -w | tr -d ' ')
              for i in $(seq 0 $((n-1))); do
                kubectl patch "$w" --type=json \
                  -p="[{\"op\":\"add\",\"path\":\"/webhooks/${i}/failurePolicy\",\"value\":\"Ignore\"}]" || true
              done
            done
          done

      - name: Install Helm Charts
        run: |
          set -euo pipefail
          namespace="${{ github.event.client_payload.ns }}"
          kyverno_config_mode="${{ github.event.client_payload.kyverno_config_mode }}"  # minimal | performance
          bootstrap_release="${namespace}-bootstrap"
          app_release="${namespace}-release"
          app_version="${{ steps.chart_version.outputs.new_version }}"
          bootstrap_version=$(yq e '.version' charts/helm/bootstrap/Chart.yaml)
          bootstrap_pkg="charts/releases/${app_version}/telark-bootstrap-chart-${bootstrap_version}.tgz"
          app_pkg="charts/releases/${app_version}/telark-core-chart-${app_version}.tgz"

          charts_values="-f charts/helm/app/values.charts.yaml"
          nats_conf_value="--set-file nats.configuration=charts/helm/app/config/nats.conf"
          kyverno_values="-f charts/helm/app/values.kyverno.${kyverno_config_mode}.yaml"

          if ! kubectl get namespace "$namespace" >/dev/null 2>&1; then
            kubectl create namespace "$namespace"
          fi

          for r in "$bootstrap_release" "$app_release"; do
            if helm status "$r" -n "$namespace" >/dev/null 2>&1; then
              status=$(helm status "$r" -n "$namespace" --output json | jq -r '.info.status')
              if [ "$status" != "deployed" ]; then
                helm uninstall "$r" -n "$namespace" --wait
              fi
            fi
          done

          # Pre-apply CRDs
          helm template "$bootstrap_release" "$bootstrap_pkg" \
            -f charts/helm/app/values.yaml \
            | yq 'select(.kind == "CustomResourceDefinition")' \
            | kubectl apply --server-side --force-conflicts -f -

          # Bootstrap: CRDs + built-in CR instances. Reads charts/helm/app/values.yaml so
          # base.namespace and services.auth.env.GOOGLE_CLIENT_ID match the app release.
          helm upgrade --install "$bootstrap_release" "$bootstrap_pkg" \
            -n "$namespace" \
            -f charts/helm/app/values.yaml \
            --take-ownership \
            --force-conflicts \
            --wait \
            --cleanup-on-fail \
            --timeout 5m

          # App: services + subcharts
          helm upgrade --install "$app_release" "$app_pkg" \
            -n "$namespace" \
            ${charts_values} \
            ${nats_conf_value} \
            ${kyverno_values} \
            --force-conflicts \
            --cleanup-on-fail \
            --timeout 15m

      - name: Commit changes
        uses: EndBug/add-and-commit@v10.0.0
        with:
          author_name: GitHub Action
          author_email: action@github.com
          message: "Build Helm Release ${{ steps.chart_version.outputs.new_version }}"
