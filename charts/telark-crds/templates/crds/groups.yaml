apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: groups.{{ include "telark.apiGroup" $ }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: {{ include "telark.apiGroup" $ }}
  names:
    kind: Group
    plural: groups
    singular: group
    shortNames:
      - tgroup
    categories:
      - telark
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - description
                - categoryRef
                - creationDate
              properties:
                userRefs:
                  type: array
                  items:
                    type: string
                roleRefs:
                  type: array
                  items:
                    type: string
                name:
                  type: string
                  description: Name of the group
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  description: Description of the group's purpose
                  minLength: 1
                  maxLength: 300
                categoryRef:
                  type: string
                  description: Category id of the group
                {{- include "dateFieldsSchema" . | nindent 16 }}
                createdBy:
                  type: string
                  description: ID of the user who created the role
                lastUpdatedBy:
                  type: string
                  description: ID of the user who last updated the role

