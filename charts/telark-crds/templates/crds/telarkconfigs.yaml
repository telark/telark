apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: telarkconfigs.{{ include "telark.apiGroup" $ }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: {{ include "telark.apiGroup" $ }}
  names:
    kind: TelarkConfig
    plural: telarkconfigs
    singular: telarkconfig
    shortNames:
      - tcfg
    categories:
      - telark
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: self.metadata.name == 'default'
              message: the telark config is a singleton named default
          properties:
            spec:
              type: object
              properties:
                excludedNamespaces:
                  type: array
                  items:
                    type: string
                userSettings:
                  type: object
                  properties:
                    fetchIntervalSeconds:
                      type: integer
                ai:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    model:
                      type: string
                      maxLength: 128
                      pattern: '^[a-z0-9][a-z0-9._-]*(:[a-z0-9._-]+)?$'
                      description: Local analyzer model tag (default granite4:350m); deep mode additionally requires the tools capability
                    autoAnalyze:
                      type: boolean
                      description: Run the analyzer automatically on incident/recovery changes
                snapshots:
                  type: object
                  properties:
                    maxPerApp:
                      type: integer
                oidc:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    googleClientID:
                      type: string
                    egressAllowed:
                      type: boolean
                      description: whether the cluster may reach the provider to fetch signing keys. When false, the pinned key set in the OIDC trust Secret must be set.
            status:
              type: object
              properties:
                cluster:
                  type: object
                  properties:
                    version:
                      type: string
