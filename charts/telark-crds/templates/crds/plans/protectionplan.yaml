apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: protectionplans.erpi.{{ $.Values.app.name }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: crd
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: erpi.{{ $.Values.app.name }}
  names:
    kind: ProtectionPlan
    plural: protectionplans
    singular: protectionplan
    shortNames:
      - pp
      - pplan
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.name
        - name: Phase
          type: string
          jsonPath: .spec.phase
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Scope
          type: string
          jsonPath: .spec.scope.type
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Created
          type: string
          jsonPath: .spec.createdAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - id
                - name
                - severity
                - priority
                - scope
                - policies
                - mode
                - timeMode
                - phase
                - createdAt
                - createdBy
                - lastUpdatedAt
                - lastUpdatedBy
                - participantsIDs
              properties:
                id:
                  type: string
                  description: Unique identifier for the protection plan
                  pattern: '^pp-[a-z0-9]+-[a-z0-9]+-[a-z0-9]+$'
                name:
                  type: string
                  description: Human-readable name for the protection plan
                  minLength: 1
                  maxLength: 64
                description:
                  type: string
                  description: Optional description of the protection plan's purpose
                  maxLength: 512
                  nullable: true
                severity:
                  type: string
                  description: Severity level of the protection plan
                  enum: [low, medium, high, critical]
                priority:
                  type: integer
                  description: Execution priority (-100 to 100, higher wins)
                  minimum: -100
                  maximum: 100
                  default: 0
                scope:
                  type: object
                  description: Target scope for the protection plan
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      description: Scope type — applications or namespaces
                      enum: [applications, namespaces]
                    applicationIds:
                      type: array
                      description: Application IDs targeted when type=applications
                      items:
                        type: string
                      nullable: true
                    namespaces:
                      type: array
                      description: Namespace names targeted when type=namespaces
                      items:
                        type: string
                      nullable: true
                  x-kubernetes-validations:
                    - rule: >
                        self.type == 'applications'
                          ? (has(self.applicationIds) && size(self.applicationIds) > 0 && (!has(self.namespaces) || size(self.namespaces) == 0))
                          : (has(self.namespaces) && size(self.namespaces) > 0 && (!has(self.applicationIds) || size(self.applicationIds) == 0))
                      message: "scope.type=applications requires non-empty applicationIds and no namespaces; scope.type=namespaces requires non-empty namespaces and no applicationIds"
                policies:
                  type: array
                  description: Ordered list of policy templates applied by this plan
                  items:
                    type: object
                    required:
                      - templateID
                    properties:
                      templateID:
                        type: string
                        description: ID of the policy template to apply
                      params:
                        type: object
                        description: Template-specific parameters (validated server-side)
                        x-kubernetes-preserve-unknown-fields: true
                        nullable: true
                mode:
                  type: string
                  description: Enforcement mode for all rendered policies
                  enum: [audit, enforce]
                timeMode:
                  type: string
                  description: Whether the plan is permanent or time-bounded
                  enum: [permanent, time_range]
                timeRange:
                  type: object
                  description: Active window when timeMode=time_range
                  nullable: true
                  properties:
                    startAt:
                      type: string
                      description: RFC3339 timestamp when the plan becomes active
                      format: date-time
                    endAt:
                      type: string
                      description: RFC3339 timestamp when the plan terminates
                      format: date-time
                phase:
                  type: string
                  description: Current lifecycle phase of the plan
                  enum: [draft, scheduled, active, terminated, canceled, failed]
                reason:
                  type: string
                  description: Human-readable explanation for the current phase (failures or cancellations)
                  nullable: true
                renderedPolicies:
                  type: array
                  description: Names of Kyverno Policy resources deployed by this plan
                  items:
                    type: string
                  nullable: true
                createdAt:
                  type: string
                  description: RFC3339 timestamp when the plan was created
                  format: date-time
                createdBy:
                  type: string
                  description: ID of the user who created the plan
                lastUpdatedAt:
                  type: string
                  description: RFC3339 timestamp of the most recent update
                  format: date-time
                lastUpdatedBy:
                  type: string
                  description: ID of the user who last updated the plan
                startedAt:
                  type: string
                  description: RFC3339 timestamp when the plan became active
                  format: date-time
                  nullable: true
                startedBy:
                  type: string
                  description: ID of the user or system that activated the plan
                  nullable: true
                terminatedAt:
                  type: string
                  description: RFC3339 timestamp when the plan was terminated or cancelled
                  format: date-time
                  nullable: true
                terminatedBy:
                  type: string
                  description: ID of the user or system that terminated the plan
                  nullable: true
                participantsIDs:
                  type: array
                  description: User IDs of participants associated with this plan
                  items:
                    type: string
                health:
                  type: string
                  description: Health/drift status of the plan's deployed Kyverno policies
                  enum: [unknown, healthy, drifted, degraded]
                  default: unknown
                healthCheckedAt:
                  type: string
                  description: RFC3339 timestamp of the last health reconciliation
                  format: date-time
                  nullable: true
                healthDetail:
                  type: array
                  description: Per-policy presence and readiness breakdown from the last health check
                  nullable: true
                  items:
                    type: object
                    properties:
                      policyName:
                        type: string
                      namespace:
                        type: string
                      present:
                        type: boolean
                      ready:
                        type: boolean
                      failureAction:
                        type: string
