name: 'Tag Service Repository'
description: 'Create and push a tag to the service repository with the version'
inputs:
  service_name:
    description: 'Name of the service'
    required: true
  service_version:
    description: 'Version of the service (without v prefix)'
    required: true
  service_path:
    description: 'Path to the service repository'
    required: true
    default: 'service'
  branch:
    description: 'Branch that the tag was built from'
    required: true

runs:
  using: 'composite'
  steps:
    # Inputs reach the script through env, never string interpolation, so a
    # value carrying shell syntax cannot escape into the command.
    - name: Create and push tag to service repository
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service_name }}
        SERVICE_VERSION: ${{ inputs.service_version }}
        SERVICE_PATH: ${{ inputs.service_path }}
        BRANCH: ${{ inputs.branch }}
        # .github/actions/<name> -> up two -> .github -> scripts. Anchored on
        # action_path, not the workspace, so it resolves under any checkout path.
        SCRIPT_DIR: ${{ github.action_path }}/../../scripts
      run: bash "$SCRIPT_DIR/tag-service-repo.sh"