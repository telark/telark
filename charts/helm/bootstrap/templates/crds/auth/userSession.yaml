apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usersessions.auth.{{ $.Values.app.name }}
  labels:
    app.kubernetes.io/name: usersessions.auth.{{ $.Values.app.name }}
    app.kubernetes.io/part-of: {{ $.Values.app.name }}
spec:
  group: auth.{{ $.Values.app.name }}
  names:
    kind: UserSession
    plural: usersessions
    singular: usersession
    shortNames:
      - session
      - sess
      - us
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - userId
                - sessionToken
                - createdTimestamp
                - expiresTimestamp
              properties:
                userId:
                  type: string
                  description: User ID associated with this session
                sessionToken:
                  type: string
                  description: Unique session token
                createdTimestamp:
                  type: string
                  format: date-time
                  description: Timestamp when the session was created
                expiresTimestamp:
                  type: string
                  format: date-time
                  description: Timestamp when the session expires
                ipAddress:
                  type: string
                  description: IP address from which the session was created (optional)
                deviceMetadata:
                  type: object
                  description: Optional browser/device context provided by the UI
                  properties:
                    browser:
                      type: string
                    device:
                      type: string
                    os:
                      type: string
                    location:
                      type: string
                    userAgent:
                      type: string

