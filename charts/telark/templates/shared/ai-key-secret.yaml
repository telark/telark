{{/*
The AI provider key, set by an admin at runtime. The chart creates the shell
only and deliberately declares no data: the key is written by the exporter, and
a templated data block would clobber it on every upgrade or GitOps apply.
Creating it here also keeps the exporter's RBAC to get/update on this one name,
since create cannot be restricted to a resource name.
*/}}
{{- if $.Values.services.exporter.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ai-provider-key" $.Values.app.name }}
  namespace: {{ $.Values.app.namespace }}
  labels:
    {{- include "telark.labels" $ | nindent 4 }}
    app.kubernetes.io/component: exporter
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
{{- end }}
