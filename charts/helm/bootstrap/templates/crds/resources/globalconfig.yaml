apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: globalconfigs.erpi.{{ $.Values.app.name }}
  labels:
    app.kubernetes.io/name: globalconfigs.erpi.{{ $.Values.app.name }}
    app.kubernetes.io/part-of: {{ $.Values.app.name }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  group: erpi.{{ $.Values.app.name }}
  names:
    kind: GlobalConfig
    plural: globalconfigs
    singular: globalconfig
    shortNames:
      - gcfg
      - globalconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                excludedNamespaces:
                  type: array
                  items:
                    type: string
                userSettings:
                  type: object
                  properties:
                    theme:
                      type: string
                    density:
                      type: string
                    uiViewSize:
                      type: string
                    fetchIntervalSeconds:
                      type: integer
                ai:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    provider:
                      type: string
                    apiKey:
                      type: string
                snapshots:
                  type: object
                  properties:
                    maxPerApp:
                      type: integer
                cluster:
                  type: object
                  properties:
                    version:
                      type: string
                oidc:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    googleClientID:
                      type: string
