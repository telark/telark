name: 'Git Commit Version Bump'
description: 'Pull latest changes then commit and push a version bump.'
inputs:
  cwd:
    description: 'Working directory containing the repo to pull/commit in'
    required: true
    default: '.'
  message:
    description: 'Commit message'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Pull Latest Changes
      shell: bash
      working-directory: ${{ inputs.cwd }}
      run: |
        # Pull the branch that is checked out, never a hardcoded main: the
        # caller builds from any branch, and the checkout is shallow, so
        # merging main here has no common ancestor and aborts.
        branch=$(git rev-parse --abbrev-ref HEAD)
        git stash push -m "Temporary stash before pull" || true
        git pull --rebase origin "$branch"
        git stash pop || true

    - name: Commit Version
      uses: EndBug/add-and-commit@v11.1.1
      with:
        author_name: GitHub Action
        author_email: action@github.com
        cwd: ${{ inputs.cwd }}
        message: ${{ inputs.message }}
