# Install mode: performance — selected with --set app.mode=performance
#
# Large cluster, high change rate. Three replicas per service, disruption budgets
# that keep a quorum up through a drain, and client rate limits raised so the
# services are not the bottleneck when thousands of resources move at once.
#
# Costs roughly an order of magnitude more than minimal to run — pick it when the
# cluster is genuinely large, not to be safe. Sizes telark's own services only;
# subcharts (redis, nats, kyverno) ship fixed production-grade defaults, owned by
# the chart and identical in every mode.
# Capacity only — app.crdGuard (security posture) is an independent flag.

app:
  serviceDefaults:
    replicas: 1
    # Every service starts at one replica; the HPA ceiling is raised fleet-wide
    # (exporter never scales).
    autoscaling:
      minReplicas: 1
      maxReplicas: 5
  persistence:
    size: 50Gi
    reportsSize: 10Gi
  shared:
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"

services:
  exporter:
    env:
      EXPORTER_K8S_CLIENT_QPS: "200"
      EXPORTER_K8S_CLIENT_BURST: "400"
      SNAPSHOT_GC_INTERVAL_SEC: "900"
    pdb:
      enabled: true
      minAvailable: 1
  discovery:
    env:
      DISCOVERY_K8S_CLIENT_QPS: "300"
      DISCOVERY_K8S_CLIENT_BURST: "600"
      FORCE_SYNC_WORKERS: "12"
      DISCOVERY_AUTO_CLEANUP_CYCLE_INTERVAL_SEC: "120"
    # Budgets keep one pod through a drain once the HPA has scaled above one.
    pdb:
      enabled: true
      minAvailable: 1
  analyzer:
    env:
      ANALYZER_REVIEW_APPS_PER_MIN: "60"
    pdb:
      enabled: true
      minAvailable: 1
  notifier:
    env:
      NOTIFIER_APPLY_WORKERS: "32"
    pdb:
      enabled: true
      minAvailable: 1
  auth:
    env:
      CLEANUP_WORKERS_PER_TYPE: "4"
    pdb:
      enabled: true
      minAvailable: 1
