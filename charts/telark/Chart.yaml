apiVersion: v2
name: telark
description: A protection gate for your Kubernetes workloads — discover your applications, then decide what can change them, and when
type: application
version: 0.0.1
appVersion: "2.0"
home: https://telark.io
sources:
  - https://github.com/telark/telark
icon: https://telark.io/icon.svg
keywords:
  - kubernetes
  - workload-protection
  - application-discovery
  - protection
  - governance
maintainers:
  - name: telark
    email: contact@telark.io
    url: https://github.com/telark
# 1.33 is the oldest release still receiving upstream patches, and the oldest
# offered by the managed providers. It also clears ValidatingAdmissionPolicy
# (GA in 1.30), so the admission guard needs no fallback for older clusters.
kubeVersion: ">=1.33.0-0"
dependencies:
  - name: redis
    version: 23.0.10
    repository: https://charts.bitnami.com/bitnami
  - name: nats
    version: 9.0.28
    repository: https://charts.bitnami.com/bitnami
  - name: kyverno
    version: 3.7.1
    repository: https://kyverno.github.io/kyverno/
    condition: app.kyverno.enabled
  - name: metrics-server
    version: 3.12.2
    repository: https://kubernetes-sigs.github.io/metrics-server/
    condition: metrics-server.enabled
  - name: ollama
    version: 1.50.0
    repository: https://helm.otwld.com/
    condition: app.ollama.enabled
annotations:
  artifacthub.io/license: Elastic-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/telark/telark
    - name: support
      url: https://github.com/telark/telark/issues
  artifacthub.io/containsSecurityUpdates: "false"
