# ──────────────────────────────────────────────────────────────────────────────
# telark-core-chart — values.yaml
#
# This is the canonical configuration source for the telark Helm chart. A full
# per-key reference (with descriptions and operational notes for every service
# env var) lives in ./README.md.
#
# ─── File layout ─────────────────────────────────────────────────────────────
#
#   app/        Application-wide configuration. Defines who the app is, where
#               its container images come from, how authentication works,
#               which subcharts are enabled, what storage to provision, and
#               the shared pod-level fragments (probes, resources, security,
#               env injection) that services opt into.
#
#   services/   Per-service blocks (one per workload: exporter, discovery,
#               enrichment, notifier, auth, ui). Each service inherits from
#               app.serviceDefaults and selectively pulls in fragments from
#               app.shared via boolean gates. Only deviations from the
#               defaults need to be set explicitly.
#
# ─── Conventions ─────────────────────────────────────────────────────────────
#
#   - YAML keys use camelCase.
#   - Container env var keys use SCREAMING_SNAKE_CASE (Kubernetes convention).
#   - Boolean-like strings ("true" / "false") are used where the value is
#     forwarded directly into a container env var. Real YAML booleans appear
#     only where Helm itself consumes the value (e.g. service.enabled).
#
# ─── Inheritance & gates ─────────────────────────────────────────────────────
#
#   Each per-service block can override any field from app.serviceDefaults
#   (port, replicas, serviceType, terminationGracePeriodSec). Five boolean
#   gates control which app.shared fragments are mounted into the pod:
#
#     Gate                Default   Effect when true
#     ----                -------   ----------------
#     includeResources    true      Apply app.shared.resources
#     includeHealthCheck  true      Apply app.shared.healthCheck probes
#     includeSecurity     true      Apply app.shared.security securityContext
#     useRedis            true      Mount app.shared.redis as envFrom configmap
#     useNatsCreds        false     Mount app.shared.natsEnvFromSecret entries
#
#   To opt out of a default-true gate, set it to false on the service block.
#   To opt in to useNatsCreds, set it to true.
#
# ─── Templating ──────────────────────────────────────────────────────────────
#
#   String values inside services.<svc>.env.* and volume claimNames are passed
#   through Helm's `tpl` function with .Values in scope. They may therefore
#   reference other parts of this file using `{{ .Values.app.* }}` syntax —
#   used here to wire BOOTSTRAP_ADMINS, RP_ID, GOOGLE_CLIENT_ID, snapshot PVC
#   names, etc. without duplication.
#
# ─── Notes for operators ─────────────────────────────────────────────────────
#
#   - Secrets in production: API keys under services.enrichment.env should be
#     moved to a Kubernetes Secret and consumed via envFromSecret rather than
#     being checked in here.
#   - Storage class semantics for any *.storageClass key in this file:
#       ""        -> omit storageClassName; cluster default class wins
#       "-"       -> storageClassName: "" (disables dynamic provisioning)
#       "<name>"  -> storageClassName: "<name>"
#   - Auth-service note: SELF_REGISTRATION_ENABLED gates ONLY the passkey
#     path. OIDC users are auto-provisioned on first successful Google login
#     regardless of this flag, and admin role is granted automatically if the
#     email appears in app.auth.bootstrap.admins.
#
# ─────────────────────────────────────────────────────────────────────────────

# ─── app ─────────────────────────────────────────────────────────────────────
# Application-wide configuration.
#
#   name             Prefix for every rendered resource name (Deployment,
#                    Service, RBAC, etc.). Effectively the install identity.
#   namespace        Install namespace. Bootstrap-chart CRs also land here.
#   image            Container image source. Full image reference for each
#                    service is composed as:
#                      <registry>/<repository>:<imageTagPrefix><version>
#                    e.g. botriack/telark:exp-3.3.1
#   auth             Operator-facing auth-service configuration:
#                      bootstrap.admins         Comma-list of emails; each
#                                               receives the Admin role on
#                                               first OIDC login. Required
#                                               when passkey.selfRegistration
#                                               is "false" (otherwise the
#                                               cluster has no path to its
#                                               first admin user).
#                      oidc.*                   Google OIDC config: client ID
#                                               plus offline-mode controls
#                                               (egressAllowed + googleJwkJson).
#                                               Also published to the
#                                               GlobalConfig CR.
#                      passkey.{id,name,origin} WebAuthn relying-party
#                                               identity. Browser enforces
#                                               origin strictly.
#                      passkey.selfRegistration "false" blocks new passkey
#                                               registration. OIDC users are
#                                               unaffected.
#   kyverno.enabled  Install the Kyverno admission-controller subchart.
#                    Subchart-internal config lives in values.charts.yaml.
#   ollama.enabled   Install the Ollama LLM subchart. Required only when
#                    services.enrichment uses provider=ollama.
#   persistence      Storage for the single telark-owned PVC (exporter
#                    snapshots). See "Storage class semantics" above.
#   serviceDefaults  Fallback values for every entry under services.*. A
#                    service block overrides any of these by setting the same
#                    key explicitly.
#   shared           Pod-level fragments selectively applied to each service
#                    via the gates listed above:
#                      redis             REDIS_* env vars mounted via
#                                        envFrom: configMapRef (when useRedis).
#                      resources         CPU/memory requests + limits.
#                      healthCheck       HTTP liveness + readiness probes.
#                                        `port` is the container's named port.
#                      security          Pod + container securityContext.
#                      natsEnvFromSecret NATS credentials mounted from
#                                        Secret <app.name>-nats-secret (when
#                                        useNatsCreds).
app:
  name: "telark"
  namespace: "telark"
  image:
    registry: "botriack"
    repository: "telark"
  auth:
    bootstrap:
      admins:
        - "houssem.kraoua@gmail.com"
    oidc:
      enabled: true
      googleClientID: "286046819175-kp314vmuu0rd9ig8qcocn4be3e4r5rqp.apps.googleusercontent.com"
      egressAllowed: "true"
      googleJwkJson: ""
    passkey:
      id: "localhost"
      name: "Dashboard App"
      origin: "http://localhost:3000"
      selfRegistration: "true"
  kyverno:
    enabled: true
  ollama:
    enabled: false
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
    accessMode: ReadWriteOnce
  serviceDefaults:
    port: 8080
    serviceType: ClusterIP
    replicas: 1
    terminationGracePeriodSec: 60
  shared:
    redis:
      REDIS_HOST: "telark-release-redis-master"
      REDIS_PORT: "6379"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "512Mi"
        cpu: "500m"
    healthCheck:
      port: http
      livenessProbe:
        path: /api/v1/status/live
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 15
        failureThreshold: 3
      readinessProbe:
        path: /api/v1/status/ready
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 15
        failureThreshold: 3
    security:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      dropCapabilities: ["ALL"]
    natsEnvFromSecret:
      NATS_USER:
        name: "nats"
        key: "username"
      NATS_PASSWORD:
        name: "nats"
        key: "password"

# Per-service configuration. See README.md for the full env reference and gate semantics.
services:
  exporter:
    enabled: true
    name: "exporter-service"
    imageTagPrefix: "exp-"
    version: 3.3.1
    category: "export"
    includeResources: false
    env:
      SNAPSHOTS_PATH: "/snapshots"
      SNAPSHOTS_PVC_NAME: '{{ .Values.app.name }}-exporter-snapshots-pvc'
      SNAPSHOTS_PVC_NAMESPACE: '{{ .Values.app.namespace }}'
      EXPORTER_K8S_CLIENT_QPS: "50"
      EXPORTER_K8S_CLIENT_BURST: "100"
    volumes:
      - name: snapshots-storage
        persistentVolumeClaim:
          claimName: '{{ .Values.app.name }}-exporter-snapshots-pvc'
    volumeMounts:
      - name: snapshots-storage
        path: /snapshots
    pdb:
      enabled: false
  discovery:
    enabled: true
    name: "discovery-service"
    imageTagPrefix: "discovery-"
    version: 1.8.5
    category: "sync"
    replicas: 2
    includeSecurity: false
    useNatsCreds: true
    env:
      DISCOVERY_K8S_CLIENT_QPS: "100"
      DISCOVERY_K8S_CLIENT_BURST: "200"
      DISCOVERY_INFORMER_RESYNC_SEC: "600"
      DISCOVERY_ROLLBACK_INFORMER_RESYNC_SEC: "600"
      DISCOVERY_INFORMER_RESYNC_JITTER_FRACTION: "0.2"
      DISCOVERY_INFORMER_COALESCING_WINDOW_SEC: "5"
      DISCOVERY_INFORMER_COALESCING_MAX_WAIT_SEC: "10"
      DISCOVERY_COALESCE_BUFFER_MAX_ENTRIES: "500"
      DISCOVERY_SNAPSHOT_FETCH_TIMEOUT_MS: "5000"
      COORDINATION_BATCH_SIZE: "10"
      COORDINATION_BATCH_BLOCK_SEC: "2"
      COORDINATION_MAX_RETRY_ATTEMPTS: "5"
      COORDINATION_LOCK_TTL_SEC: "120"
      COORDINATION_LOCK_HEARTBEAT_SEC: "30"
      COORDINATION_ELECTION_TTL_SEC: "15"
      COORDINATION_ELECTION_RENEW_SEC: "5"
      COORDINATION_DEDUP_TTL_SEC: "60"
      COORDINATION_STALE_CLAIM_MIN_IDLE_SEC: "300"
      COORDINATION_STALE_CLAIM_INTERVAL_SEC: "60"
      COORDINATION_SHUTDOWN_CLEANUP_TIMEOUT_SEC: "45"
      REDIS_RETRY_INTERVAL_SEC: "5"
      REDIS_MAX_WAIT_SEC: "180"
      REDIS_PING_TIMEOUT_SEC: "2"
      SNAPSHOT_WRITE_MAX_ATTEMPTS: "5"
      SNAPSHOT_WRITE_RETRY_INTERVAL_SEC: "2"
      PROTECTION_PLAN_TICK_INTERVAL_SEC: "31"
      FORCE_SYNC_WORKERS: "4"
      FORCE_SYNC_STREAM_MAX_LEN: "5000"
      FORCE_SYNC_DEDUP_TTL_SEC: "600"
      FORCE_SYNC_JOB_TIMEOUT_SEC: "300"
      FORCE_SYNC_MAINTENANCE_INTERVAL_SEC: "60"
      FORCE_SYNC_PEL_IDLE_RECLAIM_SEC: "60"
      FORCE_SYNC_ACK_RETENTION_SEC: "3600"
      REST_EXPORTER_DURATION_LOG_ENABLED: "true"
      DISCOVERY_AUTO_CLEANUP_ENABLED: "true"
      DISCOVERY_AUTO_CLEANUP_DELETE_ENABLED: "false"
      DISCOVERY_AUTO_CLEANUP_CYCLE_INTERVAL_SEC: "300"
      DISCOVERY_AUTO_CLEANUP_EMPTY_CYCLES_REQUIRED: "3"
      DISCOVERY_AUTO_CLEANUP_GRACE_PERIOD_SEC: "900"
      REST_EXPORTER_DURATION_LOG_DEDUP_SEC: "10"
    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    pdb:
      enabled: true
  enrichment:
    enabled: true
    name: "enrichment-service"
    imageTagPrefix: "enrich-"
    version: 0.1.0
    category: "ai-enrichment"
    includeResources: false
    includeHealthCheck: false
    env:
      REDIS_POOL_SIZE: "10"
      ENRICHMENT_PROVIDER: "groq"
      OLLAMA_HOST: "http://telark-release-ollama:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
      ANTHROPIC_API_KEY: "***REMOVED***"
      GROQ_MODEL: "llama-3.3-70b-versatile"
      GROQ_API_KEY: "***REMOVED***"
      GEMINI_MODEL: "gemini-2.5-flash"
      GEMINI_API_KEY: "***REMOVED***"
      NUM_WORKERS: "3"
      METRICS_INTERVAL_S: "60"
      WORKER_SHUTDOWN_TIMEOUT_S: "30"
    pdb:
      enabled: false
  notifier:
    enabled: true
    name: "notifier-service"
    imageTagPrefix: "not-"
    version: 0.2.2
    category: "notification"
    terminationGracePeriodSec: 30
    includeResources: false
    includeHealthCheck: false
    useNatsCreds: true
    pdb:
      enabled: false
  auth:
    enabled: true
    name: "auth-service"
    imageTagPrefix: "auth-"
    version: 0.3.1
    category: "auth"
    terminationGracePeriodSec: 30
    env:
      REDIS_DB: "1"
      REDIS_RETRY_INTERVAL_SEC: "2"
      REDIS_MAX_WAIT_SEC: "30"
      REDIS_PING_TIMEOUT_SEC: "3"
      BOOTSTRAP_ADMINS: '{{ join "," .Values.app.auth.bootstrap.admins }}'
      SELF_REGISTRATION_ENABLED: '{{ .Values.app.auth.passkey.selfRegistration }}'
      RP_ID: '{{ .Values.app.auth.passkey.id }}'
      RP_NAME: '{{ .Values.app.auth.passkey.name }}'
      RP_ORIGIN: '{{ .Values.app.auth.passkey.origin }}'
      CHALLENGE_TIMEOUT: "60"
      SESSION_EXPIRY: "24"
      GOOGLE_CLIENT_ID: '{{ .Values.app.auth.oidc.googleClientID }}'
      EGRESS_ALLOWED: '{{ .Values.app.auth.oidc.egressAllowed }}'
      GOOGLE_OIDC_JWK_JSON: '{{ .Values.app.auth.oidc.googleJwkJson }}'
      RECONCILE_TICK_SECONDS: "5"
      RECONCILE_PASS_DEADLINE_SECONDS: "30"
      CLEANUP_WORKERS_PER_TYPE: "2"
      CLEANUP_STREAM_MAXLEN: "10000"
      CLEANUP_LAG_ALERT_THRESHOLD: "500"
      CLEANUP_SWEEPER_INTERVAL_SECONDS: "60"
      CLEANUP_JOB_MAX_ATTEMPTS: "5"
      CLEANUP_DEDUP_TTL_SECONDS: "600"
      CLEANUP_XCLAIM_MIN_IDLE_SECONDS: "60"
      CLEANUP_LIST_TIMEOUT_SECONDS: "10"
      CLEANUP_PATCH_TIMEOUT_SECONDS: "5"
      CLEANUP_MAX_CONCURRENT_PATCHES: "4"
      RECONCILE_BACKOFF_INITIAL_SECONDS: "5"
      RECONCILE_BACKOFF_MAX_SECONDS: "300"
    pdb:
      enabled: false
  ui:
    enabled: false
    name: "ui-service"
    imageTagPrefix: "ui-"
    version: 0.0.1
    category: "ui"
    terminationGracePeriodSec: 30
    includeResources: false
    includeHealthCheck: false
    includeSecurity: false
    useRedis: false
